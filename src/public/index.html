<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Рабочее пространство</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f5f5;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#075e54;color:white;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h1{font-size:15px}
.hright{display:flex;align-items:center;gap:8px;font-size:13px}
.logout{background:transparent;border:1px solid rgba(255,255,255,0.4);color:white;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.app{display:flex;flex:1;overflow:hidden}
.left{display:flex;flex-direction:column;overflow:hidden;min-width:300px;width:75%}
.divider{width:5px;background:#ddd;cursor:col-resize;flex-shrink:0}
.divider:hover,.divider.drag{background:#075e54}
.right{display:flex;flex-direction:column;background:white;min-width:180px;overflow:hidden;flex:1}
.toolbar{padding:8px 12px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.tbtn{border:none;border-radius:5px;padding:5px 11px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tbtn-wbs{background:#1565c0;color:white}
.tbtn-work{background:#2e7d32;color:white}
.tbtn-del{background:#fff0f0;color:#c00;border:1px solid #fcc}
.tbtn-del:hover{background:#ffe0e0}
.level-btns{display:flex;gap:3px;margin-left:auto;align-items:center}
.level-btns span{font-size:11px;color:#666;margin-right:4px}
.lvl-btn{width:26px;height:26px;border:1px solid #ccc;border-radius:4px;background:white;font-size:12px;font-weight:600;cursor:pointer;color:#333}
.lvl-btn:hover{background:#075e54;color:white;border-color:#075e54}
.lvl-btn.active{background:#075e54;color:white;border-color:#075e54}
.proj-area{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:680px}
thead tr{background:#075e54;color:white;position:sticky;top:0;z-index:2}
thead th{padding:8px 8px;text-align:left;font-weight:500;font-size:11px;white-space:nowrap}
.wbs-row td{font-weight:600;padding:7px 8px;border-bottom:1px solid rgba(0,0,0,0.06);cursor:pointer}
.wbs-row.selected td{outline:2px solid #1565c0;outline-offset:-1px}
.work-row td{background:white;padding:6px 8px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.work-row:hover td{background:#f9f9f9}
.work-row.selected td{background:#e8f5e9;outline:2px solid #2e7d32;outline-offset:-1px}
.tri{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;cursor:pointer;font-size:10px;border-radius:3px;flex-shrink:0;transition:transform 0.15s}
.tri:hover{background:rgba(0,0,0,0.08)}
.tri.closed{transform:rotate(-90deg)}
.badge{font-size:10px;padding:1px 5px;border-radius:3px;margin-right:4px;font-weight:500}
.b-wbs{background:#dbeafe;color:#1d4ed8}
.b-work{background:#dcfce7;color:#166534}
.name-input{border:none;background:transparent;font-size:12px;outline:none;width:100%;font-family:sans-serif;font-weight:inherit;color:inherit}
.name-input:focus{border-bottom:1px solid #075e54}
td input[type=date]{border:none;background:transparent;font-size:11px;outline:none;color:#444;cursor:pointer}
td input[type=date]:disabled{color:#ccc;cursor:not-allowed}
td input[type=date]:focus{border-bottom:1px solid #075e54}
td input[type=number]{border:none;background:transparent;font-size:12px;outline:none;width:90px;text-align:right;font-family:sans-serif}
td input[type=number]:focus{border-bottom:1px solid #075e54}
.status-sel{border:none;border-radius:4px;padding:2px 5px;font-size:10px;cursor:pointer;outline:none}
.s-todo{background:#fff3cd;color:#856404}
.s-doing{background:#cce5ff;color:#004085}
.s-done{background:#d4edda;color:#155724}
.sum-auto{color:#1565c0;font-weight:600;font-size:12px;white-space:nowrap}
.pct-wrap{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pct-bar{height:5px;background:#eee;border-radius:3px;width:44px;overflow:hidden;flex-shrink:0}
.pct-fill{height:100%;border-radius:3px;transition:width 0.3s}
.pct-text{font-size:11px;min-width:26px}
.del-x{background:none;border:none;color:#ddd;font-size:14px;cursor:pointer;padding:0 2px;line-height:1}
.del-x:hover{color:#e00}
.sel-hint{font-size:11px;color:#888;font-style:italic}
.right-head{padding:11px 14px;background:#075e54;color:white;font-size:13px;font-weight:bold;flex-shrink:0}
.messages{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:92%;padding:8px 11px;border-radius:10px;font-size:14px;line-height:1.5}
.msg.own{background:#dcf8c6;align-self:flex-end}
.msg.other{background:#f0f0f0;align-self:flex-start}
.mname{font-size:11px;font-weight:bold;color:#075e54;margin-bottom:2px}
.mtime{font-size:10px;color:#999;text-align:right;margin-top:3px}
.file-msg{display:flex;gap:8px;background:#f0f0f0;padding:8px 10px;border-radius:9px;font-size:13px;max-width:92%}
.file-msg.own{background:#dcf8c6;align-self:flex-end}
.bottom{border-top:1px solid #eee;padding:8px 10px;display:flex;gap:7px;align-items:center;flex-shrink:0}
.bottom input[type=text]{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:18px;font-size:14px;outline:none}
.sbtn{background:#075e54;color:white;border:none;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.screen{position:fixed;inset:0;background:#075e54;display:flex;align-items:center;justify-content:center;z-index:99}
.box{background:white;padding:28px;border-radius:16px;text-align:center;width:300px}
.box h2{margin-bottom:6px;color:#075e54}
.box p{font-size:12px;color:#999;margin-bottom:14px}
.box input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:8px}
.box button{width:100%;padding:11px;background:#075e54;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.err{color:red;font-size:11px;margin-top:6px;display:none}
.empty-row td{text-align:center;padding:40px;color:#aaa;font-size:13px;background:white}
</style>
</head>
<body>
<div class="screen" id="ls">
  <div class="box">
    <h2>Войти</h2><p>Введи логин и пароль</p>
    <input id="un" placeholder="Логин"/>
    <input id="up" type="password" placeholder="Пароль"/>
    <button onclick="doLogin()">Войти</button>
    <div class="err" id="er">Неверный логин или пароль</div>
  </div>
</div>
<div class="header">
  <h1>📋 Рабочее пространство</h1>
  <div class="hright"><span id="uLabel"></span><button class="logout" onclick="doLogout()">Выйти</button></div>
</div>
<div class="app" id="appBody">
  <div class="left" id="leftPanel">
    <div class="toolbar">
      <button class="tbtn tbtn-wbs" onclick="addNode('wbs')">+ Уровень WBS</button>
      <button class="tbtn tbtn-work" onclick="addNode('work')">+ Работа</button>
      <button class="tbtn tbtn-del" onclick="delSelected()">✕ Удалить</button>
      <span class="sel-hint" id="selHint">Выбери строку</span>
      <div class="level-btns">
        <span>Свернуть:</span>
        <button class="lvl-btn" id="lb-all" onclick="collapseToLevel(0)">Все</button>
        <button class="lvl-btn" id="lb-1" onclick="collapseToLevel(1)">1</button>
        <button class="lvl-btn" id="lb-2" onclick="collapseToLevel(2)">2</button>
        <button class="lvl-btn" id="lb-3" onclick="collapseToLevel(3)">3</button>
        <button class="lvl-btn" id="lb-4" onclick="collapseToLevel(4)">4</button>
      </div>
    </div>
    <div class="proj-area">
      <table>
        <thead><tr>
          <th style="width:36%">Наименование</th>
          <th>Начало</th>
          <th>Конец</th>
          <th>Сумма</th>
          <th>Статус</th>
          <th>%</th>
          <th style="width:20px"></th>
        </tr></thead>
        <tbody id="wbsBody"></tbody>
      </table>
    </div>
  </div>
  <div class="divider" id="divider"></div>
  <div class="right">
    <div class="right-head">💬 Чат команды</div>
    <div class="messages" id="msgs"></div>
    <div class="bottom">
      <button class="sbtn" onclick="document.getElementById('fi').click()">📎</button>
      <input type="file" id="fi" style="display:none" onchange="sendFile(this.files[0])">
      <input type="text" id="mi" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendMsg()"/>
      <button class="sbtn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let myName='';
let nodes=JSON.parse(localStorage.getItem('wbs_v3')||'[]');
let selectedId=null;

const divider=document.getElementById('divider');
const leftPanel=document.getElementById('leftPanel');
const appBody=document.getElementById('appBody');
let dragging=false;
leftPanel.style.width='75%';
divider.addEventListener('mousedown',()=>{dragging=true;divider.classList.add('drag');document.body.style.cursor='col-resize';document.body.style.userSelect='none';});
document.addEventListener('mousemove',e=>{if(!dragging)return;const r=appBody.getBoundingClientRect();let p=((e.clientX-r.left)/r.width)*100;p=Math.min(Math.max(p,25),88);leftPanel.style.width=p+'%';});
document.addEventListener('mouseup',()=>{dragging=false;divider.classList.remove('drag');document.body.style.cursor='';document.body.style.userSelect='';});

async function doLogin(){
  const u=document.getElementById('un').value.trim();
  const p=document.getElementById('up').value.trim();
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d=await r.json();
  if(d.ok){myName=d.name;document.getElementById('ls').style.display='none';document.getElementById('uLabel').textContent=myName;render();}
  else document.getElementById('er').style.display='block';
}
function doLogout(){myName='';document.getElementById('ls').style.display='flex';}
document.getElementById('up').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function save(){localStorage.setItem('wbs_v3',JSON.stringify(nodes));}

function getDepth(id){
  let d=0,cur=nodes.find(n=>n.id===id);
  while(cur&&cur.parentId){cur=nodes.find(n=>n.id===cur.parentId);d++;}
  return d;
}
function getChildren(id){return nodes.filter(n=>n.parentId===id);}
function getAllDescendants(id){
  let res=[];
  const ch=getChildren(id);
  ch.forEach(c=>{res.push(c);res=res.concat(getAllDescendants(c.id));});
  return res;
}
function calcSum(id){
  const n=nodes.find(n=>n.id===id);
  if(!n)return 0;
  if(n.type==='work')return parseFloat(n.amount)||0;
  return getChildren(id).reduce((s,c)=>s+calcSum(c.id),0);
}
function calcPct(id){
  const n=nodes.find(n=>n.id===id);
  if(!n)return 0;
  if(n.type==='work'){return n.status==='done'?100:n.status==='doing'?50:0;}
  const ch=getChildren(id);
  if(!ch.length)return 0;
  return Math.round(ch.reduce((s,c)=>s+calcPct(c.id),0)/ch.length);
}
function getAutoDate(id,field){
  const n=nodes.find(n=>n.id===id);
  if(!n||n.type==='work')return '';
  const works=getAllDescendants(id).filter(d=>d.type==='work'&&d[field]);
  if(!works.length)return '';
  const dates=works.map(w=>w[field]).sort();
  return field==='dateStart'?dates[0]:dates[dates.length-1];
}

// ✅ ИСПРАВЛЕНО — без ограничений на вложенность
function addNode(type){
  const sel=nodes.find(n=>n.id===selectedId);
  let parentId=null;
  if(type==='wbs'){
    if(sel){
      parentId=sel.type==='wbs'?sel.id:(sel.parentId||null);
    }
  } else {
    if(!sel){alert('Выбери WBS-узел чтобы добавить работу!');return;}
    if(sel.type==='work'){parentId=sel.parentId;}
    else{parentId=sel.id;}
  }
  const id=Date.now();
  nodes.push({id,parentId,type,name:'',amount:'',status:'todo',dateStart:'',dateEnd:'',collapsed:false});
  selectedId=id;
  save();render();
  setTimeout(()=>{const inp=document.getElementById('name_'+id);if(inp)inp.focus();},50);
}

function delSelected(){
  if(!selectedId){alert('Выбери строку для удаления');return;}
  const desc=getAllDescendants(selectedId).map(d=>d.id);
  if((desc.length>0)&&!confirm('Удалить вместе со всеми вложенными элементами?'))return;
  nodes=nodes.filter(n=>n.id!==selectedId&&!desc.includes(n.id));
  selectedId=null;
  save();render();
}
function toggleCollapse(id){
  const n=nodes.find(n=>n.id===id);
  if(n)n.collapsed=!n.collapsed;
  save();render();
}
function collapseToLevel(maxDepth){
  nodes.forEach(n=>{
    if(n.type==='wbs'){
      const d=getDepth(n.id);
      n.collapsed=maxDepth>0&&d>=maxDepth;
    }
  });
  save();render();
}
function update(id,field,val){
  const n=nodes.find(n=>n.id===id);
  if(!n)return;
  if(field==='dateEnd'){
    if(!n.dateStart){alert('Сначала укажи дату начала!');render();return;}
    if(val<n.dateStart){alert('Дата окончания не может быть раньше даты начала!');render();return;}
  }
  if(field==='dateStart'&&n.dateEnd&&n.dateEnd<val){n.dateEnd='';}
  n[field]=val;
  save();render();
}
function selectRow(id){
  selectedId=id;
  const n=nodes.find(n=>n.id===id);
  const hint=document.getElementById('selHint');
  if(n)hint.textContent=n.type==='wbs'?'WBS: '+(n.name||'без названия'):'Работа: '+(n.name||'без названия');
  render();
}
function isVisible(node){
  if(!node.parentId)return true;
  const parent=nodes.find(n=>n.id===node.parentId);
  if(!parent)return true;
  if(parent.collapsed)return false;
  return isVisible(parent);
}
function renderChildren(parentId,depth){
  const ch=getChildren(parentId);
  let html='';
  ch.forEach(n=>{
    if(!isVisible(n))return;
    const pad=10+depth*18;
    const isSelected=n.id===selectedId;
    const sum=calcSum(n.id);
    const pct=calcPct(n.id);
    const pctColor=pct===100?'#28a745':pct>0?'#1565c0':'#ddd';
    const sumFmt=sum?sum.toLocaleString('ru-RU'):'';
    const hasChildren=getChildren(n.id).length>0;
    if(n.type==='wbs'){
      const autoStart=getAutoDate(n.id,'dateStart');
      const autoEnd=getAutoDate(n.id,'dateEnd');
      const triCls=n.collapsed?'tri closed':'tri';
      html+=`<tr class="wbs-row${isSelected?' selected':''}" onclick="selectRow(${n.id})" style="background:${depth%2===0?'#e3f2fd':'#e8eaf6'}">
        <td style="padding-left:${pad}px">
          <span class="${triCls}" onclick="event.stopPropagation();toggleCollapse(${n.id})">${hasChildren?(n.collapsed?'▶':'▼'):'◆'}</span>
          <span class="badge b-wbs">WBS</span>
          <input class="name-input" id="name_${n.id}" value="${n.name}" placeholder="Наименование..." onclick="event.stopPropagation()" onchange="update(${n.id},'name',this.value)">
        </td>
        <td style="font-size:11px;color:#666">${autoStart?new Date(autoStart).toLocaleDateString('ru-RU'):''}</td>
        <td style="font-size:11px;color:#666">${autoEnd?new Date(autoEnd).toLocaleDateString('ru-RU'):''}</td>
        <td class="sum-auto">${sumFmt?sumFmt+' ₽':''}</td>
        <td></td>
        <td><div class="pct-wrap"><span class="pct-text">${pct}%</span><div class="pct-bar"><div class="pct-fill" style="width:${pct}%;background:${pctColor}"></div></div></div></td>
        <td><button class="del-x" onclick="event.stopPropagation();selectedId=${n.id};delSelected()">×</button></td>
      </tr>`;
      if(!n.collapsed)html+=renderChildren(n.id,depth+1);
    } else {
      html+=`<tr class="work-row${isSelected?' selected':''}" onclick="selectRow(${n.id})">
        <td style="padding-left:${pad+4}px">
          <span style="margin-right:4px;color:#999">—</span>
          <span class="badge b-work">Работа</span>
          <input class="name-input" id="name_${n.id}" value="${n.name}" placeholder="Название работы..." onclick="event.stopPropagation()" onchange="update(${n.id},'name',this.value)">
        </td>
        <td><input type="date" value="${n.dateStart}" onclick="event.stopPropagation()" onchange="update(${n.id},'dateStart',this.value)"></td>
        <td><input type="date" value="${n.dateEnd}" ${!n.dateStart?'disabled':''} min="${n.dateStart||''}" onclick="event.stopPropagation()" onchange="update(${n.id},'dateEnd',this.value)"></td>
        <td><input type="number" value="${n.amount}" placeholder="0" onclick="event.stopPropagation()" onchange="update(${n.id},'amount',this.value)"></td>
        <td><select class="status-sel s-${n.status}" onclick="event.stopPropagation()" onchange="update(${n.id},'status',this.value)">
          <option value="todo" ${n.status==='todo'?'selected':''}>Ожидает</option>
          <option value="doing" ${n.status==='doing'?'selected':''}>В работе</option>
          <option value="done" ${n.status==='done'?'selected':''}>Готово</option>
        </select></td>
        <td><div class="pct-wrap"><span class="pct-text">${pct}%</span><div class="pct-bar"><div class="pct-fill" style="width:${pct}%;background:${pctColor}"></div></div></div></td>
        <td><button class="del-x" onclick="event.stopPropagation();selectedId=${n.id};delSelected()">×</button></td>
      </tr>`;
    }
  });
  return html;
}
function render(){
  const tbody=document.getElementById('wbsBody');
  const roots=nodes.filter(n=>!n.parentId);
  if(!roots.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="7">Нажми «+ Уровень WBS» чтобы начать</td></tr>';
    return;
  }
  tbody.innerHTML=renderChildren(null,0);
}
function now(){const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
function sendMsg(){
  const inp=document.getElementById('mi');const text=inp.value.trim();
  if(!text||!myName)return;
  socket.emit('message',{name:myName,text,time:now()});inp.value='';
}
socket.on('message',data=>{
  const div=document.createElement('div');
  div.className='msg '+(data.name===myName?'own':'other');
  div.innerHTML=(data.name!==myName?'<div class="mname">'+data.name+'</div>':'')+data.text+'<div class="mtime">'+data.time+'</div>';
  document.getElementById('msgs').appendChild(div);
  document.getElementById('msgs').scrollTop=9999;
});
async function sendFile(file){
  if(!file||!myName)return;
  const fd=new FormData();fd.append('file',file);
  const r=await fetch('/upload',{method:'POST',body:fd});
  const d=await r.json();
  socket.emit('file',{name:myName,filename:d.filename,originalname:d.originalname,size:d.size,time:now()});
}
socket.on('file',data=>{
  const div=document.createElement('div');
  div.className='file-msg '+(data.name===myName?'own':'');
  const kb=Math.round(data.size/1024);
  div.innerHTML='📄 <div><b>'+data.originalname+'</b><br><small>'+kb+' КБ · '+data.name+'</small><br><a href="/uploads/'+data.filename+'" download style="color:#075e54">скачать</a></div>';
  document.getElementById('msgs').appendChild(div);document.getElementById('msgs').scrollTop=9999;
});
</script>
</body>
</html>
