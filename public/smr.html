<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMR</title>
<style>body{font:13px system-ui,sans-serif;margin:0;padding:20px;background:#f5f6fb;color:#1f2a44}h1{font-size:16px;margin:0 0 14px}.c{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:14px;margin-bottom:14px;max-width:760px}button,a.b{font:inherit;padding:6px 12px;border:1px solid #cfd3ea;border-radius:8px;background:#fff;cursor:pointer;color:#3b3a6b;text-decoration:none;display:inline-block}table{border-collapse:collapse;width:100%;margin-top:8px}td,th{border-bottom:1px solid #eef0f4;padding:6px 8px;text-align:left}.m{color:#6b7280;margin-top:8px}</style></head>
<body><div id="app"></div>
<script>
(function(){
var T={h:'\u0421\u041c\u0420: \u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0430 \u0438 \u0432\u044b\u0433\u0440\u0443\u0437\u043a\u0430 (\u0448\u0430\u0433 1)',up:'\u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c',ex:'\u0412\u044b\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u0432\u0441\u0451',code:'\u041a\u043e\u0434',name:'\u041d\u0430\u0437\u0432\u0430\u043d\u0438\u0435',rows:'\u0421\u0442\u0440\u043e\u043a',none:'\u041f\u043e\u043a\u0430 \u043d\u0435\u0442 \u0434\u0430\u043d\u043d\u044b\u0445',hint:'\u0424\u0430\u0439\u043b .xlsx, 9 \u043a\u043e\u043b\u043e\u043d\u043e\u043a: \u041a\u043e\u0434 \u043e\u0431\u044a\u0435\u043a\u0442\u0430, \u041d\u0430\u0437\u0432\u0430\u043d\u0438\u0435, \u0414\u0438\u0441\u0446\u0438\u043f\u043b\u0438\u043d\u0430, \u0422\u0438\u043f, \u0412\u0438\u0434, \u0415\u0434.\u0438\u0437\u043c, \u041e\u0431\u044a\u0451\u043c, \u0427\u0435\u043b-\u0447, \u041c\u0430\u0448-\u0447. \u041e\u0431\u044a\u0435\u043a\u0442 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u0435\u0442\u0441\u044f \u043f\u043e \u043a\u043e\u0434\u0443 \u0432 \u0444\u0430\u0439\u043b\u0435.',done:'\u0413\u043e\u0442\u043e\u0432\u043e',err:'\u041e\u0448\u0438\u0431\u043a\u0430'};
var a=document.getElementById('app');
a.innerHTML='<h1>'+T.h+'</h1><div class="c"><input type="file" id="f" accept=".xlsx"> <button id="u">'+T.up+'</button><div class="m">'+T.hint+'</div><div id="r" class="m"></div></div><div class="c"><a class="b" href="/api/smr/export">'+T.ex+'</a><div id="l"></div></div>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function list(){fetch('/api/smr/summary').then(function(r){return r.json();}).then(function(d){var l=document.getElementById('l');if(!d.length){l.innerHTML='<div class="m">'+T.none+'</div>';return;}var h='<table><tr><th>'+T.code+'</th><th>'+T.name+'</th><th>'+T.rows+'</th><th></th></tr>';d.forEach(function(o){h+='<tr><td>'+esc(o.code)+'</td><td>'+esc(o.name)+'</td><td>'+o.rows+'</td><td><a class="b" href="/api/smr/export?code='+encodeURIComponent(o.code)+'">.xlsx</a></td></tr>';});l.innerHTML=h+'</table>';}).catch(function(){});}
document.getElementById('u').onclick=function(){var f=document.getElementById('f').files[0],r=document.getElementById('r');if(!f){return;}var fd=new FormData();fd.append('file',f);r.textContent='...';fetch('/api/smr/import',{method:'POST',body:fd}).then(function(x){return x.json().then(function(j){return {ok:x.ok,j:j};});}).then(function(o){if(!o.ok){r.textContent=T.err+': '+(o.j.message||'');return;}r.innerHTML=T.done+': '+o.j.results.map(function(x){return esc(x.code)+' ('+x.rows+')';}).join(', ');list();}).catch(function(e){r.textContent=T.err+': '+e.message;});};
list();
})();
</script></body></html>
