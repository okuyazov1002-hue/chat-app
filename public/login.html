<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>UPMO</title><style>body{font-family:Arial;background:linear-gradient(160deg,#6A5BD6 0%,#5B94D0 50%,#5FD2B0 100%);display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}.card{background:#fff;border-radius:0;width:380px;box-shadow:0 8px 32px rgba(0,0,0,0.2);}h1{text-align:center;padding:40px 40px 0 40px;margin:0 0 30px 0;color:#0a1e3d;}.form-wrap{padding:0 0 40px 0;}input{width:calc(100% - 20px);padding:12px;margin:0 10px;transition:all 0.2s;border:none;border-radius:0;box-sizing:border-box;font-size:14px;outline:none;}input:hover{width:calc(100% - 10px);margin:0 5px;}
input:focus{border-color:#2c5364;box-shadow:inset 0 0 8px rgba(44,83,100,0.1);}button{display:block;width:40%;padding:12px;margin:20px auto 0 auto;background:#2c5364;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:16px;transition:all 0.2s;}button:hover{background:#1a3a47;transform:translateY(-2px);}.error{color:#dc2626;text-align:center;margin-top:10px;font-size:14px;padding:0 40px;}</style><link rel="icon" type="image/svg+xml" href="/favicon.svg"><style>html{background:#fbfbfe!important}body{background:transparent!important}.card{opacity:0;transition:opacity .5s}body.ready .card{opacity:1}</style><script>setTimeout(function(){if(document.body){document.body.classList.add("ready");}},2500);</script></head><body><div class="card"><div style="background:#fff;padding:24px 40px;"><div id="upmoLogo"></div></div><div class="form-wrap"><form id="form"><input type="text" id="username" placeholder="Логин" required><input type="password" id="password" placeholder="Пароль" required><button type="submit">Войти</button><div class="error" id="error"></div></form></div></div><script>document.getElementById("form").addEventListener("submit",async(e)=>{e.preventDefault();const res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});if(res.ok){var cd=document.querySelector(".card");if(cd&&window.upmoMorph){cd.style.transition="translate 1.1s cubic-bezier(.22,1,.36,1),opacity .9s ease";cd.style.translate=window.innerWidth+"px 0";cd.style.opacity="0";try{sessionStorage.setItem("upmoIntro","1");}catch(e){}window.upmoMorph(function(){window.location.href="/";});setTimeout(function(){window.location.href="/";},4000);}else{window.location.href="/";}}else{document.getElementById("error").textContent="Ошибка входа";}});</script><script src="/upmo-logo.js"></script><script src="/login-eye.js"></script><script src="/cloud-bg.js"></script>
</body></html>
