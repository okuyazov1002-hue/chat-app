<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Отчётность</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f2027;
      overflow: hidden;
    }

    /* Анимированный чертёж на фоне */
    .bg {
      position: fixed;
      inset: -10%;
      background: url("/assets/genplan-bg.jpg") center / cover no-repeat;
      animation: drift 60s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes drift {
      0%   { transform: scale(1.05) translate(0, 0); }
      50%  { transform: scale(1.15) translate(-2%, -1.5%); }
      100% { transform: scale(1.08) translate(2%, 1.5%); }
    }

    /* Затемнение поверх чертежа, чтобы карточка читалась */
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(15,32,39,0.82), rgba(44,83,100,0.72));
    }

    /* Светящиеся круги на фоне */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: 0;
    }
    .blob1 { width: 420px; height: 420px; background: #4a6cf7; top: -110px; left: -110px; }
    .blob2 { width: 360px; height: 360px; background: #9b59f6; bottom: -90px; right: -90px; }
    .blob3 { width: 260px; height: 260px; background: #2dd4bf; top: 55%; left: 12%; }

    /* Стеклянная карточка */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      margin: 8px;
      padding: 42px 34px;
      border-radius: 0;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 30px;
    }
    h1 .title-top {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }
    h1 .title-line {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.2px;
      line-height: 1.3;
    }

    label {
      display: block;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 7px;
      margin-left: 4px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 18px;
      font-size: 16px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      transition: all 0.25s ease;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.4); }
    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.5);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }
    button:hover { background: rgba(255, 255, 255, 0.32); transform: translateY(-1px); }
    button:active { transform: scale(0.98); }

    .error {
      color: #ffb4b4;
      font-size: 14px;
      text-align: center;
      margin-bottom: 14px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
        <h1>
      <span class="title-top">Единый портал</span>
    </h1>
    <img src="/logo_white.png" alt="ДСОМК" style="width:100%;max-width:280px;height:auto;display:block;margin:12px 0 20px;">
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label>Логин</label>
      <input type="text" name="username" placeholder="Введите логин" required>
      <label>Пароль</label>
      <input type="password" name="password" placeholder="Введите пароль" required>
      <button type="submit">Войти</button>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (res.ok) {
        window.location.href = "/";
      } else {
        const err = await res.json();
        document.getElementById("error").textContent = err.message;
      }
    });
  </script>
</body>
</html>
