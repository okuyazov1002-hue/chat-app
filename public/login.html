<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Отчётность</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f2027;
      overflow: hidden;
    }

    /* Анимированный чертёж на фоне */
    .bg {
      position: fixed;
      inset: -10%;
      background: url("/assets/genplan-bg.jpg") center / cover no-repeat;
      animation: drift 60s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes drift {
      0%   { transform: scale(1.05) translate(0, 0); }
      50%  { transform: scale(1.15) translate(-2%, -1.5%); }
      100% { transform: scale(1.08) translate(2%, 1.5%); }
    }

    /* Затемнение поверх чертежа, чтобы карточка читалась */
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(15,32,39,0.82), rgba(44,83,100,0.72));
    }

    /* Светящиеся круги на фоне */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: 0;
    }
    .blob1 { width: 420px; height: 420px; background: #4a6cf7; top: -110px; left: -110px; }
    .blob2 { width: 360px; height: 360px; background: #9b59f6; bottom: -90px; right: -90px; }
    .blob3 { width: 260px; height: 260px; background: #2dd4bf; top: 55%; left: 12%; }

    /* Стеклянная карточка */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 0;
      padding: 60px 34px;
      border-radius: 0;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 30px;
    }
    h1 .title-top {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }
    h1 .title-line {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.2px;
      line-height: 1.3;
    }

    label {
      display: block;
      font-size: 13px;
      color: rgba(15, 32, 39, 0.65);
      margin-bottom: 7px;
      margin-left: 4px;
    }

    input {
      width: 100%;
      padding: 22px 16px;
      margin-bottom: 0;
      font-size: 16px;
      color: #0f2027;
      background: #f4f6f7;
      border: none;
      border-radius: 0;
      transition: all 0.25s ease;
    }
    input::placeholder { color: rgba(15, 32, 39, 0.35); }
    input:focus {
      outline: none;
      background: #ffffff;
    }
    input[name="username"] { border-bottom: none; margin-bottom: 0; }

    .password-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .password-wrap input {
      padding-top: 22px;
      padding-bottom: 22px;
      padding-right: 46px;
      margin-bottom: 0;
    }
    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      padding: 4px;
      margin: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(15, 32, 39, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-pass:hover { color: rgba(15, 32, 39, 0.75); }
    .toggle-pass svg { width: 20px; height: 20px; }

    .fields-wrap { margin: 0 -34px; }
    .fields-wrap input { padding-left: 34px; padding-right: 34px; }
    .fields-wrap .password-wrap input { padding-right: 68px; }
    .fields-wrap .toggle-pass { right: 40px; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      background: #2c5364;
      border: 1px solid #2c5364;
      border-radius: 0;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    button:hover { background: #23424f; transform: translateY(-1px); }
    button:active { transform: scale(0.98); }

    #togglePass,
    #togglePass:hover,
    #togglePass:active,
    #togglePass:focus {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      transform: translateY(-50%) !important;
      padding: 4px !important;
    }

    .error {
      color: #d64545;
      font-size: 14px;
      text-align: center;
      margin-bottom: 14px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <img src="/logo_white.png" alt="ДСОМК" style="width:100%;max-width:280px;height:auto;display:block;margin:0 auto 24px;filter:drop-shadow(0 4px 14px rgba(0,0,0,0.35));">
    <div class="error" id="error"></div>
    <form id="loginForm">
      <div class="fields-wrap">
        <input type="text" name="username" placeholder="Введите логин" required>
        <div class="password-wrap">
          <input type="password" name="password" id="passwordInput" placeholder="Введите пароль" required>
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Показать пароль">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit">Войти</button>
    </form>
  </div>

  <script>
    document.getElementById("togglePass").addEventListener("click", () => {
      const input = document.getElementById("passwordInput");
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      document.getElementById("togglePass").setAttribute(
        "aria-label",
        isHidden ? "Скрыть пароль" : "Показать пароль"
      );
      document.getElementById("eyeIcon").innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.86 21.86 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.86 21.86 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (res.ok) {
        window.location.href = "/";
      } else {
        const err = await res.json();
        document.getElementById("error").textContent = err.message;
      }
    });
  </script>
</body>
</html>
