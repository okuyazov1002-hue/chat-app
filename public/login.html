<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Отчётность</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
    }
    h1 { font-size: 22px; margin-bottom: 24px; text-align: center; color: #1a1a2e; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #4a6cf7; }
    button {
      width: 100%;
      padding: 12px;
      background: #4a6cf7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #3a5ce5; }
    .error { color: #e74c3c; font-size: 14px; margin-bottom: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Вход в систему отчётности</h1>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label>Логин</label>
      <input type="text" name="username" required>
      <label>Пароль</label>
      <input type="password" name="password" required>
      <button type="submit">Войти</button>
    </form>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (res.ok) {
        window.location.href = "/";
      } else {
        const err = await res.json();
        document.getElementById("error").textContent = err.message;
      }
    });
  </script>
</body>
</html>
