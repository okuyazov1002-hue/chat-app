        const eq = ((r.obj || "").trim() + "|" + (r.equip || "").trim()).replace(/\s+/g, " ").toLowerCase();
        if (!eqAll[eq]) eqAll[eq] = { all: 0, fin: 0 };
        eqAll[eq].all++;
        if (/заверш/i.test(r.status || "") || !!r.factEnd) eqAll[eq].fin++;
      });
      const keys = Object.keys(eqAll);
      const total = keys.length;
      const done = keys.filter(k => eqAll[k].fin === eqAll[k].all).length;
      const cost = sup.reduce((s, r) => s + (r.cost || 0), 0);
      const doneMoney = sup.reduce((s, r) => s + (r.done || 0), 0);
      const pct = cost ? Math.round(doneMoney / cost * 100) : 0;
      const starts = sup.filter(r => r.planStart).map(r => +new Date(r.planStart));
      const ends = sup.filter(r => r.planEnd).map(r => +new Date(r.planEnd));
      const fmt2s = d => `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getFullYear()).slice(2)}`;
      const start = starts.length ? fmt2s(new Date(Math.min(...starts))) : "—";
      const end = ends.length ? fmt2s(new Date(Math.max(...ends))) : "—";
      return `<div class="stage-summary"><span>${start} → ${end}</span><span>Оборудование: <b>${total}</b> · Готово: <b>${done}</b> · Остаток: <b>${total - done}</b> · Выполнено: <b>${pct}%</b></span></div>`;
    }
    function supplyTable(rows) {
      // Единица счёта — уникальное оборудование (r.equip). Для каждого вида работы:
      // у скольких единиц оборудования он завершён (статус "Завершено" или есть факт. окончание).
      const sup = rows.filter(r => (r.equip || "").trim() && ["поставка", "изготовлен", "логистик"].some(x => (r.stage || "").toLowerCase().includes(x)));
      const eqKey = r => ((r.obj || "").trim() + "|" + (r.equip || "").trim()).replace(/\s+/g, " ").toLowerCase();
      const totalEquip = new Set(sup.map(eqKey)).size;
      const data = {};
      sup.forEach(r => {
        const work = (r.item || "").trim().replace(/\s+/g, " ").toLowerCase();
        const eq = eqKey(r);
        if (!data[work]) data[work] = { total: new Set(), done: new Set() };
        data[work].total.add(eq);
        const finished = /заверш/i.test(r.status || "") || !!r.factEnd;
        if (finished) data[work].done.add(eq);
      });
      return SUPPLY_STAGES.map(name => {
        const d = data[name.toLowerCase()];
        if (!d || !d.total.size) return `<tr><td>${name}</td><td class="st-num">—</td><td class="st-delta">—</td></tr>`;
        const left = d.total.size - d.done.size;
        const cls = left > 0 ? "st-bad" : "st-good";
        return `<tr><td>${name}</td><td class="st-num">${d.done.size}</td><td class="st-delta ${cls}">${left > 0 ? "ост. " + left : "готово"}</td></tr>`;
      }).join("");
    }
    function stageTable(rows, stageFilter) {
      const groups = {};
      const now = new Date();
      rows.filter(r => stageFilter.some(s => (r.stage || "").toLowerCase().includes(s))).forEach(r => {
        const clean = (r.item || "Без дисциплины").trim().replace(/\s+/g, " ");
        const key = clean.toLowerCase();
        if (!groups[key]) groups[key] = { name: clean[0].toUpperCase() + clean.slice(1).toLowerCase(), cost: 0, done: 0, plan: 0, starts: [], ends: [] };
        const g = groups[key];
        g.cost += r.cost || 0;
        g.done += r.done || 0;
        if (r.planStart && r.planEnd) {
          const ps = new Date(r.planStart), pe = new Date(r.planEnd);
          g.starts.push(+ps); g.ends.push(+pe);
          if (now >= pe) g.plan += r.cost || 0;
          else if (now > ps) g.plan += (r.cost || 0) * (now - ps) / (pe - ps);
        }
      });
      const keys = Object.keys(groups);
      if (!keys.length) return `<tr><td class="st-empty" colspan="5">Нет данных</td></tr>`;
      const fmt2 = d => `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getFullYear()).slice(2)}`;
      return keys.map(k => {
        const g = groups[k];
        const planPct = g.cost ? Math.round(g.plan / g.cost * 100) : 0;
        const factPct = g.cost ? Math.round(g.done / g.cost * 100) : 0;
        const delta = factPct - planPct;
        const cls = delta < 0 ? "st-bad" : "st-good";
        const dates = g.starts.length ? fmt2(new Date(Math.min(...g.starts))) + " → " + fmt2(new Date(Math.max(...g.ends))) : "—";
        return `<tr><td>${g.name}</td><td class="st-num">${planPct}%</td><td class="st-num">${factPct}%</td><td class="st-delta ${cls}">${delta < 0 ? delta : "+" + delta}%</td><td class="st-date">${dates}</td></tr>`;
      }).join("");
    }

    function buildChart(code, rows) {
      const byMonth = {};
      rows.forEach(r => {
        if (!r.planStart || !r.planEnd) return;
        const ps = new Date(r.planStart), pe = new Date(r.planEnd);
        const months = (pe.getFullYear() - ps.getFullYear()) * 12 + (pe.getMonth() - ps.getMonth()) + 1;
        const perMonth = (r.cost || 0) / months;
        const d = new Date(ps.getFullYear(), ps.getMonth(), 1);
        for (let i = 0; i < months; i++) {
          const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          byMonth[key] = byMonth[key] || { plan: 0, fact: 0 };
          byMonth[key].plan += perMonth;
          d.setMonth(d.getMonth() + 1);
        }
      });
      rows.forEach(r => {
        if (!r.factStart) return;
        const fs = new Date(r.factStart);
        const fe = r.factEnd ? new Date(r.factEnd) : new Date();
        const months = (fe.getFullYear() - fs.getFullYear()) * 12 + (fe.getMonth() - fs.getMonth()) + 1;
        const perMonth = (r.done || 0) / months;
        const d = new Date(fs.getFullYear(), fs.getMonth(), 1);
        for (let i = 0; i < months; i++) {
          const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          byMonth[key] = byMonth[key] || { plan: 0, fact: 0 };
          byMonth[key].fact += perMonth;
          d.setMonth(d.getMonth() + 1);
        }
      });
      const keys = Object.keys(byMonth).sort();
      const total = rows.reduce((s, r) => s + (r.cost || 0), 0) || 1;
      const now = new Date();
      const nowKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
      let cp = 0, cf = 0;
      const monthLabels = [], planCum = [], factCum = [], planPer = [], factPer = [];
      const yearOf = [];
      keys.forEach(k => {
        cp += byMonth[k].plan; cf += byMonth[k].fact;
        monthLabels.push(k.slice(5, 7));
        yearOf.push(k.slice(0, 4));
        planCum.push(Math.round(cp / total * 100));
        factCum.push(k <= nowKey ? Math.round(cf / total * 100) : null);
        planPer.push(Math.round(byMonth[k].plan / total * 100 * 10) / 10);
        factPer.push(k <= nowKey ? Math.round(byMonth[k].fact / total * 100 * 10) / 10 : null);
      });
      const yearGroups = [];
      yearOf.forEach((y, idx) => {
        if (!yearGroups.length || yearGroups[yearGroups.length - 1].year !== y) yearGroups.push({ year: y, start: idx, end: idx });
        else yearGroups[yearGroups.length - 1].end = idx;
      });
      const labels = monthLabels.map((mm, idx) => {
        const grp = yearGroups.find(g => idx >= g.start && idx <= g.end);
        const centerIdx = grp ? Math.floor((grp.start + grp.end) / 2) : -1;
        return [mm, idx === centerIdx ? grp.year : ""];
      });
      const yearBoundaries = yearGroups.slice(1).map(g => g.start);
      if (charts[code]) charts[code].destroy();
      charts[code] = new Chart(document.getElementById("chart-" + code), {
        data: {
          labels,
          datasets: [
            { type: "line", label: "План накопительно", data: planCum, borderColor: "#0a1e3d", borderWidth: 2.5, pointRadius: 0, tension: 0.3 },
            { type: "line", label: "Факт накопительно", data: factCum, borderColor: "#7da7d9", borderWidth: 2.5, pointRadius: 0, tension: 0.3 },
            { type: "bar", label: "План за месяц", data: planPer, backgroundColor: "#0a1e3d", yAxisID: "y1" },
            { type: "bar", label: "Факт за месяц", data: factPer, backgroundColor: "#7da7d9", yAxisID: "y1" }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
          scales: {
            y: { min: 0, max: 100, ticks: { callback: v => v + "%" } },
            y1: { display: false, min: 0, max: Math.max(1, ...planPer, ...factPer.filter(v => v !== null)) * 3 },
            x: {
              grid: {
                display: true,
                color: (ctx) => yearBoundaries.includes(ctx.index) ? "rgba(10,22,40,0.35)" : "transparent",
                lineWidth: (ctx) => yearBoundaries.includes(ctx.index) ? 1.5 : 0
              },
              ticks: { font: { size: 10 }, maxRotation: 45 }
            }
          }
        }
      });
    }

    function ganttHtml(items) {
      const today = new Date().toISOString().slice(0, 10);
      const has = items.filter(i => i.s);
      if (!has.length) return `<div class="st-empty">Нет данных для диаграммы</div>`;
      const min = has.map(i => i.s).sort()[0];
      let max = has.map(i => i.e || i.s).sort().slice(-1)[0];
      if (!max || max <= min) max = today > min ? today : min;
      const minD = new Date(min + "T00:00:00"), maxD = new Date(max + "T00:00:00");
      const bufStart = new Date(minD.getFullYear(), minD.getMonth() - 1, 1);
      const bufEnd = new Date(new Date(maxD.getFullYear(), maxD.getMonth() + 2, 1).getTime() - 1);
      const t0 = bufStart.getTime(), t1 = bufEnd.getTime();
      const pos = d => Math.max(0, Math.min(100, (new Date(d).getTime() - t0) / (t1 - t0 || 1) * 100));

      const months = [];
      const cur = new Date(bufStart);
      while (cur.getTime() <= t1) {
        const monthStart = new Date(cur.getFullYear(), cur.getMonth(), 1).getTime();
        const monthEndEx = new Date(cur.getFullYear(), cur.getMonth() + 1, 1).getTime();
        const segStart = Math.max(monthStart, t0);
        const segEnd = Math.min(monthEndEx, t1);
        const w = Math.max(0, (segEnd - segStart) / (t1 - t0 || 1) * 100);
        months.push({ y: cur.getFullYear(), m: cur.getMonth() + 1, w });
        cur.setMonth(cur.getMonth() + 1);
      }
      const years = {};
      months.forEach(mo => years[mo.y] = (years[mo.y] || 0) + mo.w);
      let yearRow = `<span style="width:180px;display:flex"><span style="width:180px"></span></span><span style="width:124px;text-align:center">Плановый</span>`;
      Object.keys(years).sort().forEach(y => { yearRow += `<span style="width:${years[y]}%">${y}</span>`; });
      let monthRow = `<span style="width:180px;display:flex"><span style="width:180px"></span></span><span style="width:62px;text-align:center">начало</span><span style="width:62px;text-align:center">окончание</span>`;
      months.forEach(mo => { monthRow += `<span style="width:${mo.w}%">${String(mo.m).padStart(2, "0")}</span>`; });
      const nowPos = pos(today);
      const fmtD = d => d ? d.slice(8,10) + "." + d.slice(5,7) + "." + d.slice(2,4) : "—";

      let rowsHtml = "";
      items.forEach(i => {
        if (!i.s) {
          rowsHtml += `<div class="pg-row"><span class="pg-name">${i.name}</span>
            <span class="pg-cell">—</span><span class="pg-cell">—</span>
            <div class="pg-track"></div></div>`;
          return;
        }
        const e = i.e || today;
        const left = pos(i.s), width = Math.max(1.5, pos(e) - pos(i.s));
        const bar = `<div class="pg-bar" style="left:${left}%;width:${width}%"></div>`;
        rowsHtml += `<div class="pg-row">
          <span class="pg-name">${i.name}</span>
          <span class="pg-cell">${fmtD(i.s)}</span><span class="pg-cell">${fmtD(i.e)}</span>
          <div class="pg-track">${bar}</div></div>`;
      });
      return `<div class="prep-gantt proj-gantt">
        <div class="pg-scale-year">${yearRow}</div>
        <div class="pg-scale-month">${monthRow}</div>
        <div class="pg-body">
          <div class="pg-now" style="left:calc(304px + (100% - 304px) * ${(nowPos / 100).toFixed(3)})"></div>
          ${rowsHtml}
        </div>
      </div>`;
    }

    async function saveComment(code) {
      const text = document.getElementById("comment-" + code).value;
      const res = await fetch("/api/reports/" + code, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ comment: text })
      });
      if (!res.ok) alert("Ошибка сохранения комментария");
    }

    // Раскрытие/скрытие панели проекта
    document.querySelectorAll(".project-item").forEach(item => {
      item.addEventListener("click", () => {
        const code = item.dataset.code;
        const panel = document.getElementById("panel-" + code);
        const isOpen = panel.classList.contains("open");
        item.classList.toggle("open", !isOpen);
        panel.classList.toggle("open", !isOpen);
        if (!isOpen) renderDashboard(code);
      });
    });
  </script>
