<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДСОМК — Отчётность</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --dim: 0.75; }

    body {
      font-family: -apple-system, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      background: #0a1628;
    }

    .bg {
      position: fixed;
      inset: -10%;
      background: url("/assets/genplan-bg.jpg") center / cover no-repeat;
      animation: drift 60s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes drift {
      0%   { transform: scale(1.05) translate(0, 0); }
      50%  { transform: scale(1.15) translate(-2%, -1.5%); }
      100% { transform: scale(1.08) translate(2%, 1.5%); }
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #0a1e3d;
      opacity: var(--dim);
    }

    /* Шапка */
    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(10, 22, 40, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Логотип */
    .logo { display: flex; align-items: center; gap: 14px; color: #fff; }
    .logo-mark {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: #fff;
      color: #0a1628;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; letter-spacing: 0.5px;
    }
    .logo-text .title { font-size: 15px; font-weight: 700; letter-spacing: 0.4px; }
    .logo-text .subtitle { font-size: 11.5px; color: rgba(255,255,255,0.65); margin-top: 2px; }

    /* Навигация по разделам */
    .nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-btn {
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      background: none;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.22);
    }

    /* Кнопка пользователя */
    .user-menu { position: relative; }
    .user-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 18px;
      font-size: 15px; font-weight: 600; color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .user-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .user-btn .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: #fff; color: #0a1628;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }

    /* Выпадающее меню */
    .dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 210px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(10, 22, 40, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      display: none;
    }
    .dropdown.open { display: block; }
    .dropdown button {
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      padding: 11px 14px;
      font-size: 14.5px;
      color: #fff;
      background: none;
      border: none;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
    }
    .dropdown button:hover { background: rgba(255, 255, 255, 0.12); }
    .dropdown .danger { color: #ffb4b4; }

    /* Контент */
    .content {
      position: relative;
      z-index: 1;
      padding: 40px 28px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 17px;
    }

    /* Вкладки и списки проектов */
    .tab { display: none; }
    .tab.active { display: block; }
    .tab-title { color: #fff; font-size: 22px; margin-bottom: 20px; }
    .tab-empty { color: rgba(255,255,255,0.6); }

    .project-list { display: flex; flex-direction: column; gap: 10px; }
    .project-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .project-item:hover {
      background: rgba(255, 255, 255, 0.13);
      transform: translateX(4px);
    }
    .project-code {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 8px;
      background: #fff;
      color: #0a1628;
      font-size: 13px;
      font-weight: 700;
      font-family: "Consolas", monospace;
    }
    .project-name { color: #fff; font-size: 15px; }
    .project-panel {
      display: none;
      background: #fff;
      border-radius: 0 0 14px 14px;
      margin-top: -10px;
      padding: 16px 18px;
      overflow: hidden;
    }
    .project-panel.open { display: block; }
    .project-item.open {
      border-radius: 14px 14px 0 0;
    }

    .panel-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
    }
    .panel-btn {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #0a1628;
      background: #eef1f5;
      border: 1px solid #d5dae1;
      border-radius: 8px;
      cursor: pointer;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8px;
      background: #fff;
      color: #000;
    }
    .report-table th {
      background: #000;
      color: #fff;
      padding: 4px 6px;
      text-align: left;
      white-space: nowrap;
      border: 1px solid #333;
    }
    .report-table td {
      padding: 3px 6px;
      border: 1px solid #ddd;
      white-space: nowrap;
    }

    /* Модальное окно смены пароля */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 380px;
      margin: 16px;
      padding: 32px 30px;
      border-radius: 24px;
      background: rgba(10, 22, 40, 0.85);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .modal h2 { color: #fff; font-size: 19px; margin-bottom: 20px; text-align: center; }
    .modal input {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 14px;
      font-size: 15px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
    }
    .modal input:focus { outline: none; border-color: rgba(255,255,255,0.45); }
    .modal .row { display: flex; gap: 10px; margin-top: 6px; }
    .modal .row button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      border: none;
    }
    .btn-save { background: #fff; color: #0a1628; }
    .btn-cancel { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2) !important; }
    .modal .msg { font-size: 13.5px; text-align: center; margin-bottom: 10px; min-height: 17px; }
    .msg.ok { color: #a7f3d0; }
    .msg.err { color: #ffb4b4; }
  
    /* ===== ДАШБОРД ===== */
    .panel-dashboard { padding: 14px 14px 0; }
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .kpi-card {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .kpi-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .kpi-big { font-size: 20px; font-weight: 700; color: #0a1628; white-space: nowrap; margin-bottom: 8px; }
    .kpi-mid { font-size: 14px; font-weight: 600; color: #0a1628; }
    .kpi-flex { display: flex; gap: 18px; }
    .kpi-dates { font-size: 15px; font-weight: 700; color: #0a1628; white-space: nowrap; margin-bottom: 8px; }
    .kpi-wide { grid-column: span 2; }
    .kpi-comment { font-size: 12.5px; color: #374151; line-height: 1.5; }
    .kpi-comment-edit {
      width: 100%;
      min-height: 60px;
      border: none;
      padding: 0;
      font-size: 12.5px;
      color: #374151;
      line-height: 1.5;
      font-family: inherit;
      resize: none;
      background: transparent;
      outline: none;
    }
    .kpi-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .kpi-badge.bad { background: #fde8e8; color: #b91c1c; }
    .kpi-badge.good { background: #e8eef8; color: #0a1e3d; }

  </style>
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="logo">
      <div class="logo-mark">ДС</div>
      <div class="logo-text">
        <div class="title">ДСОМК</div>
        <div class="subtitle">Дирекция Строительства Объектов Металлургического Комплекса</div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-btn active" data-tab="schedule">Общий график</button>
      <button class="nav-btn" data-tab="prep">Подготовительные работы</button>
      <button class="nav-btn" data-tab="main">Основные проекты</button>
      <button class="nav-btn" data-tab="aux">Вспомогательные объекты</button>
    </nav>

    <div class="user-menu">
      <button class="user-btn" id="userBtn">
        <span class="avatar" id="avatar">?</span>
        <span id="username">...</span>
      </button>
      <div class="dropdown" id="dropdown">
        <button id="changePassBtn">🔑 Сменить пароль</button>
        <button class="danger" id="logoutBtn">🚪 Выйти</button>
      </div>
    </div>
  </header>

  <main class="content">
    <div id="tab-schedule" class="tab active">
      <h2 class="tab-title">Общий график</h2>
      <p class="tab-empty">Раздел в разработке — здесь будет общий график работ.</p>
    </div>
    <div id="tab-prep" class="tab"></div>
    <div id="tab-main" class="tab"></div>
    <div id="tab-aux" class="tab"></div>
  </main>

  <!-- Окно смены пароля -->
  <div class="modal-overlay" id="passModal">
    <div class="modal">
      <h2>Смена пароля</h2>
      <div class="msg" id="passMsg"></div>
      <input type="password" id="oldPass" placeholder="Старый пароль">
      <input type="password" id="newPass" placeholder="Новый пароль (мин. 4 символа)">
      <div class="row">
        <button class="btn-cancel" id="passCancel">Отмена</button>
        <button class="btn-save" id="passSave">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="projects.js"></script>
  <script>
    // Имя пользователя в шапке
    fetch("/api/me").then(r => {
      if (!r.ok) { window.location.href = "/login.html"; return; }
      return r.json();
    }).then(d => {
      if (!d) return;
      document.getElementById("username").textContent = d.username;
      document.getElementById("avatar").textContent = d.username[0].toUpperCase();
    });

    // Открытие/закрытие меню
    const dropdown = document.getElementById("dropdown");
    document.getElementById("userBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      dropdown.classList.toggle("open");
    });
    document.addEventListener("click", () => dropdown.classList.remove("open"));

    // Выход
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login.html";
    });

    // Смена пароля
    const passModal = document.getElementById("passModal");
    const passMsg = document.getElementById("passMsg");
    document.getElementById("changePassBtn").addEventListener("click", () => {
      passModal.classList.add("open");
    });
    document.getElementById("passCancel").addEventListener("click", () => {
      passModal.classList.remove("open");
      passMsg.textContent = "";
    });
    document.getElementById("passSave").addEventListener("click", async () => {
      const res = await fetch("/api/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          oldPassword: document.getElementById("oldPass").value,
          newPassword: document.getElementById("newPass").value,
        }),
      });
      const d = await res.json();
      passMsg.textContent = d.message;
      passMsg.className = "msg " + (res.ok ? "ok" : "err");
      if (res.ok) setTimeout(() => passModal.classList.remove("open"), 1200);
    });

    // Отрисовка списков проектов
    function renderTab(key) {
      const container = document.getElementById("tab-" + key);
      if (!container || container.dataset.rendered) return;
      const section = PROJECTS[key];
      let html = `<h2 class="tab-title">${section.title}</h2><div class="project-list">`;
      section.items.forEach(p => {
        html += `<div class="project-item" data-code="${p.code}">
                   <span class="project-code">${p.code}</span>
                   <span class="project-name">${p.name}</span>
                 </div>
                 <div class="project-panel" id="panel-${p.code}">
                  <div class="panel-dashboard" id="dash-${p.code}"></div>
                  <div class="panel-toolbar">
                     <button class="panel-btn btn-import" data-code="${p.code}">📥 импорт</button>
                     <button class="panel-btn btn-export" data-code="${p.code}" data-name="${p.name}">📤 экспорт</button>
                     <input type="file" class="file-import" data-code="${p.code}" accept=".xlsx" style="display:none">
                   </div>
                   <div class="panel-table-wrap" id="table-${p.code}">
                     <table class="report-table">
                       <thead>
                         <tr>
                           <th>код</th>
                           <th>проект</th>
                           <th>этап</th>
                           <th>объект</th>
                           <th>дисциплина</th>
                           <th>план начало</th>
                           <th>план окончание</th>
                           <th>факт начало</th>
                           <th>факт окончание</th>
                           <th>стоимость</th>
                           <th>выполнено</th>
                           <th>статус</th>
                         </tr>
                       </thead>
                       <tbody></tbody>
                     </table>
                   </div>
                 </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
      container.dataset.rendered = "1";
    }
    ["prep", "main", "aux"].forEach(renderTab);

    // Переключение вкладок
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    // Экспорт таблицы в Excel
    const REPORT_COLUMNS = [
      "Код", "Проект", "Этап", "Объект", "Дисциплина",
      "План начало", "План окончание", "Факт начало", "Факт окончание",
      "Стоимость", "Выполнено", "Статус"
    ];

    async function exportProject(code, name) {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet("Отчёт");

      ws.addTable({
        name: "Report_" + code.replace(/[^a-zA-Z0-9]/g, ""),
        ref: "A1",
        headerRow: true,
        style: { showRowStripes: false },
        columns: REPORT_COLUMNS.map(c => ({ name: c })),
        rows: [ REPORT_COLUMNS.map(() => "") ],
      });

      ws.columns.forEach(col => { col.width = 14; });

      ws.getRow(1).eachCell(cell => {
        cell.font = { bold: true, color: { argb: "FFFFFFFF" }, size: 8 };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF000000" } };
      });

      ws.eachRow(row => {
        row.eachCell(cell => {
          cell.font = cell.font && cell.font.bold ? cell.font : { size: 8 };
          cell.border = {
            top: { style: "thin", color: { argb: "FFCCCCCC" } },
            left: { style: "thin", color: { argb: "FFCCCCCC" } },
            bottom: { style: "thin", color: { argb: "FFCCCCCC" } },
            right: { style: "thin", color: { argb: "FFCCCCCC" } },
          };
        });
      });

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Отчёт_${code}.xlsx`;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.querySelectorAll(".btn-export").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        exportProject(btn.dataset.code, btn.dataset.name);
      });
    });

    // ===== ИМПОРТ =====
    async function importFile(code, file) {
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(await file.arrayBuffer());
      const ws = wb.worksheets[0];
      const rows = [];
      ws.eachRow((row, n) => {
        if (n === 1) return; // пропускаем шапку
        const v = i => row.getCell(i).value;
        const d = i => { const x = v(i); return x instanceof Date ? x : null; };
        rows.push({
          stage: String(v(3) || ""),
          item: String(v(5) || v(4) || ""),
          planStart: d(6), planEnd: d(7),
          factStart: d(8), factEnd: d(9),
          cost: Number(v(10)) || 0,
          done: Number(v(11)) || 0,
          status: String(v(12) || "")
        });
      });
      const res = await fetch("/api/reports/" + code, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rows })
      });
      const data = await res.json();
      alert(res.ok ? `Импортировано строк: ${data.count}` : "Ошибка: " + data.message);
    }
    document.querySelectorAll(".btn-import").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        document.querySelector(`.file-import[data-code="${btn.dataset.code}"]`).click();
      });
    });
    document.querySelectorAll(".file-import").forEach(inp => {
      inp.addEventListener("change", () => {
        if (inp.files[0]) importFile(inp.dataset.code, inp.files[0]);
        inp.value = "";
      });
    });

    // ===== ДАШБОРД =====
    function money(n) {
      return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " €";
    }

    async function renderDashboard(code) {
      const dash = document.getElementById("dash-" + code);
      const res = await fetch("/api/reports/" + code);
      const data = await res.json();
      const rows = data.rows || [];
      
      const totalCost = rows.reduce((s, r) => s + (r.cost || 0), 0);
      const doneCost = rows.reduce((s, r) => s + (r.cost || 0) * (r.done || 0) / 100, 0);
      const donePct = totalCost ? Math.round(doneCost / totalCost * 100) : 0;
      const now = new Date();
      const planCost = rows.reduce((s, r) => {
        if (!r.planStart || !r.planEnd) return s;
        const ps = new Date(r.planStart), pe = new Date(r.planEnd);
        if (now >= pe) return s + (r.cost || 0);
        if (now <= ps) return s;
        return s + (r.cost || 0) * (now - ps) / (pe - ps);
      }, 0);
      const planPct = totalCost ? Math.round(planCost / totalCost * 100) : 0;
      const delta = donePct - planPct;
      const dts = a => a.length ? new Date(Math.min(...a)) : null;
      const dte = a => a.length ? new Date(Math.max(...a)) : null;
      const fmt = d => d ? `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getFullYear()).slice(2)}` : "—";
      const planStart = dts(rows.filter(r => r.planStart).map(r => +new Date(r.planStart)));
      const planEnd = dte(rows.filter(r => r.planEnd).map(r => +new Date(r.planEnd)));
      const factStart = dts(rows.filter(r => r.factStart).map(r => +new Date(r.factStart)));
      const fcArr = rows.filter(r => r.forecastEnd).map(r => +new Date(r.forecastEnd));
      const forecastEnd = fcArr.length ? dte(fcArr) : planEnd;
      const late = forecastEnd && planEnd && forecastEnd > planEnd;
      dash.innerHTML = `
        <div class="kpi-row">
          <div class="kpi-card">
            <div class="kpi-label">Стоимость проекта</div>
            <div class="kpi-big">${money(totalCost)}</div>
            <div class="kpi-label">Освоено всего</div>
            <div class="kpi-mid">${money(doneCost)} (${donePct}%)</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Общий прогресс</div>
            <div class="kpi-flex">
              <div>
                <div class="kpi-label">План</div>
                <div class="kpi-big">${planPct}%</div>
              </div>
              <div>
                <div class="kpi-label">Факт</div>
                <div class="kpi-big">${donePct}%</div>
              </div>
            </div>
            <div class="kpi-badge ${delta < 0 ? "bad" : "good"}">${delta < 0 ? "Отставание " : "Опережение +"}${delta}%</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Сроки</div>
            <div class="kpi-label">План начало / окончание</div>
            <div class="kpi-dates">${fmt(planStart)} → ${fmt(planEnd)}</div>
            <div class="kpi-label">Факт начало</div>
            <div class="kpi-mid">${fmt(factStart)}</div>
            <div class="kpi-label" style="margin-top:6px;">Прогноз окончания</div>
            <div class="kpi-badge ${late ? "bad" : "good"}">${fmt(forecastEnd)}</div>
          </div>
          <div class="kpi-card kpi-wide">
            <div class="kpi-label">Примечание / комментарий</div>
            <textarea class="kpi-comment-edit" id="comment-${code}" placeholder="Место для текстового комментария по проекту — риски, причины отставания, ключевые события за период." onblur="saveComment('${code}')" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${data.comment || ""}</textarea>
          </div>
        </div>`;
    }

    async function saveComment(code) {
      const text = document.getElementById("comment-" + code).value;
      const res = await fetch("/api/reports/" + code, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ comment: text })
      });
      if (!res.ok) alert("Ошибка сохранения комментария");
    }

    // Раскрытие/скрытие панели проекта
    document.querySelectorAll(".project-item").forEach(item => {
      item.addEventListener("click", () => {
        const code = item.dataset.code;
        const panel = document.getElementById("panel-" + code);
        const isOpen = panel.classList.contains("open");
        item.classList.toggle("open", !isOpen);
        panel.classList.toggle("open", !isOpen);
        if (!isOpen) renderDashboard(code);
      });
    });
  </script>
</body>
</html>
