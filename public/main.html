<script>
async function init(){
const res=await fetch("/api/me");
if(res.ok===false){window.location.href="/login.html";return;}
const user=await res.json();
document.getElementById("username").textContent=user.name||user.login;
if(user.avatar){
  document.getElementById("avatar").innerHTML='<img src="'+user.avatar+'" style="width:100%;height:100%;object-fit:cover;">';
}else{
  document.getElementById("avatar").textContent=(user.name||user.login).charAt(0).toUpperCase();
}
window.currentUserRole=user.role;
window.currentLogin=user.login;
fetch("/api/users/list").then(function(r){return r.ok?r.json():null;}).then(function(l){if(l&&l.length){PERSONNEL.length=0;l.forEach(function(x){PERSONNEL.push(x);});}});
if(user.role!=="admin"&&user.role!=="developer"){
  const btn=document.getElementById("structureBtn");
  if(btn) btn.style.display="none";
  const settingsBtnEl2=document.getElementById("settingsBtn");
  if(settingsBtnEl2) settingsBtnEl2.style.display="none";
}
}
function showPage(id,btn){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".buttons button").forEach(b=>b.classList.remove("nav-active"));if(btn)btn.classList.add("nav-active");}
function fmtDaysUntil(d){
  if(d===0) return "Сегодня";
  if(d===1) return "Завтра";
  return "Через "+d+" дн.";
}
let teamLoaded=false;
function loadTeamPage(){
  if(teamLoaded) return;
  teamLoaded=true;
  const users=PERSONNEL;
  const empListEl=document.getElementById("teamEmpList");
  empListEl.innerHTML=users.map(u=>{
    const avatarHtml=u.avatar?'<img src="'+u.avatar+'">':'<span>'+(u.name?u.name.charAt(0):"?")+'</span>';
    return '<div class="emp-row"><div class="emp-row-avatar">'+avatarHtml+'</div><div class="emp-row-name">'+u.name+'</div><div class="emp-row-dept">'+(u.department||"")+'</div><div class="emp-row-pos">'+(u.position||"")+'</div><div class="emp-row-cell">'+(u.birthday||"")+'</div><div class="emp-row-cell">'+(u.internalPhone||"")+'</div><div class="emp-row-cell">'+(u.mobilePhone||"")+'</div><div class="emp-row-cell">'+(u.email||"")+'</div></div>';
  }).join("");
  const today=new Date();
  today.setHours(0,0,0,0);
  const withDays=users.filter(u=>u.birthday).map(u=>{
    const parts=u.birthday.split(".");
    if(parts.length!==3) return null;
    const day=parseInt(parts[0],10);
    const month=parseInt(parts[1],10)-1;
    let next=new Date(today.getFullYear(),month,day);
    if(next<today) next=new Date(today.getFullYear()+1,month,day);
    const daysUntil=Math.round((next-today)/86400000);
    return {name:u.name,birthday:u.birthday,daysUntil:daysUntil,avatar:u.avatar||""};
  }).filter(Boolean);
  withDays.sort((a,b)=>a.daysUntil-b.daysUntil);
  const upcoming=withDays.slice(0,3);
  document.getElementById("teamHeader").innerHTML=upcoming.map(u=>{
    const avatarHtml=u.avatar?'<img src="'+u.avatar+'">':'<span>'+u.name.charAt(0)+'</span>';
    return '<div class="bday-card"><div class="bday-card-avatar">'+avatarHtml+'</div><div class="bday-card-info"><div class="bday-card-name">'+u.name+'</div><div class="bday-card-date">'+u.birthday+'</div><div class="bday-card-days">'+fmtDaysUntil(u.daysUntil)+'</div></div></div>';
  }).join("");
}

    function refreshMap(){var t=0;var iv=setInterval(function(){leafMap.invalidateSize();t+=30;if(t>450)clearInterval(iv);},30);}
    var allMarkers=[];var allPlans=[];
    function insideAnyPlan(ll){for(var i=0;i<allPlans.length;i++){if(allPlans[i].getBounds().contains(ll)) return true;}return false;}
    function mkHtml(code,name){return '<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px;font-size:11px;font-weight:700;color:#1f2937;"><span style="color:#2c5364;">'+code+'</span> '+name+'</div>';}
    function openObj(ll,html){

      allMarkers.forEach(function(m){if(leafMap.hasLayer(m)) leafMap.removeLayer(m);});

    }
    function closeObj(){
      var pn=document.getElementById('mapInfo');pn.style.width='460px';pn.style.margin='0';pn.style.opacity='1';renderMapList();
      allMarkers.forEach(function(m){var g=m._grp||null;if(g!=null&&leafMap.hasLayer(g)==false) return;if(leafMap.hasLayer(m)==false) (g||leafMap).addLayer(m);});
      refreshMap();
    }
    
    genplan.on('click',function(e){openObj(e.latlng);});
    leafMap.setView([40.859245,69.5467],18);
    var objMarker=L.marker([40.859245,69.5467]).addTo(leafMap).bindTooltip('OXS01 Кислородная станция',{permanent:true,direction:'top',offset:[-15,-10]}).on('click',function(e){openObj(e.latlng);});
    allPlans.push(genplan);allMarkers.push(objMarker);
    var ieeHtml=mkHtml('IEE03','Главная понизительная подстанция №03');
    var iee=L.imageOverlay('/IEE03.png',[[40.85971,69.545325],[40.8602,69.546445]],{opacity:0.85,interactive:true}).addTo(leafMap);
    allPlans.push(iee);
    var ieeMarker=L.marker([40.859955,69.545885]).addTo(leafMap).bindTooltip('IEE03 Главная понизительная подстанция №03',{permanent:true,direction:'top',offset:[-15,-10]}).on('click',function(e){openObj(e.latlng,ieeHtml);});
    allMarkers.push(ieeMarker);

    leafMap.on('popupclose',function(e){if(e.popup.options.className=='obj-popup'&&leafMap.hasLayer(objMarker)==false) objMarker.addTo(leafMap);});
    var layersCtl=L.control.layers({'Спутник':sat,'Схема':osm},{}).addTo(leafMap);
    var newGroup=L.layerGroup([genplan,objMarker,iee,ieeMarker]).addTo(leafMap);
    layersCtl.addOverlay(newGroup,'Строительство новых объектов');
    var prepGroup=L.layerGroup().addTo(leafMap);
    layersCtl.addOverlay(prepGroup,'Подготовительные работы');
    var prepObjs=[
['CSM01-PR','Подготовительные работы на площадке',[[40.85329,69.54369],[40.85331,69.54531],[40.85417,69.54369],[40.85416,69.54528]]],
['CSM01-SA','Склад серной кислоты №5',[[40.85299,69.54292],[40.85300,69.54358],[40.85407,69.54294],[40.85408,69.54358]]],
['OXS01-AB','АБК для УСРР на территории МОФ',[[40.85874,69.54720],[40.85875,69.54759],[40.85910,69.54720],[40.85914,69.54758]]],
['OXS01-AR','Участок наполнения и хранения баллонов аргона',[[40.85900,69.54548],[40.85901,69.54602],[40.85967,69.54538],[40.85967,69.54601]]],
['HER01-IT','Внутризаводская транспортировка №27',[[40.84995,69.54611],[40.84992,69.54727],[40.85109,69.54605],[40.85108,69.54725]]],
['HER01-SP','Отдел сортировки и упаковки готовой продукции (Пандус)',[[40.84960,69.54623],[40.84960,69.54646],[40.84981,69.54621],[40.84981,69.54643]]],
['HER01-PR','Подготовительные работы на площадке (ЦЭМ)',[[40.85122,69.54599],[40.85119,69.54743],[40.85246,69.54600],[40.85245,69.54743]]],
['PSP01-RS','Склад огнеупоров №20 и центральный склад №21',[[40.85524,69.54278],[40.85523,69.54452],[40.85557,69.54277],[40.85559,69.54449]]],

['PSP01-CH','Участок кранового хозяйства',[[40.85526,69.54455],[40.85529,69.54532],[40.85564,69.54454],[40.85563,69.54532]]],
['PSP01-CG','Конвейерная галерея ДШО',[[40.85466,69.54807],[40.85466,69.54837],[40.85651,69.54802],[40.85652,69.54841]]],
['PSP01-RF','Огнеупорный цех',[[40.85565,69.54377],[40.85565,69.54423],[40.85594,69.54378],[40.85594,69.54423]]],
['PSP01-MS','Склад металлов',[[40.85190,69.54809],[40.85190,69.54852],[40.85241,69.54808],[40.85241,69.54852]]]
    ];
    function rectFrom(c){
      var la0=c[0][0],ln0=c[0][1];
      function xy(q){return [(q[1]-ln0)*84200,(q[0]-la0)*111320];}
      var bl=xy(c[0]),br=xy(c[1]),tl=xy(c[2]),tr=xy(c[3]);
      function sub(a,b){return [a[0]-b[0],a[1]-b[1]];}
      function dot(a,b){return a[0]*b[0]+a[1]*b[1];}
      var eb=sub(br,bl),et=sub(tr,tl),el=sub(tl,bl),er=sub(tr,br),H=Math.PI/2;
      var an=[Math.atan2(eb[1],eb[0]),Math.atan2(et[1],et[0]),Math.atan2(el[1],el[0])-H,Math.atan2(er[1],er[0])-H];
      var sx=0,sy=0;an.forEach(function(q){sx+=Math.cos(q);sy+=Math.sin(q);});
      var th=Math.atan2(sy,sx),u=[Math.cos(th),Math.sin(th)],v=[-Math.sin(th),Math.cos(th)];
      var w=(dot(eb,u)+dot(et,u))/2,h=(dot(el,v)+dot(er,v))/2;
      var cx=(bl[0]+br[0]+tl[0]+tr[0])/4,cy=(bl[1]+br[1]+tl[1]+tr[1])/4;
      function pt(m,n){var x=cx+u[0]*m*w/2+v[0]*n*h/2,y=cy+u[1]*m*w/2+v[1]*n*h/2;return [la0+y/111320,ln0+x/84200];}
      return [pt(-1,-1),pt(1,-1),pt(1,1),pt(-1,1)];
    }
    function axisRect(c){
      var so=(c[0][0]+c[1][0])/2,no=(c[2][0]+c[3][0])/2,we=(c[0][1]+c[2][1])/2,ea=(c[1][1]+c[3][1])/2;
      return [[so,we],[so,ea],[no,ea],[no,we]];
    }
    var lblCss=document.createElement('style');
    lblCss.textContent='.obj-label{background:rgba(255,255,255,0.92);border:none;border-radius:6px;box-shadow:none;font-size:11px;font-weight:600;color:#1f2937;white-space:normal;width:130px;text-align:center;padding:3px 5px;line-height:1.25;} .obj-label:before{display:none;} .hide-lbl .obj-label{display:none;}';

    leafMap.on('zoomend',function(){document.getElementById('mapBox').classList.toggle('hide-lbl',leafMap.getZoom()<17);});
    function distM(a,b){var dy=(a[0]-b[0])*111320;var dx=(a[1]-b[1])*84200;return Math.sqrt(dx*dx+dy*dy);}
    function roundPoly(pts){
      var n=pts.length,mn=1e9,out=[];
      for(var i=0;i<n;i++){var d=distM(pts[i],pts[(i+1)%n]);if(d<mn) mn=d;}
      var r=mn*0.2;
      for(var j=0;j<n;j++){
        var p0=pts[(j+n-1)%n],p1=pts[j],p2=pts[(j+1)%n];
        var k0=r/distM(p1,p0),k2=r/distM(p1,p2);
        var a=[p1[0]+(p0[0]-p1[0])*k0,p1[1]+(p0[1]-p1[1])*k0];
        var b=[p1[0]+(p2[0]-p1[0])*k2,p1[1]+(p2[1]-p1[1])*k2];
        for(var t=0;t<=6;t++){var u=t/6;var w0=(1-u)*(1-u),w1=2*(1-u)*u,w2=u*u;out.push([w0*a[0]+w1*p1[0]+w2*b[0],w0*a[1]+w1*p1[1]+w2*b[1]]);}
      }
      return out;
    }
    var prepStatus={};
    var prepColors={done:'#16a34a',active:'#eab308',none:'#2563eb'};
    var prepPolys={};
    function prepPanel(code,name){

      return '<div style="display:flex;flex-direction:column;gap:10px;">'+mkHtml(code,name)+'<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;"><div style="font-size:11px;color:#6b7280;">Статус</div><div style="font-weight:700;font-size:11px;color:#1f2937;">'+txt+', выполнено '+st.pct+'%</div></div></div>';
    }
    prepObjs.forEach(function(o){
      var c=o[2];
      var poly=L.polygon(roundPoly(axisRect(c)),{color:prepColors.none,weight:3,lineJoin:'round',fillColor:prepColors.none,fillOpacity:0.2}).addTo(prepGroup);

function renderPrepStructureList(body){

    const dataByCode={};

    const groups={};

      const prefix=p.code.split("-")[0];
      groups[prefix]=groups[prefix]||[];
      groups[prefix].push(p);
    });
    const parentAll=PROJECTS.main.items.concat(PROJECTS.aux.items);
    body.innerHTML=Object.keys(groups).map(prefix=>{
      const parent=parentAll.find(pp=>pp.code===prefix);
      const extraNames={"OPS01":"Внепроектные объекты"};
      const parentName=parent?parent.name:(extraNames[prefix]||prefix);
      const items=groups[prefix];
      const groupTotalCost=items.reduce((s,p)=>s+((dataByCode[p.code]&&dataByCode[p.code].cost)||0),0);
      const groupTotalDone=items.reduce((s,p)=>s+((dataByCode[p.code]&&dataByCode[p.code].done)||0),0);
      const groupPlanWeighted=items.reduce((s,p)=>{ const o=dataByCode[p.code]; return s+(o?(o.planPct*o.cost):0); },0);
      const groupPlanPct=groupTotalCost?Math.round(groupPlanWeighted/groupTotalCost):0;

        +'<div style="font-size:10px;font-weight:700;color:#fff;background:#38a169;border-radius:6px;padding:4px 10px;width:50px;text-align:center;">'+(groupTotalCost?groupFactPct+"%":"—")+'</div>'
        +'<div style="font-size:10px;color:#9ca3af;min-width:70px;text-align:right;">'+items.length+' объектов</div>'
        +'</div>'
        +'</div>'
        +'<div class="cat-item-card-body" style="max-height:0;overflow:hidden;transition:max-height 0.4s ease;">'
        +'<div style="padding:0 18px 12px 18px;display:flex;flex-direction:column;gap:6px;">'

          const o=dataByCode[p.code];

          return renderStructItemCard(p.code,p.name,badge,o||null);

function showAppAlert(message){
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:9999;display:flex;align-items:center;justify-content:center;";
  const box=document.createElement("div");
  box.style.cssText="background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:24px 28px;max-width:420px;width:90%;";
  const text=document.createElement("div");
  text.style.cssText="font-size:13px;color:#1f2937;white-space:pre-line;line-height:1.6;margin-bottom:20px;";
  text.textContent=message;
  const btn=document.createElement("button");
  btn.textContent="OK";
  btn.style.cssText="width:auto;height:auto;background:linear-gradient(160deg,#6a5ae0 0%,#4a90d9 45%,#1dd3b0 100%);color:#fff;border:none;padding:8px 24px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:block;margin-left:auto;";
  btn.addEventListener("click",()=>{ overlay.remove(); });
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) overlay.remove(); });
  box.appendChild(text);
  box.appendChild(btn);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
function doPrepImportUpload(file,onDone){
  const fd=new FormData();
  fd.append("file",file);
  fetch("/api/prep/import",{method:"POST",body:fd}).then(r=>r.json()).then(data=>{
    const summary=(data.results||[]).map(r=>r.code+": "+r.status).join("\n");
    showAppAlert("Импорт завершён:\n"+summary);
    if(onDone) onDone();
  }).catch(err=>{ showAppAlert("Ошибка импорта: "+err.message); });
}
function wireStructItemButtons(body,mode,cat){
  const isPrep = mode==="prep" || mode===true;
  const exportBase = isPrep ? "/api/prep/export?code=" : "/api/reports/export?code=";
  const importUrl = isPrep ? "/api/prep/import" : "/api/reports/import";
  function refresh(){ if(isPrep) renderPrepStructureList(body); else renderMainAuxStructureList(body,cat); }
  function doImportUpload(file,onDone){
    const fd=new FormData();
    fd.append("file",file);
    fetch(importUrl,{method:"POST",body:fd}).then(r=>r.json()).then(data=>{
      const summary=(data.results||[]).map(r=>r.code+": "+r.status).join("\n");
      showAppAlert("Импорт завершён:\n"+summary);
      if(onDone) onDone();
    }).catch(err=>{ showAppAlert("Ошибка импорта: "+err.message); });
  }
  body.querySelectorAll(".struct-export-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{ window.location.href=exportBase+btn.dataset.code; });
  });
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".xlsx"; inp.style.display="none";
  document.body.appendChild(inp);
  let activeCode=null;
  body.querySelectorAll(".struct-import-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{ activeCode=btn.dataset.code; inp.value=""; inp.click(); });
  });
  inp.addEventListener("change",()=>{
    if(inp.files.length===0||activeCode===null) return;
    doImportUpload(inp.files[0],refresh);
  });
  body.querySelectorAll(".cat-item-card").forEach(card=>{
    card.addEventListener("dragover",(e)=>{ e.preventDefault(); card.style.outline="2px dashed #4a9fd8"; });
    card.addEventListener("dragleave",()=>{ card.style.outline="none"; });
    card.addEventListener("drop",(e)=>{
      e.preventDefault();
      card.style.outline="none";
      const file=e.dataTransfer.files[0];
      if(!file) return;
      doImportUpload(file,refresh);
    });
  });
}

function buildProfileForm(){
  const body=document.querySelector(".profile-modal-overlay .obj-modal-body");
  if(body==null) return;
  body.style.overflowY="auto";
  const fst="width:100%;height:34px;border:1px solid #e5e9ef;border-radius:8px;padding:0 12px;font-size:12px;outline:none;box-sizing:border-box;background:#f7f9fb;color:#1f2937;";
  const lst="font-size:11px;color:#6b7280;margin:10px 0 4px 2px;";
  const bst="height:30px;padding:0 16px;background:#4a9fd8;color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;";
  const fields=[["name","Имя и Фамилия"],["department","Отдел"],["position","Должность"],["birthday","Дата (дд.мм.гггг)"],["internalPhone","Внутренний"],["mobilePhone","Мобильный"],["email","Почта"]];
  let h='<style>.profile-modal-overlay .obj-modal-body::-webkit-scrollbar{display:none;}.profile-modal-overlay .obj-modal-body{scrollbar-width:none;}</style>';
  fields.forEach(function(f){ h+='<div style="'+lst+'">'+f[1]+'</div><input id="pf_'+f[0]+'" type="text" style="'+fst+'">'; });
  
  h+='<div style="border-top:1px solid #eee;margin-top:22px;padding-top:12px;font-size:12px;font-weight:700;color:#1f2937;">Смена пароля</div>';
  h+='<div style="'+lst+'">Текущий пароль</div><input id="pf_old" type="password" autocomplete="new-password" style="'+fst+'">';
  h+='<div style="'+lst+'">Новый пароль</div><input id="pf_new" type="password" autocomplete="new-password" style="'+fst+'">';
  h+='<div style="'+lst+'">Повторите новый пароль</div><input id="pf_new2" type="password" autocomplete="new-password" style="'+fst+'">';
  h+='<div style="display:flex;align-items:center;gap:12px;margin-top:16px;"><button id="pfSave" style="'+bst+'">Сохранить</button><span id="pfMsg" style="font-size:11px;"></span></div>';
  body.innerHTML=h;
  fetch("/api/users/list").then(function(r){ return r.json(); }).then(function(l){
    const me=l.find(function(x){ return x.username===window.currentLogin; });
    if(me==null) return;
    fields.forEach(function(f){ document.getElementById("pf_"+f[0]).value=me[f[0]]||""; });
  });
  const oldEl=document.getElementById("pf_old"),newEl=document.getElementById("pf_new"),new2El=document.getElementById("pf_new2");
  function pfErr(el){ el.style.border="1px solid #d94f4f"; el.style.background="#fdecec"; }
  function pfOk(el){ el.style.border="1px solid #e5e9ef"; el.style.background="#f7f9fb"; }
  function pfBad(t){ const m=document.getElementById("pfMsg"); m.style.color="#d94f4f"; m.textContent=t; }
  function pfCheck(){
    const m=document.getElementById("pfMsg");
    if(new2El.value==="" || newEl.value===new2El.value){
      pfOk(newEl); pfOk(new2El);
      if(m.textContent==="Пароли не совпадают") m.textContent="";
    } else {
      pfErr(newEl); pfErr(new2El); pfBad("Пароли не совпадают");
    }
  }
  newEl.addEventListener("input",pfCheck);
  new2El.addEventListener("input",pfCheck);
  oldEl.addEventListener("input",function(){ pfOk(oldEl); });
  document.getElementById("pfSave").addEventListener("click",function(){
    const msg=document.getElementById("pfMsg");
    msg.textContent="";
    const data={};
    fields.forEach(function(f){ data[f[0]]=document.getElementById("pf_"+f[0]).value; });
    if(data.name.trim()===""){ pfBad("Укажите имя и фамилию"); return; }
    const o=oldEl.value,n1=newEl.value,n2=new2El.value;
    const wantPw=(n1===""&&n2==="")?false:true;
    if(wantPw){
      if(n1===n2){ } else { pfErr(newEl); pfErr(new2El); pfBad("Пароли не совпадают"); return; }
      if(n1===""){ pfErr(newEl); pfErr(new2El); pfBad("Введите новый пароль"); return; }
      if(n1.length<6){ pfErr(newEl); pfErr(new2El); pfBad("Пароль минимум 6 символов"); return; }
      if(o===""){ pfErr(oldEl); pfBad("Введите текущий пароль"); return; }
    }
    fetch("/api/me/profile",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).then(function(r){ return r.ok?r.json():null; }).then(function(u){
      if(u==null){ pfBad("Ошибка сохранения"); return; }
      const i=PERSONNEL.findIndex(function(x){ return x.username===u.username; });
      if(i>=0) Object.assign(PERSONNEL[i],u);
      document.getElementById("username").textContent=u.name;
      if(u.avatar==null||u.avatar===""){ document.getElementById("avatar").textContent=u.name.charAt(0).toUpperCase(); }
      if(wantPw===false){ msg.style.color="#16a34a"; msg.textContent="Сохранено"; return; }
      return fetch("/api/me/password",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({oldPassword:o,newPassword:n1})}).then(function(r){
        if(r.status===403){ pfErr(oldEl); pfBad("Данные сохранены, но текущий пароль неверный"); return; }
        if(r.ok===false){ pfBad("Данные сохранены, пароль не изменён"); return; }
        oldEl.value="";newEl.value="";new2El.value="";
        msg.style.color="#16a34a"; msg.textContent="Сохранено, пароль изменён";
      });
    });
  });
}

function enableDragScrollY(el){
  if(!el) return;
  let isDown=false, startY=0, startScroll=0;
  el.addEventListener("mousedown",(e)=>{
    isDown=true;
    el.classList.add("dragging");
    startY=e.pageY;
    startScroll=el.scrollTop;
  });
  window.addEventListener("mouseup",()=>{ isDown=false; el.classList.remove("dragging"); });
  window.addEventListener("mousemove",(e)=>{
    if(!isDown) return;
    e.preventDefault();
    el.scrollTop=startScroll-(e.pageY-startY);
  });
  el.addEventListener("contextmenu",(e)=>{ e.preventDefault(); });
  el.addEventListener("wheel",(e)=>{
    e.preventDefault();
    el.scrollTop+=e.deltaY;
  },{passive:false});
}
function enableDragScroll(el){
  if(!el) return;
  let isDown=false, startX=0, startScroll=0;
  el.addEventListener("mousedown",(e)=>{
    isDown=true;
    el.classList.add("dragging");
    startX=e.pageX;
    startScroll=el.scrollLeft;
  });
  window.addEventListener("mouseup",()=>{ isDown=false; el.classList.remove("dragging"); });
  window.addEventListener("mousemove",(e)=>{
    if(!isDown) return;
    e.preventDefault();
    el.scrollLeft=startScroll-(e.pageX-startX);
  });
  el.addEventListener("wheel",(e)=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
      e.preventDefault();
      el.scrollLeft+=e.deltaY;
    }
  },{passive:false});
}
function fmtMoney(n){
  return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(n);
}
function fmtMoneyOrDash(n){
  return n?fmtMoney(n):"—";
}
const yearCenterLabelPlugin={
  id:"yearCenterLabel",
  afterDraw(chart){
    const ctx=chart.ctx;
    const xScale=chart.scales.x;
    const labels=chart.data.labels;
    const yearGroups={};
    labels.forEach((lab,idx)=>{
      const year=String(lab).slice(0,4);
      yearGroups[year]=yearGroups[year]||[];
      yearGroups[year].push(idx);
    });
    ctx.save();
    ctx.font="bold 10px Arial";
    ctx.fillStyle="#1f2937";
    ctx.textAlign="center";
    ctx.textBaseline="top";
    const y=xScale.bottom+4;
    Object.keys(yearGroups).forEach(year=>{
      const idxs=yearGroups[year];
      const xs=idxs.map(idx=>xScale.getPixelForTick(idx)).filter(v=>v!=null&&!isNaN(v));
      if(!xs.length) return;
      const avgX=xs.reduce((a,b)=>a+b,0)/xs.length;
      ctx.fillText(year,avgX,y);
    });
    ctx.restore();
  }
};
function fmtDate(d){
  if(!d) return "—";
  const dt=new Date(d);
  return String(dt.getDate()).padStart(2,"0")+"."+String(dt.getMonth()+1).padStart(2,"0")+"."+dt.getFullYear();
}
function buildGantt(stages){
  const panel=document.getElementById("calendarPanel");
  const items=stages||[];
  const withDates=items.filter(s=>s.start&&s.end);
  if(!withDates.length){ panel.innerHTML='<div class="empty" style="padding:20px;"><p>Нет данных</p></div>'; return; }
  const allDates=[];
  withDates.forEach(s=>{ allDates.push(new Date(s.start)); allDates.push(new Date(s.end)); if(s.forecastEnd) allDates.push(new Date(s.forecastEnd)); });
  const minD=new Date(Math.min(...allDates));
  const maxD=new Date(Math.max(...allDates));
  const bufStart=new Date(minD.getFullYear(),minD.getMonth()-1,1);
  const bufEnd=new Date(maxD.getFullYear(),maxD.getMonth()+2,1);
  const months=[];
  const cur=new Date(bufStart);
  while(cur<bufEnd){ months.push({y:cur.getFullYear(),m:cur.getMonth()+1}); cur.setMonth(cur.getMonth()+1); }
  const monthW=16;
  const totalW=months.length*monthW;
  const t0=bufStart.getTime(), t1=bufEnd.getTime();
  const pos=d=>(new Date(d).getTime()-t0)/(t1-t0)*totalW;
  const yearGroups=[];
  months.forEach(mo=>{ if(!yearGroups.length||yearGroups[yearGroups.length-1].year!==mo.y) yearGroups.push({year:mo.y,count:1}); else yearGroups[yearGroups.length-1].count++; });
  const yearBoundaries=[];
  months.forEach((mo,i)=>{
    if(mo.m===1&&i>0) yearBoundaries.push(i*monthW);
  });
  const yearRowHtml=yearGroups.map(g=>'<span class="gantt-year" style="width:'+(g.count*monthW)+'px;">'+g.year+'</span>').join("");
  const monthRowHtml=months.map(mo=>'<span class="gantt-month" style="width:'+monthW+'px;">'+String(mo.m).padStart(2,"0")+'</span>').join("");
  const yearLinesHtml=yearBoundaries.map(x=>'<div class="gantt-year-line" style="left:'+x+'px;"></div>').join("");
  function ganttDatesHtml(s){
    const deltaColor=s.deltaDays>0?"#e53e3e":(s.deltaDays<0?"#38a169":"#1f2937");

    return '<div class="gantt-dates">'
      +'<div class="gantt-date-col"><span class="gantt-date-label">Начало</span><span class="gantt-date-value">'+fmtDate(s.start)+'</span></div>'
      +'<div class="gantt-date-col"><span class="gantt-date-label">Окончание</span><span class="gantt-date-value">'+fmtDate(s.end)+'</span></div>'

      +'<div class="gantt-date-col"><span class="gantt-date-label">Отклонение</span><span class="gantt-date-value" style="color:'+deltaColor+';">'+deltaText+'</span></div>'
      +'</div>';
  }
  const rowsHtml=items.map(s=>{
    if(!s.start||!s.end){
      return '<div class="gantt-row"><div class="gantt-row-label">'+s.name+'</div>'+ganttDatesHtml(s)+'<div class="gantt-track" style="width:'+totalW+'px;">'+yearLinesHtml+'</div></div>';
    }
    const left=pos(s.start);
    const endW=Math.max(2,pos(s.end)-left);
    let extraHtml="";
    if(s.forecastEnd && new Date(s.forecastEnd)>new Date(s.end)){
      const extraW=pos(s.forecastEnd)-pos(s.end);
      extraHtml='<div class="gantt-bar-extra" style="left:'+(left+endW)+'px;width:'+extraW+'px;"></div>';
    }
    return '<div class="gantt-row">'
      +'<div class="gantt-row-label">'+s.name+'</div>'

      +'<div class="gantt-track" style="width:'+totalW+'px;">'
      +yearLinesHtml
      +'<div class="gantt-bar-base" style="left:'+left+'px;width:'+endW+'px;"></div>'
      +extraHtml
      +'</div>'
      +'</div>';
  }).join("");
  panel.innerHTML='<div class="gantt-scroll" id="ganttScroll" style="overflow-x:auto;flex:1;">'
    +'<div style="width:'+(totalW+140)+'px;">'
    +'<div class="gantt-scale-year" style="display:flex;"><div class="gantt-scale-spacer"></div>'+yearRowHtml+'</div>'
    +'<div class="gantt-scale-month" style="display:flex;margin-bottom:6px;"><div class="gantt-scale-spacer"></div>'+monthRowHtml+'</div>'
    +rowsHtml
    +'</div></div>';

    const endW=Math.max(2,pos(s.end)-left);
    const donePct=s.cost?Math.min(100,s.done/s.cost*100):0;
    const greenW=endW*donePct/100;
    const blueW=endW-greenW;
    let extraHtml="";
    if(s.forecastEnd && new Date(s.forecastEnd)>new Date(s.end)){
      const extraW=pos(s.forecastEnd)-pos(s.end);
      extraHtml='<div class="gantt-bar-extra" style="left:'+(left+endW)+'px;width:'+extraW+'px;background:#e53e3e;"></div>';
    }
    return '<div class="gantt-row-r"><div class="gantt-track" style="width:'+totalW+'px;">'+yearLinesHtml
      +'<div class="gantt-bar-base" style="left:'+left+'px;width:'+greenW+'px;background:#38a169;border-radius:4px 0 0 4px;"></div>'
      +'<div class="gantt-bar-base" style="left:'+(left+greenW)+'px;width:'+blueW+'px;background:#4a9fd8;border-radius:0;"></div>'
      +extraHtml+'</div></div>';
  }).join("");
  panel.innerHTML='<div class="gantt-scroll-r" id="ganttScrollR" style="overflow-x:auto;height:100%;">'
    +'<div style="width:'+totalW+'px;">'
    +'<div class="gantt-scale-year" style="display:flex;">'+yearRowHtml+'</div>'
    +'<div class="gantt-scale-month" style="display:flex;margin-bottom:6px;">'+monthRowHtml+'</div>'
    +rowsHtml
    +'</div></div>';
  enableDragScroll(document.getElementById("ganttScrollR"));
}
function buildPlanFactBar(label,planPct,factPct){
  const diff=factPct-planPct;
  const green=Math.min(100,factPct);
  const red=Math.max(0,planPct-factPct);
  const gray=Math.max(0,100-Math.max(planPct,factPct));
  const diffColor=diff<0?"#e53e3e":"#38a169";
  const diffText=diff>0?("+"+diff+"%"):(diff+"%");
  return '<div class="pf-row">'
    +'<div class="progress-label" style="margin-bottom:4px;">'+label+'</div>'
    +'<div class="pf-bar">'
    +(green>0?'<div class="pf-seg" style="width:'+green+'%;background:#4a9fd8;"></div>':'')
    +(red>0?'<div class="pf-seg" style="width:'+red+'%;background:#e53e3e;"></div>':'')
    +(gray>0?'<div class="pf-seg" style="width:'+gray+'%;background:#e5e9ef;"></div>':'')
    +'</div>'
    +'<div class="pf-bottom3"><span class="pf-plan">План: '+planPct+'%</span><span class="pf-diff" style="color:'+diffColor+';">'+diffText+'</span><span class="pf-fact">Факт: '+factPct+'%</span></div>'
    +'</div>';
}

    const prepDynEndLabelPlugin={
      id:"prepDynEndLabels",
      afterDatasetsDraw(chart){
        const ctx=chart.ctx;
        const dsPlan=chart.data.datasets[0];
        const dsFact=chart.data.datasets[1];
        let todayIdx=-1;
        for(let i=dsFact.data.length-1;i>=0;i--){ if(dsFact.data[i]!==null&&dsFact.data[i]!==undefined){ todayIdx=i; break; } }
        function pointAt(dsIndex,data,idx){
          if(idx<0) return null;
          const meta=chart.getDatasetMeta(dsIndex);
          const pt=meta.data[idx];
          if(!pt) return null;
          return {x:pt.x,y:pt.y,value:data[idx]};
        }
        const planPt=pointAt(0,dsPlan.data,todayIdx);
        const factPt=pointAt(1,dsFact.data,todayIdx);
        function drawBadge(pt,color,offsetY){
          if(!pt) return;
          const text=pt.value+"%";
          ctx.font="bold 11px Arial";
          const w=ctx.measureText(text).width+10;
          const h=15;
          const x=pt.x-w/2, y=pt.y+offsetY-h/2;
          ctx.fillStyle=color;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(x,y,w,h,8) : ctx.rect(x,y,w,h);
          ctx.fill();
          ctx.fillStyle="#fff";
          ctx.textAlign="center";
          ctx.textBaseline="middle";
          ctx.fillText(text,pt.x,y+h/2);
        }
        if(planPt) drawBadge(planPt,"#4a9fd8",-14);
        if(factPt) drawBadge(factPt,"#38a169",14);
        if(planPt&&factPt){
          const diff=Math.abs(planPt.value-factPt.value);
          ctx.strokeStyle="#e53e3e";
          ctx.lineWidth=2;
          ctx.setLineDash([3,3]);
          ctx.beginPath();
          ctx.moveTo(planPt.x,planPt.y);
          ctx.lineTo(factPt.x,factPt.y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.font="bold 11px Arial";
          ctx.fillStyle="#e53e3e";
          ctx.textAlign="left";
          ctx.textBaseline="middle";
          ctx.fillText(diff+"%",Math.max(planPt.x,factPt.x)+8,(planPt.y+factPt.y)/2);
        }
      }
    };

          options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:20,bottom:0}},plugins:{legend:{display:false}},scales:{y:{display:false,min:0,max:100},x:{display:false}}}
        });
      });
    }
    loadMiniPrepChart("prepChartInternal","Внутренний","prepProgressInternal");

    return;
  }
  body.innerHTML='<div class="empty"><h1>'+sub+'</h1><p>Раздел в разработке</p></div>';
}
