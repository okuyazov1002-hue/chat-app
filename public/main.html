<script>
async function init(){
const res=await fetch("/api/me");
if(res.ok===false){window.location.href="/login.html";return;}
const user=await res.json();
document.getElementById("username").textContent=user.name||user.login;
if(user.avatar){
  document.getElementById("avatar").innerHTML='<img src="'+user.avatar+'" style="width:100%;height:100%;object-fit:cover;">';
}else{
  document.getElementById("avatar").textContent=(user.name||user.login).charAt(0).toUpperCase();
}
window.currentUserRole=user.role;
window.currentLogin=user.login;
fetch("/api/users/list").then(function(r){return r.ok?r.json():null;}).then(function(l){if(l&&l.length){PERSONNEL.length=0;l.forEach(function(x){PERSONNEL.push(x);});teamLoaded=false;var _pt=document.getElementById("page-team");if(_pt&&_pt.classList.contains("active")) loadTeamPage();}});
if(user.role!=="admin"&&user.role!=="developer"){
  const btn=document.getElementById("structureBtn");
  if(btn) btn.style.display="none";
  const settingsBtnEl2=document.getElementById("settingsBtn");
  if(settingsBtnEl2) settingsBtnEl2.style.display="none";
}
}
function showPage(id,btn){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".buttons button").forEach(b=>b.classList.remove("nav-active"));if(btn)btn.classList.add("nav-active");}
function fmtDaysUntil(d){
  if(d===0) return "Сегодня";
  if(d===1) return "Завтра";
  return "Через "+d+" дн.";
}
let teamLoaded=false;
function loadTeamPage(){
  if(teamLoaded) return;
  teamLoaded=true;
  function topRank(u){
    var pos=String(u.position||"").toLowerCase().trim();
    var dep=String(u.department||"").toLowerCase();
    if(pos.indexOf("заместитель директора")>=0 && pos.indexOf("управлению проектами")>=0) return 2;
    if(pos.indexOf("директор")===0 && pos.indexOf("заместитель")<0) return 1;
    if(pos==="главный инженер" || pos.indexOf("главный инженер дсомк")>=0) return 3;
    if(dep.indexOf("технологический")>=0 && pos.indexOf("начальник отдела")>=0) return 4;
    return 99;
  }
  const users=PERSONNEL.map(function(u,i){ return {u:u,i:i,r:topRank(u)}; }).sort(function(a,b){ return a.r-b.r || a.i-b.i; }).map(function(x){ return x.u; });
  const empListEl=document.getElementById("teamEmpList");
  empListEl.innerHTML=users.map(u=>{
    const avatarHtml=u.avatar?'<img src="'+u.avatar+'">':'<span>'+(u.name?u.name.charAt(0):"?")+'</span>';
    return '<div class="emp-row"><div class="emp-row-avatar">'+avatarHtml+'</div><div class="emp-row-name">'+u.name+'</div><div class="emp-row-dept">'+(u.department||"")+'</div><div class="emp-row-pos">'+(u.position||"")+'</div><div class="emp-row-cell">'+(u.birthday||"")+'</div><div class="emp-row-cell">'+(u.internalPhone||"")+'</div><div class="emp-row-cell">'+(u.mobilePhone||"")+'</div><div class="emp-row-cell">'+(u.email||"")+'</div>'+(window.currentUserRole==="developer"?'<button class="emp-dots" data-un="'+u.username+'" title="Меню"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.6" fill="#6b7280"/><circle cx="8" cy="8" r="1.6" fill="#6b7280"/><circle cx="8" cy="13" r="1.6" fill="#6b7280"/></svg></button>':"")+'</div>';
  }).join("");
  const today=new Date();
  today.setHours(0,0,0,0);
  const withDays=users.filter(u=>u.birthday).map(u=>{
    const parts=u.birthday.split(".");
    if(parts.length!==3) return null;
    const day=parseInt(parts[0],10);
    const month=parseInt(parts[1],10)-1;
    let next=new Date(today.getFullYear(),month,day);
    if(next<today) next=new Date(today.getFullYear()+1,month,day);
    const daysUntil=Math.round((next-today)/86400000);
    return {name:u.name,birthday:u.birthday,daysUntil:daysUntil,avatar:u.avatar||""};
  }).filter(Boolean);
  withDays.sort((a,b)=>a.daysUntil-b.daysUntil);
  const upcoming=withDays.slice(0,3);
  document.getElementById("teamHeader").innerHTML=upcoming.map(u=>{
    const avatarHtml=u.avatar?'<img src="'+u.avatar+'">':'<span>'+u.name.charAt(0)+'</span>';
    return '<div class="bday-card"><div class="bday-card-avatar">'+avatarHtml+'</div><div class="bday-card-info"><div class="bday-card-name">'+u.name+'</div><div class="bday-card-date">'+u.birthday+'</div><div class="bday-card-days">'+fmtDaysUntil(u.daysUntil)+'</div></div></div>';
  }).join("");
}
(function(){
  var menu=null;
  function closeMenu(){ if(menu){ menu.remove(); menu=null; } }
  function api(method,url,body){
    return fetch(url,{method:method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){
        if(r.ok==false) throw new Error(j.error||j.message||("Ошибка "+r.status));
        return j;
      });
    });
  }
  function item(text,fn,danger){
    var d=document.createElement("div");
    d.textContent=text;
    d.style.cssText="padding:9px 18px;cursor:pointer;font-size:13px;white-space:nowrap;color:"+(danger?"#dc2626":"#1f2937")+";";
    d.onmouseenter=function(){d.style.background="#f1f5f9";};
    d.onmouseleave=function(){d.style.background="transparent";};
    d.onclick=function(ev){ ev.stopPropagation(); closeMenu(); fn(); };
    return d;
  }
  function head(text){
    var d=document.createElement("div");
    d.textContent=text;
    d.style.cssText="padding:8px 18px 4px;font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;";
    return d;
  }
  function sep(){
    var d=document.createElement("div");
    d.style.cssText="height:1px;background:#e5e7eb;margin:4px 0;";
    return d;
  }
  document.addEventListener("contextmenu",function(e){
    var row=e.target.closest("#teamEmpList .emp-row");
    if(row==null){ closeMenu(); return; }
    if(window.currentUserRole!=="developer") return;
    var rows=Array.prototype.slice.call(document.querySelectorAll("#teamEmpList .emp-row"));
    var nm=(row.querySelector(".emp-row-name")||{}).textContent||"";
    var cells=row.querySelectorAll(".emp-row-cell");
    var em=cells.length?cells[cells.length-1].textContent.trim():"";
    var u=null;
    for(var k=0;k<PERSONNEL.length;k++){
      if(String(PERSONNEL[k].name||"").trim()===nm.trim() && String(PERSONNEL[k].email||"").trim()===em){ u=PERSONNEL[k]; break; }
    }
    if(u==null){
      for(var k2=0;k2<PERSONNEL.length;k2++){ if(String(PERSONNEL[k2].name||"").trim()===nm.trim()){ u=PERSONNEL[k2]; break; } }
    }
    if(u==null) return;
    var un=u.username||u.login||String(u.email||"").split("@")[0];
    e.preventDefault();
    closeMenu();
    menu=document.createElement("div");
    menu.style.cssText="position:fixed;z-index:99999;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,0.18);padding:6px 0;min-width:220px;border:1px solid #e5e7eb;";
    menu.appendChild(item("Редактировать",function(){ openProfileModal(un); }));
    menu.appendChild(item("Копировать почту",function(){ if(navigator.clipboard) navigator.clipboard.writeText(u.email||""); }));
    menu.appendChild(item("Сбросить пароль",function(){
      var pw=prompt("Новый пароль для "+u.name+" (минимум 6 символов):");
      if(pw==null) return;
      if(pw.length<6){ alert("Пароль слишком короткий"); return; }
      api("PUT","/api/users/"+encodeURIComponent(un)+"/password",{password:pw}).then(function(){ alert("Пароль изменён"); }).catch(function(err){ alert(err.message); });
    }));
    menu.appendChild(sep());
    var RN={user:"Пользователь",admin:"Администратор",developer:"Разработчик",epoki:"ЕПОКИ",dsomk:"ДСОМК",dcpt:"ДЦПТ",dgtk:"ДГТК",project_head:"Руководитель проекта",dept_head:"Начальник отдела",specialist:"Специалист отдела",observer:"Наблюдатель",contractor:"Подрядчик",guest:"Гость",financier:"Финансист"};
    menu.appendChild(head("Роль: "+(RN[u.role]||u.role||"")));
    ["developer","admin","epoki","dsomk","dcpt","dgtk","project_head","dept_head","specialist","observer","contractor","guest","financier"].forEach(function(r){
      if(r===u.role) return;
      menu.appendChild(item("Сделать: "+RN[r],function(){
        if(confirm("Изменить роль "+u.name+" на «"+RN[r]+"»?")){
          api("PUT","/api/users/"+encodeURIComponent(un)+"/role",{role:r}).then(function(){ location.reload(); }).catch(function(err){ alert(err.message); });
        }
      }));
    });
    menu.appendChild(sep());
    menu.appendChild(item("Удалить пользователя",function(){
      if(confirm("Удалить "+u.name+"? Это нельзя отменить.")){
        api("DELETE","/api/users/"+encodeURIComponent(un)).then(function(){ location.reload(); }).catch(function(err){ alert(err.message); });
      }
    },true));
    document.body.appendChild(menu);
    var w=menu.offsetWidth,h=menu.offsetHeight;
    menu.style.left=Math.max(4,Math.min(e.clientX,window.innerWidth-w-8))+"px";
    menu.style.top=Math.max(4,Math.min(e.clientY,window.innerHeight-h-8))+"px";
  });
  document.addEventListener("click",closeMenu);
  window.addEventListener("scroll",closeMenu,true);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeMenu(); });
})();
(function(){
  var hd=document.getElementById("teamHeader");
  var list=document.getElementById("teamEmpList");
  if(hd==null||list==null) return;
  var wrap=document.createElement("div");
  wrap.style.cssText="margin-left:auto;flex-shrink:0;";
  var inp=document.createElement("input");
  inp.type="text";
  inp.autocomplete="off";
  inp.placeholder="Поиск: имя, отдел, должность";
  inp.style.cssText="width:340px;height:44px;box-sizing:border-box;padding:0 16px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:14px;color:#1f2937;outline:none;box-shadow:0 0 7px rgba(107,114,128,0.18);";
  inp.addEventListener("focus",function(){ inp.style.borderColor="#4a9fd8"; });
  inp.addEventListener("blur",function(){ inp.style.borderColor="#d1d5db"; });
  wrap.appendChild(inp);
  function txt(row,sel){ var e=row.querySelector(sel); return e?e.textContent:""; }
  function apply(){
    var q=inp.value.toLowerCase().trim();
    var rows=list.querySelectorAll(".emp-row");
    for(var i=0;i<rows.length;i++){
      var t=(txt(rows[i],".emp-row-name")+" "+txt(rows[i],".emp-row-dept")+" "+txt(rows[i],".emp-row-pos")).toLowerCase();
      rows[i].style.display=(q===""||t.indexOf(q)>=0)?"":"none";
    }
  }
  inp.addEventListener("input",apply);
  new MutationObserver(function(){ if(wrap.parentNode!==hd) hd.appendChild(wrap); }).observe(hd,{childList:true});
  new MutationObserver(apply).observe(list,{childList:true});
  hd.appendChild(wrap);
})();

document.getElementById("infoBtn").addEventListener("click",function(){showPage("page-info",this);});

var leafMap=null;
document.getElementById('mapBtn').addEventListener('click',function(){
  showPage('page-map',this);
  if(leafMap==null){
    leafMap=L.map('mapBox').setView([40.85,69.6],13);
    var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:17,attribution:'Esri'});
    var osm=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:18,attribution:'Esri'});
    sat.addTo(leafMap);
    var genplan=L.imageOverlay('/genplans/OXS01.png',[[40.85861,69.54604],[40.85988,69.54736]],{opacity:0.85,interactive:true}).addTo(leafMap);
    var objHtml='<div style="display:flex;flex-direction:column;gap:10px;">'+'<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;"><div style="font-size:12px;color:#6b7280;">Код</div><div style="font-weight:700;font-size:15px;color:#1f2937;">OXS01</div></div>'+'<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;"><div style="font-size:12px;color:#6b7280;">Наименование</div><div style="font-weight:700;font-size:15px;color:#1f2937;">Кислородная станция</div></div>'+'</div>';
    function refreshMap(){var t=0;var iv=setInterval(function(){leafMap.invalidateSize();t+=30;if(t>450)clearInterval(iv);},30);}
    var allMarkers=[];var allPlans=[];
    function insideAnyPlan(ll){for(var i=0;i<allPlans.length;i++){if(allPlans[i].getBounds().contains(ll)) return true;}return false;}
    function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function pmoney(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n||0));}
    function pdate(d){if(d==null||d=='') return '—';var x=new Date(d);return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+x.getFullYear();}
    function pbar(plan,fact){
      var col=fact>=plan?'#16a34a':'#eab308';
      return '<div style="position:relative;height:8px;background:#e5e7eb;border-radius:4px;margin-top:8px;"><div style="position:absolute;left:0;top:0;bottom:0;width:'+Math.min(100,fact)+'%;background:'+col+';border-radius:4px;"></div><div style="position:absolute;top:-3px;bottom:-3px;width:2px;left:'+Math.min(100,plan)+'%;background:#1f2937;"></div></div>';
    }
    function pcard(title,val){
      return '<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;"><div style="font-size:11px;color:#6b7280;">'+title+'</div><div style="font-weight:700;font-size:11px;color:#1f2937;margin-top:2px;">'+val+'</div></div>';
    }
    function fillPrepReport(){
      var box=document.getElementById('prepReport');

        if(d==null){cur.textContent='Ошибка загрузки';return;}

        ['Этап','Стоимость','Выполнено','План %','Факт %','Начало','Окончание'].forEach(function(x){t+='<th style="'+th+'">'+x+'</th>';});
        t+='</tr>';
        d.stages.forEach(function(s){
          t+='<tr><td style="'+td+'white-space:normal;">'+esc(s.name)+'</td><td style="'+td+'">'+pmoney(s.cost)+'</td><td style="'+td+'">'+pmoney(s.done)+'</td><td style="'+td+'">'+s.planPct+'%</td><td style="'+td+'">'+s.factPct+'%</td><td style="'+td+'">'+pdate(s.start)+'</td><td style="'+td+'">'+pdate(s.end)+'</td></tr>';
        });
        t+='</table>';
        
        var extra=document.createElement('div');
        extra.id='pExtraBlock';
        extra.style.cssText='background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,0.08);';
        var pxb='<div class="pxb" style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;min-height:56px;"></div>';

        var dts=function(f){var r=[];d.stages.forEach(function(x){if(x[f]) r.push(x[f]);});return r.sort(function(p,q){return new Date(p)-new Date(q);});};
        var stA=dts('start'),enA=dts('end');
        var pxd=function(l,v){return '<div style="padding:1px 0 3px 0;"><div style="font-size:11px;color:#6b7280;">'+l+'</div><div style="font-size:14px;font-weight:700;color:#1f2937;">'+pdate(v)+'</div></div>';};
        var dd=d.deltaDays;
        var pxs='<div style="padding:1px 0 3px 0;"><div style="font-size:11px;color:#6b7280;">Срок</div><div style="font-size:14px;font-weight:700;color:'+(dd==null?'#1f2937':(dd>0?'#e53e3e':(dd<0?'#16a34a':'#1f2937')))+';">'+(dd==null?'—':(dd>0?'+':'')+dd+' дн.')+'</div></div>';
        var pxb2='<div class="pxb" style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;min-height:40px;padding:4px 14px;box-sizing:border-box;display:flex;gap:20px;align-items:center;">'+pxd('Начало',d.start||(stA.length?stA[0]:null))+pxd('Окончание',d.end||(enA.length?enA[enA.length-1]:null))+pxd('Прогноз',d.forecastEnd)+pxs+'</div>';
        var lagv=Math.round((d.factPct-d.planPct)*10)/10;

        var pbar2='<div style="flex:1;min-width:120px;max-width:240px;height:10px;border-radius:5px;overflow:hidden;display:flex;background:#e5e7eb;"><div style="width:'+bBlue+'%;background:#4a9fd8;"></div><div style="width:'+bRed+'%;background:#ef4444;"></div><div style="width:'+bGreen+'%;background:#16a34a;"></div></div>';

        extra.innerHTML='<div style="display:grid;grid-template-columns:370px 1fr;gap:12px;">'+pxb1+pxb2+pxb3+'</div>';

function showAppAlert(message){

  const btn=document.createElement("button");

function doPrepImportUpload(file,onDone){
  const fd=new FormData();
  fd.append("file",file);
  fetch("/api/prep/import",{method:"POST",body:fd}).then(r=>r.json()).then(data=>{
    const summary=(data.results||[]).map(r=>r.code+": "+r.status).join("\n");
    showAppAlert("Импорт завершён:\n"+summary);
    if(onDone) onDone();
  }).catch(err=>{ showAppAlert("Ошибка импорта: "+err.message); });
}
function wireStructItemButtons(body,mode,cat){
  const isPrep = mode==="prep" || mode===true;
  const exportBase = isPrep ? "/api/prep/export?code=" : "/api/reports/export?code=";
  const importUrl = isPrep ? "/api/prep/import" : "/api/reports/import";
  function refresh(){ if(isPrep) renderPrepStructureList(body); else renderMainAuxStructureList(body,cat); }
  function doImportUpload(file,onDone){
    const fd=new FormData();
    fd.append("file",file);
    fetch(importUrl,{method:"POST",body:fd}).then(r=>r.json()).then(data=>{
      const summary=(data.results||[]).map(r=>r.code+": "+r.status).join("\n");
      showAppAlert("Импорт завершён:\n"+summary);
      if(onDone) onDone();
    }).catch(err=>{ showAppAlert("Ошибка импорта: "+err.message); });
  }
  body.querySelectorAll(".struct-export-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{ window.location.href=exportBase+btn.dataset.code; });
  });
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".xlsx"; inp.style.display="none";
  document.body.appendChild(inp);
  let activeCode=null;
  body.querySelectorAll(".struct-import-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{ activeCode=btn.dataset.code; inp.value=""; inp.click(); });
  });
  inp.addEventListener("change",()=>{
    if(inp.files.length===0||activeCode===null) return;
    doImportUpload(inp.files[0],refresh);
  });
  body.querySelectorAll(".cat-item-card").forEach(card=>{
    card.addEventListener("dragover",(e)=>{ e.preventDefault(); card.style.outline="2px dashed #4a9fd8"; });
    card.addEventListener("dragleave",()=>{ card.style.outline="none"; });
    card.addEventListener("drop",(e)=>{
      e.preventDefault();
      card.style.outline="none";
      const file=e.dataTransfer.files[0];
      if(!file) return;
      doImportUpload(file,refresh);
    });
  });
}

function enableDragScrollY(el){
  if(!el) return;
  let isDown=false, startY=0, startScroll=0;
  el.addEventListener("mousedown",(e)=>{
    isDown=true;
    el.classList.add("dragging");
    startY=e.pageY;
    startScroll=el.scrollTop;
  });
  window.addEventListener("mouseup",()=>{ isDown=false; el.classList.remove("dragging"); });
  window.addEventListener("mousemove",(e)=>{
    if(!isDown) return;
    e.preventDefault();
    el.scrollTop=startScroll-(e.pageY-startY);
  });
  el.addEventListener("contextmenu",(e)=>{ e.preventDefault(); });
  el.addEventListener("wheel",(e)=>{
    e.preventDefault();
    el.scrollTop+=e.deltaY;
  },{passive:false});
}
function enableDragScroll(el){
  if(!el) return;
  let isDown=false, startX=0, startScroll=0;
  el.addEventListener("mousedown",(e)=>{
    isDown=true;
    el.classList.add("dragging");
    startX=e.pageX;
    startScroll=el.scrollLeft;
  });
  window.addEventListener("mouseup",()=>{ isDown=false; el.classList.remove("dragging"); });
  window.addEventListener("mousemove",(e)=>{
    if(!isDown) return;
    e.preventDefault();
    el.scrollLeft=startScroll-(e.pageX-startX);
  });
  el.addEventListener("wheel",(e)=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
      e.preventDefault();
      el.scrollLeft+=e.deltaY;
    }
  },{passive:false});
}
function fmtMoney(n){
  return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(n);
}
function fmtMoneyOrDash(n){
  return n?fmtMoney(n):"—";
}
const yearCenterLabelPlugin={
  id:"yearCenterLabel",
  afterDraw(chart){
    const ctx=chart.ctx;
    const xScale=chart.scales.x;
    const labels=chart.data.labels;
    const yearGroups={};
    labels.forEach((lab,idx)=>{
      const year=String(lab).slice(0,4);
      yearGroups[year]=yearGroups[year]||[];
      yearGroups[year].push(idx);
    });
    ctx.save();
    ctx.font="bold 10px Arial";
    ctx.fillStyle="#1f2937";
    ctx.textAlign="center";
    ctx.textBaseline="top";
    const y=xScale.bottom+4;
    Object.keys(yearGroups).forEach(year=>{
      const idxs=yearGroups[year];
      const xs=idxs.map(idx=>xScale.getPixelForTick(idx)).filter(v=>v!=null&&!isNaN(v));
      if(!xs.length) return;
      const avgX=xs.reduce((a,b)=>a+b,0)/xs.length;
      ctx.fillText(year,avgX,y);
    });
    ctx.restore();
  }
};
function fmtDate(d){
  if(!d) return "—";

}
function buildGantt(stages){
  const panel=document.getElementById("calendarPanel");
  const items=stages||[];
  const withDates=items.filter(s=>s.start&&s.end);
  if(!withDates.length){ panel.innerHTML='<div class="empty" style="padding:20px;"><p>Нет данных</p></div>'; return; }
  const allDates=[];
  withDates.forEach(s=>{ allDates.push(new Date(s.start)); allDates.push(new Date(s.end)); if(s.forecastEnd) allDates.push(new Date(s.forecastEnd)); });
  const minD=new Date(Math.min(...allDates));
  const maxD=new Date(Math.max(...allDates));
  const bufStart=new Date(minD.getFullYear(),minD.getMonth()-1,1);
  const bufEnd=new Date(maxD.getFullYear(),maxD.getMonth()+2,1);
  const months=[];
  const cur=new Date(bufStart);
  while(cur<bufEnd){ months.push({y:cur.getFullYear(),m:cur.getMonth()+1}); cur.setMonth(cur.getMonth()+1); }
  const monthW=16;
  const totalW=months.length*monthW;
  const t0=bufStart.getTime(), t1=bufEnd.getTime();
  const pos=d=>(new Date(d).getTime()-t0)/(t1-t0)*totalW;
  const yearGroups=[];
  months.forEach(mo=>{ if(!yearGroups.length||yearGroups[yearGroups.length-1].year!==mo.y) yearGroups.push({year:mo.y,count:1}); else yearGroups[yearGroups.length-1].count++; });
  const yearBoundaries=[];
  months.forEach((mo,i)=>{
    if(mo.m===1&&i>0) yearBoundaries.push(i*monthW);
  });
  const yearRowHtml=yearGroups.map(g=>'<span class="gantt-year" style="width:'+(g.count*monthW)+'px;">'+g.year+'</span>').join("");

  const yearLinesHtml=yearBoundaries.map(x=>'<div class="gantt-year-line" style="left:'+x+'px;"></div>').join("");

    const deltaColor=s.deltaDays>0?"#e53e3e":(s.deltaDays<0?"#38a169":"#1f2937");

      +'<div class="gantt-date-col"><span class="gantt-date-label">Начало</span><span class="gantt-date-value">'+fmtDate(s.start)+'</span></div>'
      +'<div class="gantt-date-col"><span class="gantt-date-label">Окончание</span><span class="gantt-date-value">'+fmtDate(s.end)+'</span></div>'
      +'<div class="gantt-date-col"><span class="gantt-date-label">Прогноз</span><span class="gantt-date-value">'+fmtDate(s.forecastEnd)+'</span></div>'
      +'<div class="gantt-date-col"><span class="gantt-date-label">Отклонение</span><span class="gantt-date-value" style="color:'+deltaColor+';">'+deltaText+'</span></div>'
      +'</div>';
  }
  const rowsHtml=items.map(s=>{
    if(!s.start||!s.end){
      return '<div class="gantt-row"><div class="gantt-row-label">'+s.name+'</div>'+ganttDatesHtml(s)+'<div class="gantt-track" style="width:'+totalW+'px;">'+yearLinesHtml+'</div></div>';
    }

    if(s.forecastEnd && new Date(s.forecastEnd)>new Date(s.end)){
      const extraW=pos(s.forecastEnd)-pos(s.end);

  }).join("");

    +'<div style="width:'+(totalW+140)+'px;">'

}

      document.getElementById("prepExternalDone").textContent=fmtMoney(d.externalDone);
      document.getElementById("prepExternalRemaining").textContent=fmtMoney(d.externalRemaining);
      const internalFactPct=d.internal?Math.round(d.internalDone/d.internal*100):0;
      const internalDiff=internalFactPct-d.internalPlanPct;
      const internalDiffColor=internalDiff<0?"#e53e3e":"#38a169";
      const internalDiffText=internalDiff>0?("+"+internalDiff+"%"):(internalDiff+"%");
      document.getElementById("prepProgressInternal").innerHTML='<span style="background:#4a9fd8;color:#fff;padding:3px 8px;border-radius:10px;margin-right:4px;font-size:11px;font-weight:700;">'+d.internalPlanPct+'%</span><span style="background:#38a169;color:#fff;padding:3px 8px;border-radius:10px;margin-right:4px;font-size:11px;font-weight:700;">'+internalFactPct+'%</span><span style="background:'+internalDiffColor+';color:#fff;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;">'+internalDiffText+'</span>';
      const externalFactPct=d.external?Math.round(d.externalDone/d.external*100):0;
      const externalDiff=externalFactPct-d.externalPlanPct;
      const externalDiffColor=externalDiff<0?"#e53e3e":"#38a169";
      const externalDiffText=externalDiff>0?("+"+externalDiff+"%"):(externalDiff+"%");
      document.getElementById("prepProgressExternal").innerHTML='<span style="background:#4a9fd8;color:#fff;padding:3px 8px;border-radius:10px;margin-right:4px;font-size:11px;font-weight:700;">'+d.externalPlanPct+'%</span><span style="background:#38a169;color:#fff;padding:3px 8px;border-radius:10px;margin-right:4px;font-size:11px;font-weight:700;">'+externalFactPct+'%</span><span style="background:'+externalDiffColor+';color:#fff;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;">'+externalDiffText+'</span>';
      const factPct=d.totalCost?Math.round(d.done/d.totalCost*100):0;
      const circ=2*Math.PI*36;
      document.getElementById("prepInternalRing").setAttribute("stroke-dasharray",(circ*factPct/100)+" "+circ);
      document.getElementById("prepInternalRingText").textContent=factPct+"%";
      document.getElementById("prepInternalPlanRing").setAttribute("stroke-dasharray",(circ*d.planPct/100)+" "+circ);
      const planAngleDeg=(d.planPct/100)*360-90;
      const planAngleRad=planAngleDeg*Math.PI/180;
      const planLabel=document.getElementById("prepInternalPlanText");
      planLabel.textContent=d.planPct+"%";
      planLabel.style.left=(45+42*Math.cos(planAngleRad))+"px";
      planLabel.style.top=(45+42*Math.sin(planAngleRad))+"px";
      planLabel.style.transform="translate(-50%,-50%)";
    });
    const prepDynEndLabelPlugin={
      id:"prepDynEndLabels",
      afterDatasetsDraw(chart){
        const ctx=chart.ctx;
        const dsPlan=chart.data.datasets[0];
        const dsFact=chart.data.datasets[1];
        let todayIdx=-1;
        for(let i=dsFact.data.length-1;i>=0;i--){ if(dsFact.data[i]!==null&&dsFact.data[i]!==undefined){ todayIdx=i; break; } }
        function pointAt(dsIndex,data,idx){
          if(idx<0) return null;
          const meta=chart.getDatasetMeta(dsIndex);
          const pt=meta.data[idx];
          if(!pt) return null;
          return {x:pt.x,y:pt.y,value:data[idx]};
        }
        const planPt=pointAt(0,dsPlan.data,todayIdx);
        const factPt=pointAt(1,dsFact.data,todayIdx);
        function drawBadge(pt,color,offsetY){
          if(!pt) return;
          const text=pt.value+"%";
          ctx.font="bold 11px Arial";
          const w=ctx.measureText(text).width+10;
          const h=15;
          const x=pt.x-w/2, y=pt.y+offsetY-h/2;
          ctx.fillStyle=color;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(x,y,w,h,8) : ctx.rect(x,y,w,h);
          ctx.fill();
          ctx.fillStyle="#fff";
          ctx.textAlign="center";
          ctx.textBaseline="middle";
          ctx.fillText(text,pt.x,y+h/2);
        }
        if(planPt) drawBadge(planPt,"#4a9fd8",-14);
        if(factPt) drawBadge(factPt,"#38a169",14);
        if(planPt&&factPt){
          const diff=Math.abs(planPt.value-factPt.value);
          ctx.strokeStyle="#e53e3e";
          ctx.lineWidth=2;
          ctx.setLineDash([3,3]);
          ctx.beginPath();
          ctx.moveTo(planPt.x,planPt.y);
          ctx.lineTo(factPt.x,factPt.y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.font="bold 11px Arial";
          ctx.fillStyle="#e53e3e";
          ctx.textAlign="left";
          ctx.textBaseline="middle";
          ctx.fillText(diff+"%",Math.max(planPt.x,factPt.x)+8,(planPt.y+factPt.y)/2);
        }
      }
    };
    let prepDynamicsChartInstance=null;

    document.addEventListener("click",function(e){

    function renderPrepObjectsList(){
      const list_el=document.getElementById("prepObjectsList");
      if(!list_el) return;

      if(window.prepActiveFilter==="Внутренний") list=prepObjectsData.filter(o=>o.internalCost>0);
      if(window.prepActiveFilter==="Внешний") list=prepObjectsData.filter(o=>o.externalCost>0);
      const headHtml='';
      const groups={};
      list.forEach(o=>{
        const prefix=o.code.split("-")[0];
        groups[prefix]=groups[prefix]||{cost:0,done:0,planWeighted:0};
        groups[prefix].cost+=o.cost||0;
        groups[prefix].done+=o.done||0;
        groups[prefix].planWeighted+=(o.planPct||0)*(o.cost||0);
      });
      const parentAll=[].concat(PROJECTS.main.items,PROJECTS.aux.items);
      const extraNames={"OPS01":"Внепроектные объекты"};

        const g=groups[prefix];

        const name=parent?parent.name:(extraNames[prefix]||prefix);
        const planPct=g.cost?Math.round(g.planWeighted/g.cost):0;
        const factPct=g.cost?Math.min(100,Math.round(g.done/g.cost*100)):0;
        const delta=factPct-planPct;
        const deltaColor=delta<0?"#e53e3e":(delta>0?"#38a169":"#1f2937");

          +'<div style="font-size:9px;font-weight:700;color:'+deltaColor+';background:#fff;border:1px solid #eee;border-radius:20px;padding:2px 0;width:36px;text-align:center;box-sizing:border-box;">'+deltaText+'</div>'
          +'</div>';

        row.addEventListener("click",(e)=>{
          openPrepAllObjectsModal(e,row.dataset.code);
        });
      });
    }
    let prepMobChartInstance=null;

    const prepEndLabelPlugin={
      id:"prepEndLabels",
      afterDatasetsDraw(chart){

        const dsPlan=chart.data.datasets[0];
        const dsFact=chart.data.datasets[1];

          ctx.fillStyle="#fff";
          ctx.textAlign="center";
          ctx.textBaseline="middle";
          ctx.fillText(text,bx+w/2,by+h/2);
          return w;
        }
        let bx=area.left;
        if(planPt!=null){ bx+=drawBadge(planPt.value+"%","#4a9fd8",bx,area.top-19)+4; }

            planLabel.style.left=rx+"px";
            planLabel.style.top=ry+"px";
            planLabel.style.transform="translate(-50%,-50%)";
          }
        }
      }
    };

}
