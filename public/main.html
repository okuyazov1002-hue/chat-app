<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДСОМК — Отчётность</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --dim: 0.75; }

    body {
      font-family: -apple-system, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      background: #0a1628;
    }

    .bg {
      position: fixed;
      inset: -10%;
      background: url("/assets/genplan-bg.jpg") center / cover no-repeat;
      animation: drift 60s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes drift {
      0%   { transform: scale(1.05) translate(0, 0); }
      50%  { transform: scale(1.15) translate(-2%, -1.5%); }
      100% { transform: scale(1.08) translate(2%, 1.5%); }
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #0a1e3d;
      opacity: var(--dim);
    }

    /* Шапка */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(10, 22, 40, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Логотип */
    .logo { display: flex; align-items: center; gap: 14px; color: #fff; }
    .logo-mark {
      width: 44px; height: 44px;
      border-radius: 12px;
      color: #0a1628;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; letter-spacing: 0.5px;
    }
    .logo-text .title { font-size: 15px; font-weight: 700; letter-spacing: 0.4px; }
    .logo-text .subtitle { font-size: 11.5px; color: rgba(255,255,255,0.65); margin-top: 2px; }

    /* Навигация по разделам */
    .nav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: 28px; margin-right: auto; align-items: center; }
    .nav-btn {
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      background: none;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-drop { position: relative; display: inline-block; }
    .nav-drop-btn {
      background: none; border: 1px solid transparent; cursor: pointer;
      color: rgba(255,255,255,0.75); font-size: 14px; font-weight: 600;
      padding: 9px 16px; border-radius: 999px;
    }
    .nav-drop-btn:hover, .nav-drop.open .nav-drop-btn { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-drop-list {
      display: none; position: absolute; top: 100%; left: 0; z-index: 50;
      background: #0a1628; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 4px; min-width: 200px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .nav-drop-list .nav-btn { font-size: 12.5px; padding: 7px 12px; white-space: nowrap; }
    .nav-drop.open .nav-drop-list { display: block; }
    .nav-drop-list .nav-btn { display: block; width: 100%; text-align: left; }
    /* Персонал */
    .chrono-table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; background: #fff; font-size: 13px; color: #1c2a3d; }
    .chrono-table thead th:nth-child(1) { width: 14%; }
    .chrono-table thead th:nth-child(2) { width: 8%; }
    .chrono-table thead th:nth-child(3) { width: 12%; }
    .chrono-table thead th:nth-child(4) { width: 51%; }
    .chrono-table thead th:nth-child(5) { width: 12%; }
    .chrono-table thead th:nth-child(6) { width: 3%; }
    .ct-menu-cell { text-align: center; }
    .ct-dots { background: #0a1e3d; color: #fff; border: none; border-radius: 6px; width: 26px; height: 26px; font-size: 16px; font-weight: 900; cursor: pointer; line-height: 1; }
    .ct-dots:hover { background: #2e3d54; }
    .ct-edited { color: #b8860b; font-size: 11px; }
    .ct-ctx { position: fixed; z-index: 999; background: #fff; border: 1px solid #d5dbe5; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.18); overflow: hidden; }
    .ct-ctx button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 9px 16px; font-size: 13px; cursor: pointer; color: #1c2a3d; }
    .ct-ctx button:hover { background: #eef2f8; }
    .chrono-table td { word-wrap: break-word; }
    .chrono-table th, .chrono-table td { border: 1px solid #e3e8f0; padding: 7px 10px; text-align: left; vertical-align: top; }
    .chrono-scroll { max-height: calc(100vh - 220px); overflow-y: auto; border-radius: 10px; }
    .chrono-table thead tr:first-child th { background: #0a1e3d; color: #fff; font-size: 12.5px; position: sticky; top: 0; z-index: 15; }
    .ct-filters th { position: sticky; top: var(--ct-top2, 31px); z-index: 15; }
    .ct-filters th { background: #eef2f8; padding: 4px 6px; }
    .ct-filters input, .ct-filters select { width: 100%; box-sizing: border-box; border: 1px solid #d5dbe5; border-radius: 6px; padding: 5px 8px; font-size: 12.5px; background: #fff; }
    .ct-proj { font-weight: 700; color: #0a1e3d; background: #f6f8fb; vertical-align: top; }
    .ct-proj-stick { position: sticky; top: var(--ct-top4, 64px); }
    .ct-date { font-weight: 700; color: #0a1e3d; }
    .chrono-table th:nth-child(3), .chrono-table td:nth-child(3) { width: 180px; }
    .ct-user { color: #5a6a84; }
    .ct-org {}
    .chrono-topbtns { display: flex; gap: 8px; justify-content: flex-end; margin: -20px 0 8px; }
    .chrono-form { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; align-items: center; position: sticky; top: 0; z-index: 20; background: #0f2138; padding: 10px 12px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
    .chrono-form select, .chrono-form input { background: #fff; border: 1px solid #d5dbe5; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .chrono-form input[type="text"] { flex: 1; min-width: 240px; }
    .chrono-sec { font-weight: 800; font-size: 14px; margin: 18px 0 6px; color: #0a1e3d; }
    .chrono-proj { font-size: 14px; font-weight: 700; margin: 14px 0 4px; color: #fff; background: #2e3d54; border-radius: 8px; padding: 7px 12px; }
    .chrono-entry { display: flex; gap: 10px; background: #fff; color: #1c2a3d; border: 1px solid #e3e8f0; border-radius: 8px; padding: 8px 12px; margin: 4px 0; font-size: 13px; align-items: baseline; }
    .chrono-date { color: #0a1e3d; font-weight: 700; white-space: nowrap; }
    .chrono-text { flex: 1; }
    .chrono-author { color: #8a97ab; font-size: 12px; white-space: nowrap; }
    .pers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .pers-card {
      background: #f3f4f6; border-radius: 14px; padding: 16px;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .pers-photo {
      width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0;
      background: #e5e7eb; color: #6b7280; font-size: 26px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; cursor: pointer;
    }
    .pers-photo img { width: 100%; height: 100%; object-fit: cover; }
    .pers-name { font-size: 14px; font-weight: 700; color: #0a1628; margin-bottom: 4px; }
    .pers-line { font-size: 11.5px; color: #374151; margin-top: 2px; }
    .pers-line span { color: #6b7280; }
    @media (max-width: 1100px) { .pers-grid { grid-template-columns: repeat(2, 1fr); } }
    .nav-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.22);
    }

    /* Кнопка пользователя */
    .user-menu { position: relative; }
    .user-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 18px;
      font-size: 15px; font-weight: 600; color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .user-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .user-btn .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: #fff; color: #0a1628;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }

    /* Выпадающее меню */
    .dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 210px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(10, 22, 40, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      display: none;
    }
    .dropdown.open { display: block; }
    .dropdown button {
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      padding: 11px 14px;
      font-size: 14.5px;
      color: #fff;
      background: none;
      border: none;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
    }
    .dropdown button:hover { background: rgba(255, 255, 255, 0.12); }
    .dropdown .danger { color: #ffb4b4; }

    /* Контент */
    .content {
      position: relative;
      z-index: 1;
      padding: 40px 28px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 17px;
    }

    /* Вкладки и списки проектов */
    .tab { display: none; }
    .tab.active { display: block; }
    .tab-title { color: #fff; font-size: 22px; margin-bottom: 20px; }
    .tab-empty { color: rgba(255,255,255,0.6); }

    .project-list { display: flex; flex-direction: column; gap: 10px; }
    .project-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .project-item:hover {
      background: rgba(255, 255, 255, 0.13);
      transform: translateX(4px);
    }
    .project-code {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 8px;
      background: #fff;
      color: #0a1628;
      font-size: 13px;
      font-weight: 700;
      font-family: "Consolas", monospace;
    }
    .project-name { color: #fff; font-size: 15px; }
    .project-left { display: flex; align-items: center; gap: 16px; }
    .project-stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .project-stat-box {
      display: flex;
      gap: 16px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      white-space: nowrap;
    }
    .stat-col { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
    .project-stat-box b { color: #fff; font-size: 12.5px; }
    .project-panel {
      display: none;
      background: #fff;
      border-radius: 0 0 14px 14px;
      margin-top: -10px;
      padding: 16px 18px;
      overflow: hidden;
    }
    .project-panel.open { display: block; }
    .project-item.open {
      border-radius: 14px 14px 0 0;
    }

    .panel-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
    }
    .panel-btn {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #0a1628;
      background: #eef1f5;
      border: 1px solid #d5dae1;
      border-radius: 8px;
      cursor: pointer;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8px;
      background: #fff;
      color: #000;
    }
    .report-table th {
      background: #000;
      color: #fff;
      padding: 4px 6px;
      text-align: left;
      white-space: nowrap;
      border: 1px solid #333;
    }
    .report-table td {
      padding: 3px 6px;
      border: 1px solid #ddd;
      white-space: nowrap;
    }

    /* Модальное окно смены пароля */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 380px;
      margin: 16px;
      padding: 32px 30px;
      border-radius: 24px;
      background: rgba(10, 22, 40, 0.85);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .modal h2 { color: #fff; font-size: 19px; margin-bottom: 20px; text-align: center; }
    .modal input {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 14px;
      font-size: 15px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
    }
    .modal input:focus { outline: none; border-color: rgba(255,255,255,0.45); }
    .modal .row { display: flex; gap: 10px; margin-top: 6px; }
    .modal .row button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      border: none;
    }
    .btn-save { background: #fff; color: #0a1628; }
    .btn-cancel { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2) !important; }
    .modal .msg { font-size: 13.5px; text-align: center; margin-bottom: 10px; min-height: 17px; }
    .msg.ok { color: #a7f3d0; }
    .msg.err { color: #ffb4b4; }
  
    /* ===== ДАШБОРД ===== */
    .panel-dashboard { padding: 14px 14px 0; }
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .kpi-card {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .kpi-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .kpi-title { font-size: 12.5px; font-weight: 700; color: #2e3d54; margin-bottom: 8px; }
    .kpi-big { font-size: 20px; font-weight: 700; color: #0a1628; white-space: nowrap; margin-bottom: 8px; }
    .kpi-mid { font-size: 14px; font-weight: 600; color: #0a1628; }
    .kpi-stages { margin-top: 8px; border-top: 1px solid #e5e7eb; padding-top: 6px; }
    .kpi-stage-row { display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; color: #374151; padding: 2px 0; white-space: nowrap; }
    .kpi-stage-row span:first-child { color: #6b7280; }
    .kpi-flex { display: flex; gap: 18px; }
    .kpi-dates { font-size: 15px; font-weight: 700; color: #0a1628; white-space: nowrap; margin-bottom: 8px; }
    .kpi-wide { grid-column: span 2; }
    .kpi-comment { font-size: 12.5px; color: #374151; line-height: 1.5; }
    .kpi-comment-edit {
      width: 100%;
      min-height: 60px;
      border: none;
      padding: 0;
      font-size: 12.5px;
      color: #374151;
      line-height: 1.5;
      font-family: inherit;
      resize: none;
      background: transparent;
      outline: none;
    }
    .chart-card {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    .chart-title { font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .chart-wrap { position: relative; width: 100%; height: 280px; }
    .stage-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .stage-card {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .stage-card-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .stage-card-body { display: none; margin-top: 8px; }
    .stage-card.open .stage-card-body { display: block; }
    .stage-summary { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; margin: 4px 0 8px; padding-bottom: 6px; border-bottom: 1px dashed #d1d5db; }
    .stage-summary b { color: #0a1e3d; }
    .stage-arrow { display: inline-block; transition: transform .2s; font-size: 10px; }
    .stage-card:not(.open) .stage-arrow { transform: rotate(-90deg); }
    .stage-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .stage-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      padding: 4px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .stage-table td { padding: 5px 0; color: #374151; border-top: 1px solid #e5e7eb; }
    .stage-table .st-date { text-align: right; }
    .stage-table .st-delta { text-align: right; font-weight: 600; }
    .stage-table .st-num { text-align: right; }
    .st-bad { color: #b91c1c; }
    .st-good { color: #0a1e3d; }
    .st-empty { color: #9ca3af; text-align: center; padding: 14px 0 !important; }
    .gantt { position: relative; padding: 6px 0; }
    .gantt-row { display: flex; align-items: center; margin-bottom: 8px; }
    .gantt-label { width: 140px; flex-shrink: 0; font-size: 11.5px; color: #374151; }
    .gantt-track { position: relative; flex: 1; height: 22px; background: #e5e7eb; border-radius: 5px; overflow: hidden; }
    .gantt-bar { position: absolute; top: 0; height: 100%; background: #7da7d9; border-radius: 5px; overflow: hidden; }
    .gantt-done { position: absolute; left: 0; top: 0; height: 100%; background: #0a1e3d; }
    .gantt-dates { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #fff; white-space: nowrap; z-index: 1; }
    .gantt-now { position: absolute; top: 0; bottom: 0; width: 2px; background: #b91c1c; }
    .gantt-scale { display: flex; flex: 1; }
    .gantt-year { text-align: center; font-size: 11px; font-weight: 600; color: #374151; border-left: 1px solid #d1d5db; }
    .gantt-month { text-align: center; font-size: 9px; color: #6b7280; overflow: hidden; }
    .prep-kpi { grid-template-columns: repeat(4, 1fr); }
    .prep-red { background: #fde8e8; }
    .prep-red .kpi-label, .prep-red .kpi-big { color: #b91c1c; }
    .prep-bar { height: 6px; background: #e5e7eb; border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .prep-bar > div { height: 100%; background: #0a1e3d; }
    .prep-loading { color: #9ca3af; font-size: 13px; padding: 20px; }
    #prep-groups { margin-top: 16px; }
    .prep-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    @media (max-width: 1100px) { .prep-charts { grid-template-columns: 1fr; } }
    .prep-objs { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 10px; }
    @media (max-width: 1100px) { .prep-objs { grid-template-columns: 1fr; } }
    .prep-obj { display: flex; align-items: center; gap: 8px; background: #f3f4f6; border: 1px solid #f3f4f6; border-radius: 8px; padding: 7px 10px; font-size: 11px; color: #374151; cursor: pointer; }
    .prep-obj:hover { border-color: #7da7d9; }
    .prep-obj.late { border-color: #f5c6c6; background: #fdf3f3; }
    .prep-obj b { color: #0a1628; font-family: Consolas, monospace; font-size: 10.5px; }
    .prep-obj .po-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .po-tag { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: #e8eef8; color: #0a1e3d; flex: none; }
    .po-hours { font-size: 9.5px; color: #6b7280; flex: none; }
    .po-pct { font-weight: 700; color: #0a1628; flex: none; width: 34px; text-align: right; }
    .po-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .prep-det { display: none; grid-column: 1 / -1; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 14px; }
    .prep-det.open { display: block; }
    .prep-det-head { font-size: 12px; font-weight: 700; color: #0a1628; margin-bottom: 8px; }
    .prep-det-head small { font-weight: 400; color: #6b7280; margin-left: 8px; }
    .prep-det-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 1100px) { .prep-det-grid { grid-template-columns: 1fr; } }
    .prep-det h5 { font-size: 10.5px; color: #6b7280; font-weight: 600; margin: 6px 0 4px; }
    .pd-work { display: flex; justify-content: space-between; font-size: 11px; color: #374151; padding: 3px 0; border-top: 1px solid #f3f4f6; }

<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="logo">

    <nav class="nav">

        <div class="nav-drop-list" id="projectsMenuList">
          <button class="nav-btn active" data-tab="schedule">Общий график</button>

          <button class="nav-btn" data-tab="main">Основные проекты</button>

        </div>
      </div>

      <button class="nav-btn" data-tab="personnel">Персонал</button>

    <div class="user-menu">
      <button class="user-btn" id="userBtn">
        <span class="avatar" id="avatar">?</span>
        <span id="username">...</span>
      </button>
      <div class="dropdown" id="dropdown">
        <button id="usersBtn" style="display:none">👥 Пользователи</button>
        <button id="changePassBtn">👤 Аккаунт</button>
        <button class="danger" id="logoutBtn">🚪 Выйти</button>
      </div>
    </div>
  </header>

  <main class="content">
    <div id="tab-schedule" class="tab active">
      <h2 class="tab-title">Общий график</h2>
      <p class="tab-empty">Раздел в разработке — здесь будет общий график работ.</p>
    </div>
    <div id="tab-prep" class="tab"></div>
    <div id="tab-main" class="tab"></div>
    <div id="tab-aux" class="tab"></div>
    <div id="tab-chrono" class="tab">
      <div class="chrono-topbtns">
        <button class="panel-btn" id="chronoExportBtn">📤 экспорт</button>
        <button class="panel-btn" id="chronoImportBtn">📥 импорт</button>
        <input type="file" id="chronoImportFile" accept=".xlsx" style="display:none">
      </div>
      <div class="chrono-form">
        <select id="chronoCode"></select>
        <input type="text" id="chronoProject" placeholder="Название проекта..." style="display:none;min-width:220px;">
        <input type="text" id="chronoOrg" placeholder="Организация" style="max-width:150px;">
        <input type="date" id="chronoDate">
        <input type="text" id="chronoText" placeholder="Что сделано...">
        <button class="panel-btn" id="chronoAddBtn">Добавить</button>
      </div>
      <div id="chrono-body"><div class="prep-loading">Загрузка...</div></div>
    </div>
    <div id="tab-personnel" class="tab">
      <h2 class="tab-title">Персонал</h2>
      <div class="pers-grid" id="pers-grid"><div class="prep-loading">Загрузка...</div></div>
    </div>
  </main>

  <!-- Окно смены пароля -->
  <div class="modal-overlay" id="passModal">
    <div class="modal">
      <h2>Аккаунт</h2>
      <div class="msg" id="passMsg"></div>
      <input type="text" id="accDept" placeholder="Отдел">
      <input type="text" id="accPos" placeholder="Должность">
      <input type="text" id="accInt" placeholder="Внутренний номер">
      <input type="text" id="accMob" placeholder="Мобильный номер">
      <input type="text" id="accEmail" placeholder="Почта">
      <div class="row">
        <button class="btn-save" id="accSave">Сохранить данные</button>
      </div>
      <h2 style="margin-top:14px;">Смена пароля</h2>
      <input type="password" id="oldPass" placeholder="Старый пароль">
      <input type="password" id="newPass" placeholder="Новый пароль (мин. 4 символа)">
      <div class="row">
        <button class="btn-cancel" id="passCancel">Закрыть</button>
        <button class="btn-save" id="passSave">Сменить пароль</button>
      </div>
    </div>
  </div>

  <!-- Окно пользователей -->
  <div class="modal-overlay" id="usersModal">
    <div class="modal modal-wide">
      <h2>Пользователи</h2>
      <div class="msg" id="usersMsg"></div>
      <div id="usersList"></div>
      <h3 class="users-add-title">Добавить пользователя</h3>
      <input type="text" id="newUserName" placeholder="Имя и фамилия">
      <input type="text" id="newUserLogin" placeholder="Логин">
      <input type="password" id="newUserPass" placeholder="Пароль (мин. 4 символа)">
      <select id="newUserRole">
        <option value="user">Пользователь</option>
        <option value="admin">Администратор</option>
      </select>
      <div class="row">
        <button class="btn-cancel" id="usersClose">Закрыть</button>
        <button class="btn-save" id="userCreate">Добавить</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="projects.js"></script>
  <script src="schedule.js"></script>
  <script>

    // Имя пользователя в шапке
    fetch("/api/me").then(r => {
      if (!r.ok) { window.location.href = "/login.html"; return; }
      return r.json();
    }).then(d => {
      if (!d) return;
      document.getElementById("username").textContent = d.name || d.username;
    window.userRole = d.role;
    applyRole();
      document.getElementById("avatar").textContent = d.username[0].toUpperCase();
    });

    // Открытие/закрытие меню
    const dropdown = document.getElementById("dropdown");
    document.getElementById("userBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      dropdown.classList.toggle("open");
    });
    document.addEventListener("click", () => dropdown.classList.remove("open"));

    // ===== ПОЛЬЗОВАТЕЛИ =====
    const usersModal = document.getElementById("usersModal");

    async function loadUsers() {
      const res = await fetch("/api/users");
      const users = await res.json();
      document.getElementById("usersList").innerHTML = users.map(u => `
        <div class="user-row">
          <span class="user-name">${u.name || u.username}<small>${u.username}</small></span>
          <select class="user-role" data-id="${u._id}">
            <option value="user" ${u.role !== "admin" ? "selected" : ""}>Пользователь</option>
            <option value="admin" ${u.role === "admin" ? "selected" : ""}>Администратор</option>
          </select>
          <button class="user-del" data-id="${u._id}">Удалить</button>
        </div>`).join("");
      document.querySelectorAll(".user-role").forEach(sel => {
        sel.addEventListener("change", async () => {
          const res = await fetch("/api/users/" + sel.dataset.id + "/role", {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ role: sel.value })
          });
          const d = await res.json();
          document.getElementById("usersMsg").textContent = d.message;
          if (!res.ok) loadUsers();
        });
      });
      document.querySelectorAll(".user-del").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Удалить пользователя?")) return;
          const res = await fetch("/api/users/" + btn.dataset.id, { method: "DELETE" });
          const d = await res.json();
          document.getElementById("usersMsg").textContent = d.message;
          loadUsers();
        });
      });
    }

    document.getElementById("usersBtn").addEventListener("click", () => {
      document.getElementById("usersMsg").textContent = "";
      usersModal.classList.add("open");
      loadUsers();
    });
    document.getElementById("usersClose").addEventListener("click", () => usersModal.classList.remove("open"));

    document.getElementById("userCreate").addEventListener("click", async () => {
      const res = await fetch("/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("newUserName").value.trim(),
          username: document.getElementById("newUserLogin").value.trim(),
          password: document.getElementById("newUserPass").value,
          role: document.getElementById("newUserRole").value
        })
      });
      const d = await res.json();
      document.getElementById("usersMsg").textContent = d.message;
      if (res.ok) {
        ["newUserName", "newUserLogin", "newUserPass"].forEach(id => document.getElementById(id).value = "");
        loadUsers();
      }
    });

    // Выход
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login.html";
    });

    // Смена пароля
    const passModal = document.getElementById("passModal");
    const passMsg = document.getElementById("passMsg");
    let myPersId = null;
    document.getElementById("changePassBtn").addEventListener("click", async () => {
      passModal.classList.add("open");
      const me = await (await fetch("/api/me")).json();
      const users = await (await fetch("/api/personnel")).json();
      const u = users.find(x => x.username === me.username);
      if (!u) return;
      myPersId = u._id;
      document.getElementById("accDept").value = u.department || "";
      document.getElementById("accPos").value = u.position || "";
      document.getElementById("accInt").value = u.internalPhone || "";
      document.getElementById("accMob").value = u.mobilePhone || "";
      document.getElementById("accEmail").value = u.email || "";
    });
    document.getElementById("accSave").addEventListener("click", async () => {
      const res = await fetch("/api/personnel/" + myPersId, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          department: document.getElementById("accDept").value,
          position: document.getElementById("accPos").value,
          internalPhone: document.getElementById("accInt").value,
          mobilePhone: document.getElementById("accMob").value,
          email: document.getElementById("accEmail").value,
        }),
      });
      passMsg.textContent = res.ok ? "Данные сохранены" : "Ошибка сохранения";
      passMsg.className = "msg " + (res.ok ? "ok" : "err");
    });
    document.getElementById("passCancel").addEventListener("click", () => {
      passModal.classList.remove("open");
      passMsg.textContent = "";
    });
    document.getElementById("passSave").addEventListener("click", async () => {
      const res = await fetch("/api/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          oldPassword: document.getElementById("oldPass").value,
          newPassword: document.getElementById("newPass").value,
        }),
      });
      const d = await res.json();
      passMsg.textContent = d.message;
      passMsg.className = "msg " + (res.ok ? "ok" : "err");
      if (res.ok) setTimeout(() => passModal.classList.remove("open"), 1200);
    });

    // Отрисовка списков проектов
    async function renderTab(key) {
      const container = document.getElementById("tab-" + key);
      if (!container || container.dataset.rendered) return;
      container.dataset.rendered = "1";
      const section = PROJECTS[key];
      container.innerHTML = `<h2 class="tab-title">${section.title}</h2><div class="project-list" id="list-${key}"><div class="tab-empty">Загрузка данных...</div></div>`;
      const rowsByCode = {};
      await Promise.all(section.items.map(async p => {
        const res = await fetch("/api/reports/" + p.code);
        const data = await res.json();
        rowsByCode[p.code] = data.rows || [];
      }));
      let html = "";
      section.items.forEach(p => {
        const s = projectSummary(rowsByCode[p.code]);
        html += `<div class="project-item" data-code="${p.code}">
                   <div class="project-left">
                     <span class="project-code">${p.code}</span>
                     <span class="project-name">${p.name}</span>
                   </div>
                   <div class="project-stats">
                     <div class="project-stat-box">
                       <span>Факт стоимость <b>${money(s.totalCost).replace(" €", "")}</b></span>
                       <span>Освоено <b>${money(s.doneCost).replace(" €", "")}</b></span>
                     </div>
                     <div class="project-stat-box">
                       <span>План <b>${s.planPct}%</b></span>
                       <span>Факт <b>${s.donePct}%</b></span>
                       <span style="color:${s.donePct - s.planPct < 0 ? "#f87171" : "#4ade80"};font-weight:600;">${s.donePct - s.planPct < 0 ? "Отставание " : "Опережение +"}${s.donePct - s.planPct}%</span>
                     </div>

                   </div>
                   
                 </div>`;
      });
      document.getElementById("list-" + key).outerHTML = `<div class="project-list" id="list-${key}">${html}</div>`;
      document.querySelectorAll("#list-" + key + " .project-item").forEach(item => {
        item.addEventListener("click", () => {
          const code = item.dataset.code;
          const panel = document.getElementById("panel-" + code);
          const isOpen = panel.classList.contains("open");
          item.classList.toggle("open", !isOpen);
          panel.classList.toggle("open", !isOpen);
          if (!isOpen) renderDashboard(code);
        });
      });
      applyRole();
    }
    ["main", "aux"].forEach(renderTab);
    renderPrepTab();

    async function renderPrepTab() {
      const container = document.getElementById("tab-prep");
      if (!container || container.dataset.rendered) return;
      container.dataset.rendered = "1";
      container.innerHTML = `<h2 class="tab-title">Подготовительные работы</h2>
        <div class="prep-board" id="prep-board"><div class="prep-loading">Загрузка данных...</div></div>`;

      const prepItems = PROJECTS.prep.items;
      const reports = {};
      const reportsFull = {};
      await Promise.all(prepItems.map(async p => {
        const res = await fetch("/api/reports/" + p.code);
        const data = await res.json();
        reportsFull[p.code] = data;
        reports[p.code] = data.rows || [];
      }));

      // Дата старта СМР родительских проектов (мин. planStart строк этапа СМР/строительство)
      const parentCodes = [...PROJECTS.main.items, ...PROJECTS.aux.items].map(p => p.code);
      const smrStart = {};
      await Promise.all(parentCodes.map(async code => {
        const res = await fetch("/api/reports/" + code);
        const rows = (await res.json()).rows || [];
        const dates = rows
          .filter(r => /смр|строительн/i.test(r.stage || ""))
          .map(r => r.planStart).filter(Boolean).sort();
        smrStart[code] = dates[0] || null;
      }));

      // Прогноз окончания объекта: макс. из forecastEnd (или planEnd) его строк
      function objFinish(rows) {
        const dates = rows.map(r => r.forecastEnd || r.planEnd).filter(Boolean).sort();
        return dates.length ? dates[dates.length - 1] : null;
      }
      function daysBetween(a, b) {
        return Math.round((new Date(a) - new Date(b)) / 86400000);
      }

      // Мини-Гант группы
      function prepGantt(items) {
        // Диапазон дат по всем объектам группы
        let min = null, max = null;
        items.forEach(p => {
          reports[p.code].forEach(r => {
            [r.planStart, r.planEnd, r.factStart, r.factEnd, r.forecastEnd].filter(Boolean).forEach(d => {
              if (!min || d < min) min = d;
              if (!max || d > max) max = d;
            });
          });
        });

        const todayStr = new Date().toISOString().slice(0, 10);
        if (!min) { min = todayStr; max = todayStr; }
        if (!max || max <= min) max = todayStr > min ? todayStr : min + "T99";
        const t0 = new Date(min).getTime(), t1 = new Date(max).getTime();
        const pos = d => Math.max(0, Math.min(100, (new Date(d).getTime() - t0) / (t1 - t0) * 100));

        // Шкала: года сверху, месяцы 01-12 снизу
        const months = [];
        const cur = new Date(min); cur.setDate(1);
        while (cur.getTime() <= t1) {
          months.push({ y: cur.getFullYear(), m: cur.getMonth() + 1 });
          cur.setMonth(cur.getMonth() + 1);
        }
        const mW = 100 / months.length;
        const years = {};
        months.forEach(mo => years[mo.y] = (years[mo.y] || 0) + 1);
        let yearRow = `<span></span>`;
        Object.keys(years).sort().forEach(y => {
          yearRow += `<span style="width:${years[y] * mW}%">${y}</span>`;
        });
        let monthRow = `<span></span>`;
        months.forEach(mo => {
          monthRow += `<span style="width:${mW}%">${String(mo.m).padStart(2, "0")}</span>`;
        });
        const today = new Date().toISOString().slice(0, 10);
        const nowPos = pos(today);

        let rowsHtml = "";
        items.forEach(p => {
          const rows = reports[p.code];
          const starts = rows.map(r => r.planStart).filter(Boolean).sort();
          const ends = rows.map(r => r.forecastEnd || r.planEnd).filter(Boolean).sort();
          if (!starts.length) {
            rowsHtml += `<div class="pg-row">
            <span class="pg-name">${p.name}</span>
            <span class="pg-cell">—</span><span class="pg-cell">—</span>
            <span class="pg-cell">—</span><span class="pg-cell">—</span>
            <span class="pg-pct">—</span><span class="pg-pct">—</span>
            <span class="pg-pct">—</span>
            <div class="pg-track"></div></div>`;
            return;
          }
          const s = starts[0], e = ends.length ? ends[ends.length - 1] : today;
          const pct = objPct(rows);
          const started = rows.some(r => r.factStart);
          const late = pct < 100 && e < today || (smrStart[p.code.split("-")[0]] && e > smrStart[p.code.split("-")[0]]);
          const left = pos(s), width = Math.max(1.5, pos(e) - pos(s));
          let bar;
          if (!started && pct === 0) bar = `<div class="pg-bar plan-only" style="left:${left}%;width:${width}%"></div>`;
          else bar = `<div class="pg-bar" style="left:${left}%;width:${width}%"><div class="pg-fill${late ? " late" : ""}" style="width:${pct}%"></div></div>`;
          const fmtD = d => d ? d.slice(8,10) + "." + d.slice(5,7) + "." + d.slice(2,4) : "—";
          const fEnds = rows.map(r => r.factEnd).filter(Boolean).sort();
          const fStarts = rows.map(r => r.factStart).filter(Boolean).sort();
          // плановый % на сегодня: доля прошедшего времени план-диапазона по деньгам строк
          let planNow = 0, costAll = 0;
          rows.forEach(r => {
            if (!r.planStart) return;
            costAll += r.cost || 0;
            const pe = r.forecastEnd || r.planEnd || today;
            if (today >= pe) planNow += r.cost || 0;
            else if (today > r.planStart) {
              const t = (new Date(today) - new Date(r.planStart)) / (new Date(pe) - new Date(r.planStart));
              planNow += (r.cost || 0) * t;
            }
          });
          const planPct = costAll ? Math.min(100, Math.round(planNow / costAll * 100)) : 0;
          const diff = pct - planPct;
          rowsHtml += `<div class="pg-row">
            <span class="pg-name${late ? " late" : ""}">${p.name}</span>
            <span class="pg-cell">${fmtD(s)}</span><span class="pg-cell">${fmtD(ends.length ? e : null)}</span>
            <span class="pg-cell">${fmtD(fStarts[0])}</span><span class="pg-cell">${fmtD(fEnds[fEnds.length - 1])}</span>
            <span class="pg-pct">${planPct}%</span><span class="pg-pct">${pct}%</span>
            <span class="pg-pct${diff < 0 ? " neg" : ""}">${diff > 0 ? "+" : ""}${diff}%</span>
            <div class="pg-track">${bar}</div></div>`;
        });
        if (!rowsHtml) return `<div class="prep-loading">Нет данных для графика</div>`;

        return `<div class="prep-gantt">
          <div class="pg-head"><span style="width:380px"></span><span style="width:124px;text-align:center">план нач. / оконч.</span><span style="width:124px;text-align:center">факт нач. / оконч.</span><span style="width:144px;text-align:center">прогресс: план / факт / δ</span></div>
          <div class="pg-scale-year">${yearRow}</div>
          <div class="pg-scale-month">${monthRow}</div>
          <div class="pg-body">
            <div class="pg-now" style="left:calc(772px + (100% - 772px) * ${(nowPos / 100).toFixed(3)})"></div>
            ${rowsHtml}
          </div>
          <div class="pg-legend">
            <span><span class="pg-sw" style="background:#0a1e3d"></span> выполнено</span>
            <span><span class="pg-sw" style="background:#7da7d9"></span> план</span>
            <span><span class="pg-sw" style="background:#b91c1c"></span> отставание</span>
            <span><span class="pg-sw" style="background:#e5e7eb;border:1px dashed #9ca3af"></span> не начато</span>
            <span style="color:#b91c1c">│ сегодня</span>
          </div>
        </div>`;
      }

      let done = 0, inWork = 0, notStarted = 0, totalCost = 0, doneCost = 0, totalCostVat = 0, totalFact = 0, inC = { cost: 0, done: 0, fact: 0 }, exC = { cost: 0, done: 0, fact: 0 };
      const effCost = r => /заверш/i.test(r.status || "") ? Math.min(r.cost || 0, r.done || 0) || (r.done || r.cost || 0) : (r.cost || 0);
      prepItems.forEach(p => {
        const rows = reports[p.code];
        totalCost += rows.reduce((s, r) => s + effCost(r), 0);
        doneCost += rows.reduce((s, r) => s + (r.done || 0), 0);
        totalCostVat += rows.reduce((s, r) => s + (r.costVat || 0), 0);
        totalFact += rows.reduce((s, r) => s + (r.costFact || 0), 0);
        let wIn = 0, wEx = 0;
        rows.forEach(r => {
          const c = /внутр/i.test(r.contractor || "") ? inC : (/внеш/i.test(r.contractor || "") ? exC : null);
          if (!c) return;
          c.cost += r.costVat || 0;
          c.fact += r.costFact || 0;
          c.done += r.done || 0;
          if (c === inC) wIn += r.costVat || 0; else wEx += r.costVat || 0;
        });
        const oc = wIn >= wEx && wIn > 0 ? inC : (wEx > 0 ? exC : null);
        if (oc) {
          const pct = objPct(rows);
          oc.total = (oc.total || 0) + 1;
          if (!rows.length || pct === 0) oc.ns = (oc.ns || 0) + 1;
          else if (pct >= 100) oc.fin = (oc.fin || 0) + 1;
          else oc.wip = (oc.wip || 0) + 1;
        }
        const pct = objPct(rows);
        if (!rows.length || pct === 0) notStarted++;
        else if (pct >= 100) done++;
        else inWork++;
      });
      const readiness = totalFact ? Math.min(100, Math.round(doneCost / totalFact * 100)) : 0;

      // Объекты, блокирующие старт СМР основных проектов
      const blockers = [];
      prepItems.forEach(p => {
        const rows = reports[p.code];
        if (!rows.length || objPct(rows) >= 100) return;
        const start = smrStart[p.code.split("-")[0]];
        const fin = objFinish(rows);
        if (!start || !fin) return;
        const d = daysBetween(fin, start);
        if (d > 0) blockers.push({ code: p.code, name: p.name, par: p.code.split("-")[0], days: d });
      });
      blockers.sort((a, b) => b.days - a.days);

      document.getElementById("prep-board").innerHTML = `
        <div class="kpi-row prep-kpi">
          <div class="kpi-card">
            <table class="prep-cost-table">
              <tr><th></th><th>Всего</th><th>Заверш.</th><th>Выполн.</th><th>Не нач.</th></tr>
              <tr class="pcm"><td></td><td>${prepItems.length}</td><td>${done}</td><td>${inWork}</td><td>${notStarted}</td></tr>
              <tr class="pcc"><td>Внутренний</td><td>${inC.total || 0}</td><td>${inC.fin || 0}</td><td>${inC.wip || 0}</td><td>${inC.ns || 0}</td></tr>
              <tr class="pcc"><td>Внешний</td><td>${exC.total || 0}</td><td>${exC.fin || 0}</td><td>${exC.wip || 0}</td><td>${exC.ns || 0}</td></tr>
            </table>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Готовность подготовки</div>
            <div class="kpi-big">${readiness}%</div>
            <div class="prep-bar"><div style="width:${readiness}%"></div></div>
            <div class="kpi-stage-row" style="margin-top:8px;"><span>Внутренний</span><span>${inC.fact ? Math.min(100, Math.round(inC.done / inC.fact * 100)) : 0}%</span></div>
            <div class="kpi-stage-row"><span>Внешний</span><span>${exC.fact ? Math.min(100, Math.round(exC.done / exC.fact * 100)) : 0}%</span></div>
          </div>
          <div class="kpi-card">
            <table class="prep-cost-table">
              <tr><th></th><th>Стоимость с НДС</th><th>Освоено</th><th>Остаток</th></tr>
              <tr class="pcm"><td></td><td>${money(totalCostVat).replace(" €", "")}</td><td>${money(doneCost).replace(" €", "")}</td><td>${money(totalFact - doneCost).replace(" €", "")}</td></tr>
              <tr class="pcc"><td>Внутренний</td><td>${money(inC.cost).replace(" €", "")}</td><td>${money(inC.done).replace(" €", "")}</td><td>${money(inC.fact - inC.done).replace(" €", "")}</td></tr>
              <tr class="pcc"><td>Внешний</td><td>${money(exC.cost).replace(" €", "")}</td><td>${money(exC.done).replace(" €", "")}</td><td>${money(exC.fact - exC.done).replace(" €", "")}</td></tr>
            </table>
          </div>
          <div class="kpi-card prep-red">
            <div class="kpi-label">Блокируют основные</div>
            <div class="kpi-big">${blockers.length || "—"}</div>
            <div class="kpi-label">${blockers.length ? "объектов срывают старт смр" : "срывов старта смр нет"}</div>
          </div>
        </div>
        <div class="panel-toolbar" style="margin-top:12px;">
          <button class="panel-btn btn-import" id="prepImportBtn">📥 импорт</button>
          <button class="panel-btn btn-export" id="prepExportBtn">📤 экспорт</button>
          <input type="file" id="prepImportFile" accept=".xlsx" style="display:none">
        </div>
        ${blockers.length ? `<div class="prep-crit">
          <div class="prep-crit-title">⚠ критично — блокируют старт смр</div>
          ${blockers.map(b => `<div class="prep-crit-row"><b>${b.code}</b> ${b.name} <span class="prep-crit-days">+${b.days} дн к старту ${b.par}</span></div>`).join("")}
        </div>` : ""}
        <div id="prep-groups"></div>`;

      // Группы по родительским проектам (родитель = часть кода до дефиса)
      const parents = {};
      [...PROJECTS.main.items, ...PROJECTS.aux.items].forEach(p => { parents[p.code] = p.name; });
      const groups = {};
      prepItems.forEach(p => {
        const par = p.code.split("-")[0];
        (groups[par] = groups[par] || []).push(p);
      });

      let ghtml = "";
      Object.keys(groups).forEach(par => {
        const items = groups[par];
        let gDone = 0, gWork = 0, gCost = 0, gDoneCost = 0, gFact = 0;
        items.forEach(p => {
          const rows = reports[p.code];
          gCost += rows.reduce((s, r) => s + (r.cost || 0), 0);
          gDoneCost += rows.reduce((s, r) => s + (r.done || 0), 0);
          gFact += rows.reduce((s, r) => s + (r.costFact || 0), 0);
          const pct = objPct(rows);
          if (pct >= 100 && rows.length) gDone++;
          else if (pct > 0) gWork++;
        });
        const gPct = gFact ? Math.min(100, Math.round(gDoneCost / gFact * 100)) : 0;
        const parName = parents[par] || "Общеплощадочные объекты";

        // Вердикт: худший прогноз объектов группы vs старт СМР родителя
        let verdict = "";
        const start = smrStart[par];
        if (start) {
          let worstDays = null;
          items.forEach(p => {
            const fin = objFinish(reports[p.code]);
            if (!fin) return;
            const d = daysBetween(fin, start);
            if (worstDays === null || d > worstDays) worstDays = d;
          });
          if (worstDays === null) verdict = "";
          else if (worstDays > 0) verdict = `<span class="prep-verdict bad">КРИТИЧНО — срыв старта СМР на ${worstDays} дн</span>`;
          else if (worstDays > -14) verdict = `<span class="prep-verdict bad">ЕСТЬ РИСКИ — запас ${-worstDays} дн</span>`;
          else verdict = `<span class="prep-verdict good">УСПЕВАЕМ</span>`;
        }
        ghtml += `<div class="prep-group" data-par="${par}">
          <div class="prep-group-head">
            <div class="prep-group-title">▶ ${par} — ${parName} <small>· ${items.length} объектов</small> ${verdict}</div>
            <div class="prep-group-stats">
              <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
                <span>Факт стоимость <b>${money(gFact).replace(" €", "")}</b></span>
                <span>Освоено <b>${money(gDoneCost).replace(" €", "")}</b></span>
              </span>
              <span>готово <b>${gDone}</b></span>
              <span>в работе <b>${gWork}</b></span>
              <span>площадка <span class="prep-minibar"><div style="width:${gPct}%"></div></span> <b>${gPct}%</b></span>
            </div>
          </div>
          <div class="prep-group-body">
            ${prepGantt(items)}
            <div class="prep-charts">
              <div class="chart-card"><div class="chart-title">Освоение за период — план / факт по месяцам</div><div class="chart-wrap" style="height:200px;"><canvas id="cash-${par}"></canvas></div></div>
              <div class="chart-card"><div class="chart-title">Мобилизация — рабочая сила, чел (план / факт)</div><div class="chart-wrap" style="height:200px;" id="wfwrap-${par}"><canvas id="wf-${par}"></canvas></div></div>
            </div>
            ${prepObjRows(items)}
          </div>
        </div>`;
      });
      document.getElementById("prep-groups").innerHTML = ghtml;

      // Импорт единого файла подготовительных работ (только admin)
      const prepCodes = new Set(prepItems.map(p => p.code));
      async function importPrepFile(file) {
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(await file.arrayBuffer());
        const ws = wb.worksheets[0];
        const byCode = {};
        let skipped = 0;
        ws.eachRow((row, n) => {
          if (n === 1) return;
          const v = i => { const x = row.getCell(i).value; return x && x.result !== undefined ? x.result : x; };
          const code = String(v(1) || "").trim();
          if (!prepCodes.has(code)) { if (code) skipped++; return; }
          const dt = i => {
            const x = v(i);
            if (x instanceof Date) return x.toISOString().slice(0, 10);
            if (typeof x === "string" && /^\d{4}-\d{2}-\d{2}/.test(x)) return x.slice(0, 10);
            return null;
          };
          const num = i => {
            const x = v(i);
            if (typeof x === "number") return x;
            return Number(String(x || "").replace(/\s/g, "").replace(",", ".")) || 0;
          };
          (byCode[code] = byCode[code] || []).push({
            contractor: String(v(3) || ""),
            stage: String(v(4) || ""),
            item: String(v(5) || ""),
            planStart: dt(6), planEnd: dt(7),
            factStart: dt(8), factEnd: dt(9),
            cost: num(10), costVat: num(11), costFact: num(12),
            done: num(13),
            status: String(v(14) || ""),
            forecastEnd: dt(15),
            mhPlan: num(16), mhFact: num(17),
            eqPlan: num(18), eqFact: num(19),
          });
        });
        // Мобилизация: листы "Рабочая сила" и "Спец техника" (строки парами План/Факт, колонки-месяцы)
        const name2code = {};
        prepItems.forEach(p => { name2code[p.name.trim().toLowerCase()] = p.code; });
        const mob = { workforce: {}, equipment: {} };
        [["Рабочая сила", "workforce"], ["Спец техника", "equipment"]].forEach(([sheetName, key]) => {
          const sh = wb.worksheets.find(w => w.name.trim().toLowerCase() === sheetName.toLowerCase());
          if (!sh) return;
          const months = [];
          sh.getRow(1).eachCell((cell, col) => {
            const x = cell.value && cell.value.result !== undefined ? cell.value.result : cell.value;
            if (x instanceof Date) months[col] = x.toISOString().slice(0, 7);
          });
          let curCode = null;
          sh.eachRow((row, n) => {
            if (n === 1) return;
            const rv = i => { const x = row.getCell(i).value; return x && x.result !== undefined ? x.result : x; };
            const oname = String(rv(1) || "").trim().toLowerCase();
            if (oname) curCode = name2code[oname] || null;
            if (!curCode) return;
            const kind = String(rv(2) || "").trim().toLowerCase();
            if (kind !== "план" && kind !== "факт") return;
            const store = (mob[key][curCode] = mob[key][curCode] || {});
            months.forEach((m, col) => {
              if (!m) return;
              const val = Number(String(rv(col) || "").replace(/\s/g, "").replace(",", ".")) || 0;
              if (!val) return;
              store[m] = store[m] || { month: m, plan: 0, fact: 0 };
              store[m][kind === "план" ? "plan" : "fact"] = val;
            });
          });
        });

        const codes = Object.keys(byCode);
        if (!codes.length) { alert("В файле не найдено ни одного объекта из списка"); return; }
        let ok = 0;
        for (const code of codes) {
          const res = await fetch("/api/reports/" + code, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              rows: byCode[code],
              workforce: Object.values(mob.workforce[code] || {}),
              equipment: Object.values(mob.equipment[code] || {})
            })
          });
          if (res.ok) ok++;
        }
        alert(`Обновлено объектов: ${ok} из ${codes.length}` + (skipped ? `, строк пропущено (нет в списке): ${skipped}` : ""));
        location.reload();
      }
      document.getElementById("prepImportBtn").addEventListener("click", () =>
        document.getElementById("prepImportFile").click());
      document.getElementById("prepImportFile").addEventListener("change", e => {
        if (e.target.files[0]) importPrepFile(e.target.files[0]);
        e.target.value = "";
      });
      async function exportPrepFile() {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Подготовительные работы");
        const cols = ["Код","Объект","Исполнитель","Этап","Работа","План начало","План окончание",
          "Факт начало","Факт окончание","Стоимость без НДС","Стоимость с НДС","Факт","Освоено",
          "Статус","Прогноз","чч план","чч факт","мч план","мч факт"];
        ws.addRow(cols);
        ws.getRow(1).eachCell(cell => {
          cell.font = { bold: true, color: { argb: "FFFFFFFF" }, size: 9 };
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF0A1628" } };
        });
        const toDate = s => s ? new Date(s) : null;
        prepItems.forEach(p => {
          (reports[p.code] || []).forEach(r => {
            ws.addRow([
              p.code, p.name, r.contractor || "", r.stage || "", r.item || "",
              toDate(r.planStart), toDate(r.planEnd), toDate(r.factStart), toDate(r.factEnd),
              r.cost || 0, r.costVat || 0, r.costFact || 0, r.done || 0,
              r.status || "", toDate(r.forecastEnd),
              r.mhPlan || 0, r.mhFact || 0, r.eqPlan || 0, r.eqFact || 0
            ]);
          });
        });
        ws.columns.forEach((col, i) => { col.width = i === 1 ? 34 : (i === 4 ? 30 : 14); });
        [6, 7, 8, 9, 15].forEach(c => { ws.getColumn(c).numFmt = "dd.mm.yyyy"; });

        [["Рабочая сила", "workforce"], ["Спец техника", "equipment"]].forEach(([sheetName, key]) => {
          const sh = wb.addWorksheet(sheetName);
          const monthsSet = new Set();
          prepItems.forEach(p => ((reportsFull[p.code] || {})[key] || []).forEach(m => monthsSet.add(m.month)));
          const months = [...monthsSet].sort();
          sh.addRow(["Объект", "", ...months.map(m => new Date(m + "-01"))]);
          months.forEach((m, i) => { sh.getColumn(3 + i).numFmt = "mmm yyyy"; sh.getColumn(3 + i).width = 12; });
          sh.getColumn(1).width = 34;
          sh.getRow(1).eachCell(cell => { cell.font = { bold: true, size: 9 }; });
          prepItems.forEach(p => {
            const data = (reportsFull[p.code] || {})[key] || [];
            if (!data.length) return;
            const byMonth = {};
            data.forEach(m => byMonth[m.month] = m);
            sh.addRow([p.name, "План", ...months.map(m => (byMonth[m] || {}).plan || "")]);
            sh.addRow(["", "Факт", ...months.map(m => (byMonth[m] || {}).fact || "")]);
          });
        });

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Подготовительные_работы_${new Date().toISOString().slice(0, 10)}.xlsx`;
        a.click();
        URL.revokeObjectURL(url);
      }
      document.getElementById("prepExportBtn").addEventListener("click", () => exportPrepFile());

      // Компактные строки объектов группы
      function prepObjRows(items) {
        const today = new Date().toISOString().slice(0, 10);
        return `<div class="prep-objs">` + items.map(p => {
          const rows = reports[p.code];
          const pct = objPct(rows);
          const stage = (rows[0] || {}).stage || "";
          const mhP = rows.reduce((s, r) => s + (r.mhPlan || 0), 0);
          const mhF = rows.reduce((s, r) => s + (r.mhFact || 0), 0);
          const hrs = mhP || mhF ? `чч ${(mhF / 1000).toFixed(1)}/${(mhP / 1000).toFixed(1)}т` : "";
          const ends = rows.map(r => r.forecastEnd || r.planEnd).filter(Boolean).sort();
          const e = ends[ends.length - 1];
          const late = pct < 100 && ((e && e < today) || (smrStart[p.code.split("-")[0]] && e && e > smrStart[p.code.split("-")[0]]));
          const dot = pct >= 100 ? "#0a1e3d" : (pct > 0 ? "#7da7d9" : "#d1d5db");
          return `<div class="prep-obj${late ? " late" : ""}" data-obj="${p.code}">
            <b>${p.code}</b>
            <span class="po-name">${p.name}</span>
            ${stage ? `<span class="po-tag">${stage}</span>` : ""}
            ${hrs ? `<span class="po-hours">${hrs}</span>` : ""}
            <span class="po-pct">${pct}%</span>
            <span class="po-dot" style="background:${late ? "#b91c1c" : dot}"></span>
          </div>`;
        }).join("") + `</div>`;
      }

      // Панель деталей объекта
      function prepObjDetails(code) {
        const p = prepItems.find(x => x.code === code);
        const rows = reports[code];
        const full = reportsFull[code] || {};
        const fmtD = d => d ? d.slice(8, 10) + "." + d.slice(5, 7) + "." + d.slice(2, 4) : "—";
        const ends = rows.map(r => r.forecastEnd || r.planEnd).filter(Boolean).sort();
        const fin = ends[ends.length - 1];
        const start = smrStart[code.split("-")[0]];
        const cost = rows.reduce((s, r) => s + (r.costFact || r.cost || 0), 0);
        const done = rows.reduce((s, r) => s + (r.done || 0), 0);
        const mhP = rows.reduce((s, r) => s + (r.mhPlan || 0), 0);
        const mhF = rows.reduce((s, r) => s + (r.mhFact || 0), 0);
        const works = rows.map(r => `<div class="pd-work"><span>${r.stage}${r.item && r.item !== r.stage + " по объекту" ? " — " + r.item : ""}</span><span>${r.status || "—"} · ${fmtD(r.planStart ? String(r.planStart).slice(0,10) : null)} → ${fmtD((r.forecastEnd || r.planEnd) ? String(r.forecastEnd || r.planEnd).slice(0,10) : null)}</span></div>`).join("");
        return `<div class="prep-det open" id="det-${code}">
          <div class="prep-det-head">${code} ${p ? p.name : ""}<small>прогноз ${fmtD(fin)}${start ? " при старте СМР " + fmtD(start) : ""}</small></div>
          <div class="prep-det-grid">
            <div>
              <h5>Работы объекта</h5>
              ${works || '<div class="pd-nums">Нет строк</div>'}
              <h5>Стоимость / освоено</h5>
              <div class="pd-nums">${money(cost).replace(" €", "")} / ${money(done).replace(" €", "")} (${objPct(rows)}%)</div>
            </div>
            <div>
              <h5>Чел.-часы: факт ${Math.round(mhF).toLocaleString("ru")} из ${Math.round(mhP).toLocaleString("ru")}</h5>
              <div class="pd-bar"><div style="width:${mhP ? Math.min(100, Math.round(mhF / mhP * 100)) : 0}%"></div></div>
              <h5>Комментарий</h5>
              <textarea class="pd-comment" data-code="${code}" placeholder="Причины отставания, риски, решения...">${full.comment || ""}</textarea>
            </div>
          </div>
        </div>`;
      }

      // Графики группы: освоение по месяцам + мобилизация
      function drawGroupCharts(par, items) {
        const cashByMonth = {};
        items.forEach(p => {
          reports[p.code].forEach(r => {
            if (r.planStart && (r.planEnd || r.forecastEnd)) {
              const ps = new Date(r.planStart), pe = new Date(r.forecastEnd || r.planEnd);
              const months = Math.max(1, (pe.getFullYear() - ps.getFullYear()) * 12 + (pe.getMonth() - ps.getMonth()) + 1);
              const per = (r.costFact || r.cost || 0) / months;
              const d = new Date(ps.getFullYear(), ps.getMonth(), 1);
              for (let i = 0; i < months; i++) {
                const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
                (cashByMonth[k] = cashByMonth[k] || { plan: 0, fact: 0 }).plan += per;
                d.setMonth(d.getMonth() + 1);
              }
            }
            if (r.factStart && (r.done || 0) > 0) {
              const fs = new Date(r.factStart), fe = r.factEnd ? new Date(r.factEnd) : new Date();
              const months = Math.max(1, (fe.getFullYear() - fs.getFullYear()) * 12 + (fe.getMonth() - fs.getMonth()) + 1);
              const per = (r.done || 0) / months;
              const d = new Date(fs.getFullYear(), fs.getMonth(), 1);
              for (let i = 0; i < months; i++) {
                const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
                (cashByMonth[k] = cashByMonth[k] || { plan: 0, fact: 0 }).fact += per;
                d.setMonth(d.getMonth() + 1);
              }
            }
          });
        });
        const nowKey = new Date().toISOString().slice(0, 7);
        const cashKeys = Object.keys(cashByMonth).sort();
        if (cashKeys.length) {
          const WIN = 48;
          const cnv = document.getElementById("cash-" + par);
          const mkData = from => {
            const keys = cashKeys.slice(from, from + WIN);
            return {
              labels: keys.map(k => k.slice(5) + "." + k.slice(2, 4)),
              datasets: [
                { label: "План", data: keys.map(k => Math.round(cashByMonth[k].plan / 1e9 * 100) / 100), backgroundColor: "#7da7d9" },
                { label: "Факт", data: keys.map(k => k <= nowKey ? Math.round(cashByMonth[k].fact / 1e9 * 100) / 100 : null), backgroundColor: "#0a1e3d" }
              ]
            };
          };
          const start = Math.max(0, cashKeys.length - WIN);
          const chart = new Chart(cnv, {
            type: "bar",
            data: mkData(start),
            options: { responsive: true, maintainAspectRatio: false,
              plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 10 } } } },
              scales: { y: { title: { display: true, text: "млрд" } }, x: { grid: { display: false }, ticks: { font: { size: 8 }, maxRotation: 0, autoSkip: false, callback: function(v, i) { const l = this.getLabelForValue(v); const mm = l.slice(0, 2); return mm === "01" || i === 0 ? [mm, "20" + l.slice(3)] : mm; } } } } }
          });
          if (cashKeys.length > WIN) {
            const rng = document.createElement("input");
            rng.type = "range"; rng.min = 0; rng.max = cashKeys.length - WIN; rng.value = start;
            rng.style.width = "100%";
            cnv.parentElement.after(rng);
            rng.addEventListener("input", () => {
              chart.data = mkData(Number(rng.value));
              chart.update("none");
            });
          }
        }

        const wfByMonth = {};
        items.forEach(p => {
          ((reportsFull[p.code] || {}).workforce || []).forEach(w => {
            (wfByMonth[w.month] = wfByMonth[w.month] || { plan: 0, fact: 0 }).plan += w.plan || 0;
            wfByMonth[w.month].fact += w.fact || 0;
          });
        });
        const wfKeys = Object.keys(wfByMonth).sort();
        if (!wfKeys.length) document.getElementById("wfwrap-" + par).innerHTML = `<div class="prep-loading">Нет данных мобилизации</div>`;
        else {
          const WIN2 = 48;
          const cnv2 = document.getElementById("wf-" + par);
          const mkWf = from => {
            const keys = wfKeys.slice(from, from + WIN2);
            return {
              labels: keys.map(k => k.slice(5) + "." + k.slice(2, 4)),
              datasets: [
                { label: "План", data: keys.map(k => wfByMonth[k].plan), backgroundColor: "#7da7d9" },
                { label: "Факт", data: keys.map(k => k <= nowKey ? wfByMonth[k].fact : null), backgroundColor: "#0a1e3d" }
              ]
            };
          };
          const start2 = Math.max(0, wfKeys.length - WIN2);
          const chart2 = new Chart(cnv2, {
            type: "bar",
            data: mkWf(start2),
            options: { responsive: true, maintainAspectRatio: false,
              plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 10 } } } },
              scales: { y: { title: { display: true, text: "чел" } }, x: { grid: { display: false }, ticks: { font: { size: 8 }, maxRotation: 0, autoSkip: false, callback: function(v, i) { const l = this.getLabelForValue(v); const mm = l.slice(0, 2); return mm === "01" || i === 0 ? [mm, "20" + l.slice(3)] : mm; } } } } }
          });
          if (wfKeys.length > WIN2) {
            const rng2 = document.createElement("input");
            rng2.type = "range"; rng2.min = 0; rng2.max = wfKeys.length - WIN2; rng2.value = start2;
            rng2.style.width = "100%";
            cnv2.parentElement.after(rng2);
            rng2.addEventListener("input", () => {
              chart2.data = mkWf(Number(rng2.value));
              chart2.update("none");
            });
          }
        }
      }
      Object.keys(groups).forEach(par => drawGroupCharts(par, groups[par]));
      document.querySelectorAll(".prep-obj").forEach(el => {
        el.addEventListener("click", () => {
          const code = el.dataset.obj;
          const exist = document.getElementById("det-" + code);
          if (exist) { exist.remove(); return; }
          el.insertAdjacentHTML("afterend", prepObjDetails(code));
          const ta = document.querySelector(`#det-${code} .pd-comment`);
          if (window.userRole !== "admin") ta.setAttribute("readonly", "readonly");
          else ta.addEventListener("blur", async () => {
            await fetch("/api/reports/" + code, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ comment: ta.value })
            });
          });
        });
      });

        document.querySelectorAll(".prep-group-head").forEach(h => {
        h.addEventListener("click", () => {
          const g = h.parentElement;
          g.classList.toggle("open");
          h.querySelector(".prep-group-title").innerHTML =
            h.querySelector(".prep-group-title").innerHTML.replace(g.classList.contains("open") ? "▶" : "▼", g.classList.contains("open") ? "▼" : "▶");
        });
      });
    }

    function objPct(rows) {
      if (rows.length && rows.every(r => /заверш/i.test(r.status || ""))) return 100;
      const c = rows.reduce((s, r) => s + (r.cost || 0), 0);
      const d = rows.reduce((s, r) => s + (r.done || 0), 0);
      return c ? Math.min(100, Math.round(d / c * 100)) : 0;
    }

    // Персонал
    async function renderPersonnel() {

      grid.querySelectorAll(".pers-photo").forEach(ph => {

          input.accept = "image/*";
          input.onchange = () => {
            const file = input.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = async () => {
              const canvas = document.createElement("canvas");
              canvas.width = 200; canvas.height = 200;
              const s = Math.min(img.width, img.height);
              canvas.getContext("2d").drawImage(img,
                (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 200, 200);
              const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
              const res = await fetch("/api/personnel/" + ph.dataset.id, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ avatar: dataUrl }),
              });
              if (res.ok) ph.innerHTML = `<img src="${dataUrl}" alt="">`;
              else alert("Нет прав: можно менять только своё фото");
            };
            img.src = URL.createObjectURL(file);
          };
          input.click();
        });
      });
    }
    renderPersonnel();
    // ===== Хронология =====
    let chronoEntries = [];
    function chronoDraw() {
      const body = document.getElementById("chrono-body");
      const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const fv = id => (document.getElementById(id) ? document.getElementById(id).value.trim().toLowerCase() : "");
      const fProj = fv("cfProj"), fDate = fv("cfDate"), fOrg = fv("cfOrg"), fText = fv("cfText"), fUser = fv("cfUser");
      const list = chronoEntries.filter(e => {
        const proj = (e.project || e.code || "").toLowerCase();
        const d = new Date(e.date).toLocaleDateString("ru-RU");
        const fDateFmt = fDate ? new Date(fDate).toLocaleDateString("ru-RU") : "";
        return (!fProj || proj === fProj) &&
               (!fDateFmt || d === fDateFmt) &&
               (!fOrg || (e.org || "").toLowerCase().includes(fOrg)) &&
               (!fText || (e.text || "").toLowerCase().includes(fText)) &&
               (!fUser || (e.author || "").toLowerCase().includes(fUser));
      });
      // Группировка по проекту, проект — одной ячейкой сбоку (rowspan)
      const byProj = {};
      list.forEach(e => {
        const k = e.project || e.code || "Без проекта";
        (byProj[k] = byProj[k] || []).push(e);
      });
      let rows = "";
      Object.keys(byProj).sort().forEach(k => {
        const arr = byProj[k];
        arr.sort((a, b) => new Date(b.date) - new Date(a.date));
        arr.forEach((e, i) => {
          const d = new Date(e.date).toLocaleDateString("ru-RU");
          const hist = [`${esc(e.author || "?")} добавил`].concat((e.history || []).map(h => `${esc(h.user)} ${esc(h.action)} ${new Date(h.at).toLocaleDateString("ru-RU")}`)).join("&#10;");
          rows += `<tr data-id="${e._id}">`;
          if (i === 0) rows += `<td class="ct-proj" rowspan="${arr.length}"><div class="ct-proj-stick">${esc(k)}</div></td>`;
          const edited = (e.history || []).length ? ` <span class="ct-edited">✎</span>` : "";
          rows += `<td class="ct-date">${d}</td><td class="ct-org">${esc(e.org || "")}</td><td class="ct-text">${esc(e.text)}</td><td class="ct-user" title="${hist}">${esc(e.author || "")}${edited}</td><td class="ct-menu-cell"><button class="ct-dots" data-id="${e._id}">⋮</button></td></tr>`;
        });
      });
      const table = `<div class="chrono-scroll"><table class="chrono-table">
        <thead>
          <tr><th>Проект</th><th>Дата</th><th>Исполнитель</th><th>Работа</th><th>Пользователь</th><th class="ct-menu-cell"></th></tr>
          <tr class="ct-filters">
            <th><select id="cfProj"><option value="">Все</option>${[...new Set(chronoEntries.map(e => e.project || e.code || "Без проекта"))].sort().map(p => `<option value="${p.toLowerCase()}">${p}</option>`).join("")}</select></th>
            <th><input type="date" id="cfDate"></th>
            <th><input id="cfOrg" placeholder="Фильтр..."></th>
            <th><input id="cfText" placeholder="Фильтр..."></th>
            <th><input id="cfUser" placeholder="Фильтр..."></th>
            <th class="ct-menu-cell"></th>
          </tr>
        </thead>
        <tbody>${rows || '<tr><td colspan="6" class="tab-empty">Ничего не найдено.</td></tr>'}</tbody>
      </table></div>`;
      // Сохраняем значения фильтров при перерисовке
      const saved = { cfProj: fv("cfProj"), cfDate: fv("cfDate"), cfOrg: fv("cfOrg"), cfText: fv("cfText"), cfUser: fv("cfUser") };
      const focusedId = document.activeElement && document.activeElement.id;
      const caret = focusedId && document.activeElement.selectionStart;
      body.innerHTML = table;
      Object.keys(saved).forEach(id => { const el = document.getElementById(id); if (el) el.value = saved[id]; });
      if (focusedId && document.getElementById(focusedId)) {
        const el = document.getElementById(focusedId);
        el.focus();
        if (caret !== null && caret !== undefined) el.setSelectionRange(caret, caret);
      }
      body.querySelectorAll(".ct-filters input, .ct-filters select").forEach(inp => { inp.addEventListener("input", chronoDraw); inp.addEventListener("change", chronoDraw); });
      chronoStickTops();
    }
    async function renderChrono() {
      const body = document.getElementById("chrono-body");
      try {
        const res = await fetch("/api/chrono");
        chronoEntries = await res.json();
        chronoDraw();
      } catch (e) {
        body.innerHTML = '<p class="tab-empty">Ошибка загрузки.</p>';
      }
    }
    function chronoCloseCtx() { const m = document.querySelector(".ct-ctx"); if (m) m.remove(); }
    function chronoOpenCtx(x, y, id) {
      chronoCloseCtx();
      const m = document.createElement("div");
      m.className = "ct-ctx";
      m.innerHTML = "<button data-act=" + String.fromCharCode(39) + "edit" + String.fromCharCode(39) + ">✏ Редактировать</button><button data-act=" + String.fromCharCode(39) + "del" + String.fromCharCode(39) + ">🗑 Удалить</button>";
      m.style.left = Math.min(x, window.innerWidth - 180) + "px";
      m.style.top = Math.min(y, window.innerHeight - 90) + "px";
      document.body.appendChild(m);
      m.addEventListener("click", async ev => {
        const act = ev.target.dataset.act;
        chronoCloseCtx();
        const e = chronoEntries.find(en => en._id === id);
        if (!e) return;
        if (act === "del") {
          if (!confirm("Удалить запись? " + e.text.slice(0, 80))) return;
          const res = await fetch("/api/chrono/" + id, { method: "DELETE" });
          if (res.ok) renderChrono();
          else { const d = await res.json().catch(() => ({})); alert(d.message || "Ошибка"); }
        }
        if (act === "edit") {
          const tr = document.querySelector(`.chrono-table tr[data-id="${id}"]`);
