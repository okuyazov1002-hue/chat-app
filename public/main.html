<script>
async function init(){
const res=await fetch("/api/me");
if(res.ok===false){window.location.href="/login.html";return;}
const user=await res.json();
document.getElementById("username").textContent=user.name||user.login;
if(user.avatar){
  document.getElementById("avatar").innerHTML='<img src="'+user.avatar+'" style="width:100%;height:100%;object-fit:cover;">';
}else{
  document.getElementById("avatar").textContent=(user.name||user.login).charAt(0).toUpperCase();
}
window.currentUserRole=user.role;
if(user.role!=="admin"&&user.role!=="developer"){
  const btn=document.getElementById("structureBtn");
  if(btn) btn.style.display="none";
}
}
function showPage(id,btn){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".buttons button").forEach(b=>b.classList.remove("nav-active"));if(btn)btn.classList.add("nav-active");}
function fmtDaysUntil(d){
  if(d===0) return "Сегодня";
  if(d===1) return "Завтра";
  return "Через "+d+" дн.";
}
let teamLoaded=false;
function loadTeamPage(){
  if(teamLoaded) return;
  teamLoaded=true;
  const users=PERSONNEL;
  const empListEl=document.getElementById("teamEmpList");
  empListEl.innerHTML=users.map(u=>{
    const avatarHtml=u.avatar?'<img src="'+u.avatar+'">':'<span>'+(u.name?u.name.charAt(0):"?")+'</span>';
    return '<div class="emp-row"><div class="emp-row-avatar">'+avatarHtml+'</div><div class="emp-row-name">'+u.name+'</div><div class="emp-row-dept">'+(u.department||"")+'</div><div class="emp-row-pos">'+(u.position||"")+'</div><div class="emp-row-cell">'+(u.birthday||"")+'</div><div class="emp-row-cell">'+(u.internalPhone||"")+'</div><div class="emp-row-cell">'+(u.mobilePhone||"")+'</div><div class="emp-row-cell">'+(u.email||"")+'</div></div>';
  }).join("");
  const today=new Date();
  today.setHours(0,0,0,0);
  const withDays=users.filter(u=>u.birthday).map(u=>{
    const parts=u.birthday.split(".");
    if(parts.length!==3) return null;
    const day=parseInt(parts[0],10);
    const month=parseInt(parts[1],10)-1;
    let next=new Date(today.getFullYear(),month,day);
    if(next<today) next=new Date(today.getFullYear()+1,month,day);
    const daysUntil=Math.round((next-today)/86400000);
    return {name:u.name,birthday:u.birthday,daysUntil:daysUntil,avatar:u.avatar||""};
  }).filter(Boolean);
  withDays.sort((a,b)=>a.daysUntil-b.daysUntil);
  const upcoming=withDays.slice(0,3);
  document.getElementById("teamHeader").innerHTML=upcoming.map(u=>{
    const avatarHtml=u.avatar?'<img src="'+u.avatar+'">':'<span>'+u.name.charAt(0)+'</span>';
    return '<div class="bday-card"><div class="bday-card-avatar">'+avatarHtml+'</div><div class="bday-card-info"><div class="bday-card-name">'+u.name+'</div><div class="bday-card-date">'+u.birthday+'</div><div class="bday-card-days">'+fmtDaysUntil(u.daysUntil)+'</div></div></div>';
  }).join("");
}
document.getElementById("teamBtn").addEventListener("click",function(){showPage("page-team",this);loadTeamPage();});
document.getElementById("infoBtn").addEventListener("click",function(){showPage("page-info",this);});
document.getElementById("structureBtn").addEventListener("click",function(){showPage("page-structure",this);renderStructureLevel1();});
function renderStructureLevel1(){
  document.getElementById("structureHeader").textContent="Структура проектов";
  const cats=["prep","main","aux"];
  const body=document.getElementById("structureBody");
  body.innerHTML=cats.map(key=>{
    const cat=PROJECTS[key];
    return '<div class="cat-card" data-key="'+key+'" style="background:#fff;border:1px solid #eee;border-radius:10px;margin-bottom:8px;padding:14px 18px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.05);display:flex;justify-content:space-between;align-items:center;">'
      +'<div style="font-size:13px;font-weight:700;color:#1f2937;">'+cat.title+'</div>'
      +'<div style="font-size:11px;color:#9ca3af;">'+cat.items.length+' объектов</div>'
      +'</div>';
  }).join("");
  body.querySelectorAll(".cat-card").forEach(card=>{
    card.addEventListener("click",()=>{ renderStructureLevel2(card.dataset.key); });
  });
}
function renderPrepStructureList(body){
  body.innerHTML='<div class="empty" style="padding:20px;"><p>Загрузка...</p></div>';
  fetch("/api/prep/objects").then(r=>r.json()).then(list=>{
    const dataByCode={};
    list.forEach(o=>{ dataByCode[o.code]=o; });
    const groups={};
    PROJECTS.prep.items.forEach(p=>{
      const prefix=p.code.split("-")[0];
      groups[prefix]=groups[prefix]||[];
      groups[prefix].push(p);
    });
    const parentAll=PROJECTS.main.items.concat(PROJECTS.aux.items);
    body.innerHTML=Object.keys(groups).map(prefix=>{
      const parent=parentAll.find(pp=>pp.code===prefix);
      const extraNames={"OPS01":"Внепроектные объекты"};
      const parentName=parent?parent.name:(extraNames[prefix]||prefix);
      const items=groups[prefix];
      const groupTotalCost=items.reduce((s,p)=>s+((dataByCode[p.code]&&dataByCode[p.code].cost)||0),0);
      const groupTotalDone=items.reduce((s,p)=>s+((dataByCode[p.code]&&dataByCode[p.code].done)||0),0);
      const groupPlanWeighted=items.reduce((s,p)=>{ const o=dataByCode[p.code]; return s+(o?(o.planPct*o.cost):0); },0);
      const groupPlanPct=groupTotalCost?Math.round(groupPlanWeighted/groupTotalCost):0;
      const groupFactPct=groupTotalCost?Math.min(100,Math.round(groupTotalDone/groupTotalCost*100)):0;
      return '<div class="cat-parent-card" style="background:#fff;border:1px solid #eee;border-radius:10px;margin-bottom:6px;box-shadow:0 3px 10px rgba(0,0,0,0.05);overflow:hidden;">'
        +'<div class="cat-item-card-head" style="padding:10px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">'
        +'<div style="display:flex;align-items:center;gap:10px;">'
        +'<div style="font-size:10px;color:#9ca3af;min-width:60px;">'+prefix+'</div>'
        +'<div style="font-size:12px;font-weight:700;color:#1f2937;">'+parentName+'</div>'
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:8px;">'
        +'<div style="font-size:10px;font-weight:700;color:#1f2937;background:#f7f9fb;border-radius:6px;padding:4px 10px;width:120px;text-align:center;">'+(groupTotalCost?fmtMoney(groupTotalCost):"—")+'</div>'
        +'<div style="font-size:10px;font-weight:700;color:#fff;background:#4a9fd8;border-radius:6px;padding:4px 10px;width:50px;text-align:center;">'+(groupTotalCost?groupPlanPct+"%":"—")+'</div>'
        +'<div style="font-size:10px;font-weight:700;color:#fff;background:#38a169;border-radius:6px;padding:4px 10px;width:50px;text-align:center;">'+(groupTotalCost?groupFactPct+"%":"—")+'</div>'
        +'<div style="font-size:10px;color:#9ca3af;min-width:70px;text-align:right;">'+items.length+' объектов</div>'
        +'</div>'
        +'</div>'
        +'<div class="cat-item-card-body" style="max-height:0;overflow:hidden;transition:max-height 0.4s ease;">'
        +'<div style="padding:0 18px 12px 18px;display:flex;flex-direction:column;gap:6px;">'
        +items.map(p=>{
          const o=dataByCode[p.code];
          const badge=o?((o.internalCost>0&&o.externalCost>0)?"Смешанный":(o.internalCost>0?"Внутренний":(o.externalCost>0?"Внешний":"—"))):"—";
          return renderStructItemCard(p.code,p.name,badge,o||null);
        }).join("")
        +'</div>'
        +'</div>'
        +'</div>';
    }).join("");
    body.querySelectorAll(".cat-item-card-head").forEach(head=>{
      head.addEventListener("click",()=>{
        const parentCard=head.closest(".cat-parent-card");
        const bodyEl=parentCard.querySelector(".cat-item-card-body");
        const isOpen=bodyEl.style.maxHeight&&bodyEl.style.maxHeight!=="0px";
        body.querySelectorAll(".cat-item-card-body").forEach(b=>{ b.style.maxHeight="0px"; });
        if(!isOpen) bodyEl.style.maxHeight=bodyEl.scrollHeight+"px";
      });
    });
    wireStructItemButtons(body,true);
  });
}
function renderStructItemCard(code,name,badge,o){
  let updatedText="";
  if(o&&o.updatedAt){
    const d=new Date(o.updatedAt);
    const dateStr=String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
    updatedText=(o.updatedBy||"")+", "+dateStr;
  }
  return '<div class="cat-item-card" data-code="'+code+'" style="background:#eaf3fb;border:1px solid #d6e9f8;border-radius:8px;margin-bottom:1px;padding:4px 12px;box-shadow:0 3px 10px rgba(0,0,0,0.05);display:flex;align-items:center;">'
    +'<div style="font-size:10px;color:#9ca3af;min-width:60px;">'+code+'</div>'
    +'<div style="font-size:12px;font-weight:700;color:#1f2937;">'+name+'</div>'
    +'<div style="display:flex;align-items:center;gap:8px;margin-left:auto;">'
    +'<div style="font-size:10px;font-weight:700;color:#1f2937;background:#fff;border-radius:6px;padding:4px 10px;width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;box-sizing:border-box;">'+(o?fmtMoney(o.cost):"—")+'</div>'
    +'<div style="font-size:10px;font-weight:700;color:#fff;background:#4a9fd8;border-radius:6px;padding:4px 10px;width:50px;text-align:center;box-sizing:border-box;">'+(o?o.planPct+"%":"—")+'</div>'
    +'<div style="font-size:10px;font-weight:700;color:#fff;background:#38a169;border-radius:6px;padding:4px 10px;width:50px;text-align:center;box-sizing:border-box;">'+(o?o.factPct+"%":"—")+'</div>'
    +'<div style="font-size:10px;font-weight:600;color:#1f2937;background:#fff;border-radius:6px;padding:4px 10px;width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;box-sizing:border-box;">'+updatedText+'</div>'
    +'<div class="struct-type-badge" style="font-size:10px;color:#9ca3af;background:#f7f9fb;border-radius:6px;padding:4px 10px;width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;box-sizing:border-box;">'+badge+'</div>'
    +'<button type="button" class="struct-export-btn" data-code="'+code+'" style="width:auto;height:auto;background:#eaf3fb;border:none;color:#4a9fd8;font-size:10px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;">Экспорт</button>'
    +'<button type="button" class="struct-import-btn" data-code="'+code+'" style="width:auto;height:auto;background:#eaf3fb;border:none;color:#4a9fd8;font-size:10px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;">Импорт</button>'
    +'</div>'
    +'</div>';
}
function showAppAlert(message){
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:9999;display:flex;align-items:center;justify-content:center;";
  const box=document.createElement("div");
  box.style.cssText="background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:24px 28px;max-width:420px;width:90%;";
  const text=document.createElement("div");
  text.style.cssText="font-size:13px;color:#1f2937;white-space:pre-line;line-height:1.6;margin-bottom:20px;";
  text.textContent=message;
  const btn=document.createElement("button");
  btn.textContent="OK";
  btn.style.cssText="width:auto;height:auto;background:linear-gradient(160deg,#6a5ae0 0%,#4a90d9 45%,#1dd3b0 100%);color:#fff;border:none;padding:8px 24px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:block;margin-left:auto;";
  btn.addEventListener("click",()=>{ overlay.remove(); });
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) overlay.remove(); });
  box.appendChild(text);
  box.appendChild(btn);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
function doPrepImportUpload(file,onDone){
  const fd=new FormData();
  fd.append("file",file);
  fetch("/api/prep/import",{method:"POST",body:fd}).then(r=>r.json()).then(data=>{
    const summary=(data.results||[]).map(r=>r.code+": "+r.status).join("\n");
    showAppAlert("Импорт завершён:\n"+summary);
    if(onDone) onDone();
  }).catch(err=>{ showAppAlert("Ошибка импорта: "+err.message); });
}
function wireStructItemButtons(body,isPrep){
  body.querySelectorAll(".struct-export-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{ window.location.href="/api/prep/export?code="+btn.dataset.code; });
  });
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".xlsx"; inp.style.display="none";
  document.body.appendChild(inp);
  let activeCode=null;
  body.querySelectorAll(".struct-import-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{ activeCode=btn.dataset.code; inp.value=""; inp.click(); });
  });
  inp.addEventListener("change",()=>{
    if(inp.files.length===0||activeCode===null) return;
    doPrepImportUpload(inp.files[0],()=>{ if(isPrep) renderPrepStructureList(body); });
  });
  body.querySelectorAll(".cat-item-card").forEach(card=>{
    card.addEventListener("dragover",(e)=>{ e.preventDefault(); card.style.outline="2px dashed #4a9fd8"; });
    card.addEventListener("dragleave",()=>{ card.style.outline="none"; });
    card.addEventListener("drop",(e)=>{
      e.preventDefault();
      card.style.outline="none";
      const file=e.dataTransfer.files[0];
      if(!file) return;
      doPrepImportUpload(file,()=>{ if(isPrep) renderPrepStructureList(body); });
    });
  });
}
function renderStructureLevel2(key){
  const cat=PROJECTS[key];
  document.getElementById("structureHeader").innerHTML='<span id="structureBackBtn" style="cursor:pointer;margin-right:10px;">&larr;</span>'+cat.title;
  document.getElementById("structureBackBtn").addEventListener("click",()=>{ renderStructureLevel1(); });
  const body=document.getElementById("structureBody");
  if(key==="prep"){ renderPrepStructureList(body); return; }
  renderMainAuxStructureList(body,cat);
}
function renderMainAuxStructureList(body,cat){
  body.innerHTML='<div class="empty" style="padding:20px;"><p>Загрузка...</p></div>';
  Promise.all(cat.items.map(p=>fetch("/api/reports/"+p.code+"/summary").then(r=>r.json()).then(sum=>({code:p.code,sum:sum})))).then(results=>{
    const sumByCode={};
    results.forEach(r=>{ sumByCode[r.code]=r.sum; });
    body.innerHTML=cat.items.map(p=>{
      const sum=sumByCode[p.code];
      const stagesHtml=renderStageRows(p.code,sum.stages);
      return '<div class="cat-parent-card" style="background:#fff;border:1px solid #eee;border-radius:10px;margin-bottom:6px;box-shadow:0 3px 10px rgba(0,0,0,0.05);overflow:hidden;">'
        +'<div class="stage-expand-head" data-code="'+p.code+'" style="padding:10px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">'
        +'<div style="display:flex;align-items:center;gap:10px;">'
        +'<div style="font-size:10px;color:#9ca3af;min-width:60px;">'+p.code+'</div>'
        +'<div style="font-size:12px;font-weight:700;color:#1f2937;">'+p.name+'</div>'
        +'</div>'
        +'<div style="font-size:10px;color:#9ca3af;">'+sum.stages.length+' этапов</div>'
        +'</div>'
        +'<div class="stage-expand-body" data-code="'+p.code+'" style="max-height:0;overflow:hidden;transition:max-height 0.4s ease;">'+stagesHtml+'</div>'
        +'</div>';
    }).join("");
    wireStageButtons(body);
    body.querySelectorAll(".stage-expand-head").forEach(head=>{
      head.addEventListener("click",()=>{
        const code=head.dataset.code;
        const bodyEl=body.querySelector('.stage-expand-body[data-code="'+code+'"]');
        const isOpen=bodyEl.style.maxHeight&&bodyEl.style.maxHeight!=="0px";
        body.querySelectorAll(".stage-expand-body").forEach(b=>{ b.style.maxHeight="0px"; });
        if(!isOpen) bodyEl.style.maxHeight=bodyEl.scrollHeight+"px";
      });
    });
  });
}
function renderStageRows(code,stages){
  return '<div style="padding:0 18px 12px 18px;display:flex;flex-direction:column;gap:6px;">'
    +stages.map(st=>{
      return '<div class="stage-row" data-code="'+code+'" data-stage="'+st.name+'" style="background:#eaf3fb;border:1px solid #d6e9f8;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:10px;">'
        +'<div style="font-size:11px;font-weight:600;color:#1f2937;min-width:220px;">'+st.name+'</div>'
        +'<div style="display:flex;align-items:center;gap:8px;margin-left:auto;">'
        +'<div style="font-size:10px;font-weight:700;color:#1f2937;background:#fff;border-radius:6px;padding:4px 10px;width:120px;text-align:center;">'+(st.cost?fmtMoney(st.cost):"—")+'</div>'
        +'<div style="font-size:10px;font-weight:700;color:#fff;background:#4a9fd8;border-radius:6px;padding:4px 10px;width:50px;text-align:center;">'+(st.cost?st.planPct+"%":"—")+'</div>'
        +'<div style="font-size:10px;font-weight:700;color:#fff;background:#38a169;border-radius:6px;padding:4px 10px;width:50px;text-align:center;">'+(st.cost?Math.min(100,Math.round(st.done/st.cost*100))+"%":"—")+'</div>'
        +'<button type="button" class="stage-export-btn" data-code="'+code+'" data-stage="'+st.name+'" style="width:auto;height:auto;background:#fff;border:none;color:#4a9fd8;font-size:10px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;">Экспорт</button>'

function wireStageButtons(container){
  container.querySelectorAll(".stage-export-btn").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      window.location.href="/api/prep/export?code="+btn.dataset.code+"&stage="+encodeURIComponent(btn.dataset.stage);
    });
  });
  const stageFileInput=document.createElement("input");
  stageFileInput.type="file";
  stageFileInput.accept=".xlsx";
  stageFileInput.style.display="none";
  document.body.appendChild(stageFileInput);
  let activeStageCode=null,activeStageName=null,activeBodyEl=null;
  container.querySelectorAll(".stage-import-btn").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      activeStageCode=btn.dataset.code;
      activeStageName=btn.dataset.stage;
      activeBodyEl=container.querySelector('.stage-expand-body[data-code="'+activeStageCode+'"]');
      stageFileInput.value="";
      stageFileInput.click();
    });
  });
  stageFileInput.addEventListener("change",()=>{
    if(stageFileInput.files.length===0||activeStageCode===null) return;
    const fd=new FormData();
    fd.append("file",stageFileInput.files[0]);
    fetch("/api/prep/import?stage="+encodeURIComponent(activeStageName),{method:"POST",body:fd}).then(r=>r.json()).then(data=>{
      const summary=(data.results||[]).map(r=>r.code+": "+r.status).join("\n");
      showAppAlert("Импорт завершён:\n"+summary);
      fetch("/api/reports/"+activeStageCode+"/summary").then(r=>r.json()).then(sum=>{
        activeBodyEl.innerHTML=renderStageRows(activeStageCode,sum.stages);
        wireStageButtons(activeBodyEl);
        activeBodyEl.style.maxHeight=activeBodyEl.scrollHeight+"px";
      });
    }).catch(err=>{ showAppAlert("Ошибка импорта: "+err.message); });
  });
}

function enableDragScrollY(el){
  if(!el) return;
  let isDown=false, startY=0, startScroll=0;
  el.addEventListener("mousedown",(e)=>{
    isDown=true;
    el.classList.add("dragging");
    startY=e.pageY;
    startScroll=el.scrollTop;
  });
  window.addEventListener("mouseup",()=>{ isDown=false; el.classList.remove("dragging"); });
  window.addEventListener("mousemove",(e)=>{
    if(!isDown) return;
    e.preventDefault();
    el.scrollTop=startScroll-(e.pageY-startY);
  });
  el.addEventListener("contextmenu",(e)=>{ e.preventDefault(); });
  el.addEventListener("wheel",(e)=>{
    e.preventDefault();
    el.scrollTop+=e.deltaY;
  },{passive:false});
}
function enableDragScroll(el){
  if(!el) return;
  let isDown=false, startX=0, startScroll=0;
  el.addEventListener("mousedown",(e)=>{
    isDown=true;
    el.classList.add("dragging");
    startX=e.pageX;
    startScroll=el.scrollLeft;
  });
  window.addEventListener("mouseup",()=>{ isDown=false; el.classList.remove("dragging"); });
  window.addEventListener("mousemove",(e)=>{
    if(!isDown) return;
    e.preventDefault();
    el.scrollLeft=startScroll-(e.pageX-startX);
  });
  el.addEventListener("wheel",(e)=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
      e.preventDefault();
      el.scrollLeft+=e.deltaY;
    }
  },{passive:false});
}
function fmtMoney(n){
  return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(n);
}
function fmtMoneyOrDash(n){
  return n?fmtMoney(n):"—";
}
const yearCenterLabelPlugin={
  id:"yearCenterLabel",
  afterDraw(chart){
    const ctx=chart.ctx;
    const xScale=chart.scales.x;
    const labels=chart.data.labels;
    const yearGroups={};
    labels.forEach((lab,idx)=>{
      const year=String(lab).slice(0,4);
      yearGroups[year]=yearGroups[year]||[];
      yearGroups[year].push(idx);
    });
    ctx.save();
    ctx.font="bold 10px Arial";
    ctx.fillStyle="#1f2937";
    ctx.textAlign="center";
    ctx.textBaseline="top";
    const y=xScale.bottom+4;
    Object.keys(yearGroups).forEach(year=>{
      const idxs=yearGroups[year];
      const xs=idxs.map(idx=>xScale.getPixelForTick(idx)).filter(v=>v!=null&&!isNaN(v));
      if(!xs.length) return;
      const avgX=xs.reduce((a,b)=>a+b,0)/xs.length;
      ctx.fillText(year,avgX,y);
    });
    ctx.restore();
  }
};
function fmtDate(d){
  if(!d) return "—";
  const dt=new Date(d);
  return String(dt.getDate()).padStart(2,"0")+"."+String(dt.getMonth()+1).padStart(2,"0")+"."+dt.getFullYear();
}
function buildGantt(stages){
  const panel=document.getElementById("calendarPanel");
  const items=stages||[];
  const withDates=items.filter(s=>s.start&&s.end);
  if(!withDates.length){ panel.innerHTML='<div class="empty" style="padding:20px;"><p>Нет данных</p></div>'; return; }
  const allDates=[];
  withDates.forEach(s=>{ allDates.push(new Date(s.start)); allDates.push(new Date(s.end)); if(s.forecastEnd) allDates.push(new Date(s.forecastEnd)); });
  const minD=new Date(Math.min(...allDates));
  const maxD=new Date(Math.max(...allDates));
  const bufStart=new Date(minD.getFullYear(),minD.getMonth()-1,1);
  const bufEnd=new Date(maxD.getFullYear(),maxD.getMonth()+2,1);
  const months=[];
  const cur=new Date(bufStart);
  while(cur<bufEnd){ months.push({y:cur.getFullYear(),m:cur.getMonth()+1}); cur.setMonth(cur.getMonth()+1); }
  const monthW=16;
  const totalW=months.length*monthW;
  const t0=bufStart.getTime(), t1=bufEnd.getTime();
  const pos=d=>(new Date(d).getTime()-t0)/(t1-t0)*totalW;
  const yearGroups=[];
  months.forEach(mo=>{ if(!yearGroups.length||yearGroups[yearGroups.length-1].year!==mo.y) yearGroups.push({year:mo.y,count:1}); else yearGroups[yearGroups.length-1].count++; });
  const yearBoundaries=[];
  months.forEach((mo,i)=>{
    if(mo.m===1&&i>0) yearBoundaries.push(i*monthW);
  });
  const yearRowHtml=yearGroups.map(g=>'<span class="gantt-year" style="width:'+(g.count*monthW)+'px;">'+g.year+'</span>').join("");
  const monthRowHtml=months.map(mo=>'<span class="gantt-month" style="width:'+monthW+'px;">'+String(mo.m).padStart(2,"0")+'</span>').join("");
  const yearLinesHtml=yearBoundaries.map(x=>'<div class="gantt-year-line" style="left:'+x+'px;"></div>').join("");
  function ganttDatesHtml(s){
    const deltaColor=s.deltaDays>0?"#e53e3e":(s.deltaDays<0?"#38a169":"#1f2937");
    const deltaText=s.deltaDays==null?"—":(s.deltaDays>0?"+"+s.deltaDays+" дн":(s.deltaDays<0?s.deltaDays+" дн":"в срок"));
    return '<div class="gantt-dates">'
      +'<div class="gantt-date-col"><span class="gantt-date-label">Начало</span><span class="gantt-date-value">'+fmtDate(s.start)+'</span></div>'
      +'<div class="gantt-date-col"><span class="gantt-date-label">Окончание</span><span class="gantt-date-value">'+fmtDate(s.end)+'</span></div>'
      +'<div class="gantt-date-col"><span class="gantt-date-label">Прогноз</span><span class="gantt-date-value">'+fmtDate(s.forecastEnd)+'</span></div>'
      +'<div class="gantt-date-col"><span class="gantt-date-label">Отклонение</span><span class="gantt-date-value" style="color:'+deltaColor+';">'+deltaText+'</span></div>'
      +'</div>';
  }
  const rowsHtml=items.map(s=>{
    if(!s.start||!s.end){
      return '<div class="gantt-row"><div class="gantt-row-label">'+s.name+'</div>'+ganttDatesHtml(s)+'<div class="gantt-track" style="width:'+totalW+'px;">'+yearLinesHtml+'</div></div>';
    }
    const left=pos(s.start);
    const endW=Math.max(2,pos(s.end)-left);
    let extraHtml="";
    if(s.forecastEnd && new Date(s.forecastEnd)>new Date(s.end)){
      const extraW=pos(s.forecastEnd)-pos(s.end);
      extraHtml='<div class="gantt-bar-extra" style="left:'+(left+endW)+'px;width:'+extraW+'px;"></div>';
    }
    return '<div class="gantt-row">'
      +'<div class="gantt-row-label">'+s.name+'</div>'
      +ganttDatesHtml(s)
      +'<div class="gantt-track" style="width:'+totalW+'px;">'
      +yearLinesHtml
      +'<div class="gantt-bar-base" style="left:'+left+'px;width:'+endW+'px;"></div>'
      +extraHtml
      +'</div>'
      +'</div>';
  }).join("");
  panel.innerHTML='<div class="gantt-scroll" id="ganttScroll" style="overflow-x:auto;flex:1;">'
    +'<div style="width:'+(totalW+140)+'px;">'
    +'<div class="gantt-scale-year" style="display:flex;"><div class="gantt-scale-spacer"></div>'+yearRowHtml+'</div>'
    +'<div class="gantt-scale-month" style="display:flex;margin-bottom:6px;"><div class="gantt-scale-spacer"></div>'+monthRowHtml+'</div>'
    +rowsHtml
    +'</div></div>';
}
function buildGanttRight(stages){
  const panel=document.getElementById("ganttRightPanel");
  const items=stages||[];
  const withDates=items.filter(s=>s.start&&s.end);
  if(!withDates.length){ panel.innerHTML='<div class="empty" style="padding:20px;"><p>Нет данных</p></div>'; return; }
  const allDates=[];
  withDates.forEach(s=>{ allDates.push(new Date(s.start)); allDates.push(new Date(s.end)); if(s.forecastEnd) allDates.push(new Date(s.forecastEnd)); });
  const minD=new Date(Math.min(...allDates));
  const maxD=new Date(Math.max(...allDates));
  const bufStart=new Date(minD.getFullYear(),minD.getMonth()-1,1);
  const bufEnd=new Date(maxD.getFullYear(),maxD.getMonth()+2,1);
  const months=[];
  const cur=new Date(bufStart);
  while(cur<bufEnd){ months.push({y:cur.getFullYear(),m:cur.getMonth()+1}); cur.setMonth(cur.getMonth()+1); }
  const monthW=20;
  const totalW=months.length*monthW;
  const t0=bufStart.getTime(), t1=bufEnd.getTime();
  const pos=d=>(new Date(d).getTime()-t0)/(t1-t0)*totalW;
  const yearGroups=[];
  months.forEach(mo=>{ if(!yearGroups.length||yearGroups[yearGroups.length-1].year!==mo.y) yearGroups.push({year:mo.y,count:1}); else yearGroups[yearGroups.length-1].count++; });
  const yearRowHtml=yearGroups.map(g=>'<span class="gantt-year" style="width:'+(g.count*monthW)+'px;">'+g.year+'</span>').join("");
  const monthRowHtml=months.map(mo=>'<span class="gantt-month" style="width:'+monthW+'px;">'+String(mo.m).padStart(2,"0")+'</span>').join("");
  const yearBoundaries=[];
  months.forEach((mo,i)=>{ if(mo.m===1&&i>0) yearBoundaries.push(i*monthW); });
  const yearLinesHtml=yearBoundaries.map(x=>'<div class="gantt-year-line" style="left:'+x+'px;"></div>').join("");
  const rowsHtml=items.map(s=>{
    if(!s.start||!s.end){
      return '<div class="gantt-row-r"><div class="gantt-track" style="width:'+totalW+'px;">'+yearLinesHtml+'</div></div>';
    }
    const left=pos(s.start);
    const endW=Math.max(2,pos(s.end)-left);
    const donePct=s.cost?Math.min(100,s.done/s.cost*100):0;
    const greenW=endW*donePct/100;
    const blueW=endW-greenW;
    let extraHtml="";
    if(s.forecastEnd && new Date(s.forecastEnd)>new Date(s.end)){
      const extraW=pos(s.forecastEnd)-pos(s.end);
      extraHtml='<div class="gantt-bar-extra" style="left:'+(left+endW)+'px;width:'+extraW+'px;background:#e53e3e;"></div>';
    }
    return '<div class="gantt-row-r"><div class="gantt-track" style="width:'+totalW+'px;">'+yearLinesHtml
      +'<div class="gantt-bar-base" style="left:'+left+'px;width:'+greenW+'px;background:#38a169;border-radius:4px 0 0 4px;"></div>'
      +'<div class="gantt-bar-base" style="left:'+(left+greenW)+'px;width:'+blueW+'px;background:#4a9fd8;border-radius:0;"></div>'
      +extraHtml+'</div></div>';
  }).join("");
  panel.innerHTML='<div class="gantt-scroll-r" id="ganttScrollR" style="overflow-x:auto;height:100%;">'
    +'<div style="width:'+totalW+'px;">'
    +'<div class="gantt-scale-year" style="display:flex;">'+yearRowHtml+'</div>'
    +'<div class="gantt-scale-month" style="display:flex;margin-bottom:6px;">'+monthRowHtml+'</div>'
    +rowsHtml
    +'</div></div>';
  enableDragScroll(document.getElementById("ganttScrollR"));
}
function buildPlanFactBar(label,planPct,factPct){
  const diff=factPct-planPct;
  const green=Math.min(100,factPct);
  const red=Math.max(0,planPct-factPct);
  const gray=Math.max(0,100-Math.max(planPct,factPct));
  const diffColor=diff<0?"#e53e3e":"#38a169";
  const diffText=diff>0?("+"+diff+"%"):(diff+"%");
  return '<div class="pf-row">'
    +'<div class="progress-label" style="margin-bottom:4px;">'+label+'</div>'
    +'<div class="pf-bar">'
    +(green>0?'<div class="pf-seg" style="width:'+green+'%;background:#4a9fd8;"></div>':'')
    +(red>0?'<div class="pf-seg" style="width:'+red+'%;background:#e53e3e;"></div>':'')
    +(gray>0?'<div class="pf-seg" style="width:'+gray+'%;background:#e5e9ef;"></div>':'')
    +'</div>'
    +'<div class="pf-bottom3"><span class="pf-plan">План: '+planPct+'%</span><span class="pf-diff" style="color:'+diffColor+';">'+diffText+'</span><span class="pf-fact">Факт: '+factPct+'%</span></div>'
    +'</div>';
}

  const dd=document.getElementById("dataDropdown");
  if(btn===null || dd===null) return;
  if(e.target===btn){ dd.style.display = dd.style.display==="block"?"none":"block"; e.stopPropagation(); return; }
  if(dd.style.display==="block" && dd.contains(e.target)===false){ dd.style.display="none"; }
});
const mainBtn=document.querySelector('.info-nav-btn[data-sub="main"]');
document.querySelectorAll(".info-nav-btn").forEach(btn=>{
  btn.addEventListener("click",function(e){
    if(this.dataset.sub==="main"){
      e.stopPropagation();
      const willOpen=!mainDropdown.classList.contains("open");
      mainDropdown.classList.toggle("open",willOpen);
      document.querySelectorAll(".info-nav-btn").forEach(b=>b.classList.remove("active"));
      if(willOpen) this.classList.add("active");
      return;
    }
    document.querySelectorAll(".info-nav-btn").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    mainDropdown.classList.remove("open");
    renderSub(this.dataset.sub);
  });
});
document.addEventListener("click",()=>{mainDropdown.classList.remove("open");mainBtn.classList.remove("active");});

"><div><span style="font-size:11px;color:#9ca3af;">Освоено: </span><span style="font-size:12px;color:#1f2937;font-weight:700;" id="prepExternalDone">—</span></div><div><span style="font-size:11px;color:#9ca3af;">Остаток: </span><span style="font-size:12px;color:#1f2937;font-weight:700;" id="prepExternalRemaining">—</span></div></div></div><div style="width:192px;height:90px;background:#eaf3fb;border-radius:0 8px 8px 0;box-shadow:6px 3px 10px rgba(74,159,216,0.18);padding:6px;box-sizing:border-box;position:relative;"><div id="prepProgressExternal" style="position:absolute;top:4px;left:8px;font-size:9px;font-weight:700;z-index:2;"></div><canvas id="prepChartExternal"></canvas></div></div></div></div><div style="display:flex;gap:16px;margin-top:18px;"><div style="flex:1;"><div id="prepObjectsHeader" style="font-size:12px;font-weight:700;color:#1f2937;margin-bottom:8px;cursor:pointer;">Объекты</div><div class="side-panel prep-objects-panel" style="height:240px;overflow-y:auto;padding:8px;scrollbar-width:none;-ms-overflow-style:none;" id="prepObjectsList"></div></div><div style="flex:2;"><div style="font-size:12px;font-weight:700;color:#1f2937;margin-bottom:8px;">Мобилизация — рабочая сила</div><div class="side-panel prep-mob-panel" style="height:240px;padding:12px;box-sizing:border-box;"><canvas id="prepMobChart"></canvas></div></div></div><div style="font-size:12px;font-weight:700;color:#1f2937;margin-top:10px;margin-bottom:8px;">Динамика по стоимости</div><div class="side-panel prep-dyn-panel" style="overflow:hidden;"><div id="prepDynamicsScroll" style="height:260px;overflow-x:auto;cursor:grab;scrollbar-width:none;-ms-overflow-style:none;"><div id="prepDynamicsInner" style="height:100%;"><canvas id="prepDynamicsChart"></canvas></div></div></div></div></div>';

    });
    const prepDynEndLabelPlugin={
      id:"prepDynEndLabels",
      afterDatasetsDraw(chart){
        const ctx=chart.ctx;
        const dsPlan=chart.data.datasets[0];
        const dsFact=chart.data.datasets[1];
        let todayIdx=-1;
        for(let i=dsFact.data.length-1;i>=0;i--){ if(dsFact.data[i]!==null&&dsFact.data[i]!==undefined){ todayIdx=i; break; } }
        function pointAt(dsIndex,data,idx){
          if(idx<0) return null;
          const meta=chart.getDatasetMeta(dsIndex);
          const pt=meta.data[idx];
          if(!pt) return null;
          return {x:pt.x,y:pt.y,value:data[idx]};
        }
        const planPt=pointAt(0,dsPlan.data,todayIdx);
        const factPt=pointAt(1,dsFact.data,todayIdx);
        function drawBadge(pt,color,offsetY){
          if(!pt) return;
          const text=pt.value+"%";
          ctx.font="bold 11px Arial";
          const w=ctx.measureText(text).width+10;
          const h=15;
          const x=pt.x-w/2, y=pt.y+offsetY-h/2;
          ctx.fillStyle=color;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(x,y,w,h,8) : ctx.rect(x,y,w,h);
          ctx.fill();
          ctx.fillStyle="#fff";
          ctx.textAlign="center";
          ctx.textBaseline="middle";
          ctx.fillText(text,pt.x,y+h/2);
        }
        if(planPt) drawBadge(planPt,"#4a9fd8",-14);
        if(factPt) drawBadge(factPt,"#38a169",14);
        if(planPt&&factPt){
          const diff=Math.abs(planPt.value-factPt.value);
          ctx.strokeStyle="#e53e3e";
          ctx.lineWidth=2;
          ctx.setLineDash([3,3]);
          ctx.beginPath();
          ctx.moveTo(planPt.x,planPt.y);
          ctx.lineTo(factPt.x,factPt.y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.font="bold 11px Arial";
          ctx.fillStyle="#e53e3e";
          ctx.textAlign="left";
          ctx.textBaseline="middle";
          ctx.fillText(diff+"%",Math.max(planPt.x,factPt.x)+8,(planPt.y+factPt.y)/2);
        }
      }
    };

    let prepObjectsData=[];
    window.prepObjectsNameMap={};
    window.prepActiveFilter=null;
    function renderPrepObjectsList(){
      const list_el=document.getElementById("prepObjectsList");
      let list=prepObjectsData;
      if(window.prepActiveFilter==="Внутренний") list=prepObjectsData.filter(o=>o.internalCost>0);
      if(window.prepActiveFilter==="Внешний") list=prepObjectsData.filter(o=>o.externalCost>0);
      const headHtml='';
      const groups={};
      list.forEach(o=>{
        const prefix=o.code.split("-")[0];
        groups[prefix]=groups[prefix]||{cost:0,done:0,planWeighted:0};
        groups[prefix].cost+=o.cost||0;
        groups[prefix].done+=o.done||0;
        groups[prefix].planWeighted+=(o.planPct||0)*(o.cost||0);
      });
      const parentAll=[].concat(PROJECTS.main.items,PROJECTS.aux.items);
      const extraNames={"OPS01":"Внепроектные объекты"};
      const rowsHtml=Object.keys(groups).map(prefix=>{
        const g=groups[prefix];
        const parent=parentAll.find(pp=>pp.code===prefix);
        const name=parent?parent.name:(extraNames[prefix]||prefix);
        const planPct=g.cost?Math.round(g.planWeighted/g.cost):0;
        const factPct=g.cost?Math.min(100,Math.round(g.done/g.cost*100)):0;
        const delta=factPct-planPct;
        const deltaColor=delta<0?"#e53e3e":(delta>0?"#38a169":"#1f2937");
        const deltaText=delta>0?("+"+delta+"%"):(delta+"%");
        return '<div class="st-row" style="cursor:pointer;display:flex;align-items:center;gap:1px;padding:3px 5px;" data-code="'+prefix+'" data-name="'+name+'">'
          +'<div class="st-col st-col-name" style="flex:1;font-size:10px;font-weight:600;color:#1f2937;padding:2px 4px;">'+name+'</div>'
          +'<div style="font-size:9px;font-weight:700;color:#fff;background:#4a9fd8;border-radius:20px;padding:2px 0;width:36px;text-align:center;box-sizing:border-box;">'+planPct+'%</div>'
          +'<div style="font-size:9px;font-weight:700;color:#fff;background:#38a169;border-radius:20px;padding:2px 0;width:36px;text-align:center;box-sizing:border-box;">'+factPct+'%</div>'
          +'<div style="font-size:9px;font-weight:700;color:'+deltaColor+';background:#fff;border:1px solid #eee;border-radius:20px;padding:2px 0;width:36px;text-align:center;box-sizing:border-box;">'+deltaText+'</div>'
          +'</div>';
      }).join("");
      list_el.innerHTML='<div class="st-table">'+headHtml+rowsHtml+'</div>';
      list_el.querySelectorAll(".st-row[data-code]").forEach(row=>{
        row.addEventListener("click",(e)=>{
          openPrepAllObjectsModal(e,row.dataset.code);
        });
      });
    }

    const prepEndLabelPlugin={
      id:"prepEndLabels",
      afterDatasetsDraw(chart){
        const ctx=chart.ctx;
        const dsPlan=chart.data.datasets[0];
        const dsFact=chart.data.datasets[1];
        let todayIdx=-1;
        for(let i=dsFact.data.length-1;i>=0;i--){ if(dsFact.data[i]!==null&&dsFact.data[i]!==undefined){ todayIdx=i; break; } }
        function pointAt(dsIndex,data,idx){
          if(idx<0) return null;
          const meta=chart.getDatasetMeta(dsIndex);
          const pt=meta.data[idx];
          if(!pt) return null;
          return {x:pt.x,y:pt.y,value:data[idx]};
        }
        const planPt=pointAt(0,dsPlan.data,todayIdx);
        const factPt=pointAt(1,dsFact.data,todayIdx);
        const area=chart.chartArea;
        function drawBadge(text,color,x,y){
          ctx.font="bold 13px Arial";
          const w=ctx.measureText(text).width+12;
          const h=18;
          const bx=x, by=y;
          ctx.fillStyle=color;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(bx,by,w,h,9) : ctx.rect(bx,by,w,h);
          ctx.fill();
          ctx.fillStyle="#fff";
          ctx.textAlign="center";
          ctx.textBaseline="middle";
          ctx.fillText(text,bx+w/2,by+h/2);
          return w;
        }
        let bx=area.left;
        if(planPt!=null){ bx+=drawBadge(planPt.value+"%","#4a9fd8",bx,area.top-19)+4; }
        if(factPt!=null){ bx+=drawBadge(factPt.value+"%","#38a169",bx,area.top-19)+4; }
        if(planPt!=null&&factPt!=null){
          const diff=factPt.value-planPt.value;
          const diffText=diff>0?("+"+diff+"%"):(diff+"%");
          const diffColor=diff<0?"#e53e3e":"#38a169";
          drawBadge(diffText,diffColor,bx,area.top-19);
        }
        if(chart.canvas.id==="prepChartInternal"&&factPt!=null){
          const ring=document.getElementById("prepInternalRing");
          const circ=2*Math.PI*36;
          ring.setAttribute("stroke-dasharray",(circ*factPt.value/100)+" "+circ);
          document.getElementById("prepInternalRingText").textContent=factPt.value+"%";
          if(planPt!=null){
            document.getElementById("prepInternalPlanRing").setAttribute("stroke-dasharray",(circ*planPt.value/100)+" "+circ);
            const planLabel=document.getElementById("prepInternalPlanText");
            planLabel.textContent=planPt.value+"%";
            const angleDeg=(planPt.value/100)*360-90;
            const angleRad=angleDeg*Math.PI/180;
            const rx=45+42*Math.cos(angleRad);
            const ry=45+42*Math.sin(angleRad);
            planLabel.style.left=rx+"px";
            planLabel.style.top=ry+"px";
            planLabel.style.transform="translate(-50%,-50%)";
          }
        }
      }

    function loadMiniPrepChart(canvasId,contractor,progressId){

        const ctx=document.getElementById(canvasId).getContext("2d");
        const g1="rgba(56,161,105,0.3)";
        const g2="rgba(74,159,216,0.3)";
        new Chart(ctx,{
          type:"line",
          data:{labels:sc.labels,datasets:[
            {label:"План",data:sc.planCum,borderColor:"#4a9fd8",backgroundColor:g2,borderWidth:2,pointRadius:0,tension:0.6,fill:true},
            {label:"Факт",data:sc.factCum,borderColor:"#38a169",backgroundColor:g1,borderWidth:2,pointRadius:0,tension:0.6,fill:true}
          ]},
          options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:20,bottom:0}},plugins:{legend:{display:false}},scales:{y:{display:false,min:0,max:100},x:{display:false}}}
        });
      });
    }
    loadMiniPrepChart("prepChartInternal","Внутренний","prepProgressInternal");
    loadMiniPrepChart("prepChartExternal","Внешний","prepProgressExternal");
    return;
  }
  body.innerHTML='<div class="empty"><h1>'+sub+'</h1><p>Раздел в разработке</p></div>';
}
init();
</script>
</body>
