<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДСОМК — Отчётность</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      display: flex;
      background: #f5f7fa;
    }

    /* Левая панель */
    .sidebar {
      width: 88px;
      background: linear-gradient(180deg, #2e3d54 0%, #1a2332 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      box-shadow: 2px 0 8px rgba(0,0,0,0.12);
      position: relative;
      z-index: 10;
    }

    .sidebar-user {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a6cf7, #2d5a96);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(10,30,61,0.25);
    }

    .sidebar-username {
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      text-align: center;
      max-width: 70px;
      word-break: break-word;
      font-weight: 600;
    }

    .sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
      width: 100%;
      padding: 0 6px;
    }

    .sidebar-bottom button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-align: center;
    }

    .sidebar-bottom button:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.3);
    }

    /* Основной контент */
    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .empty-state {
      text-align: center;
      color: #6b7280;
    }

    .empty-state h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #1f2937;
    }

    .empty-state p {
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-user">
      <span class="avatar" id="avatar">?</span>
      <div class="sidebar-username" id="username">...</div>
    </div>
    <div class="sidebar-bottom">
      <button id="changePassBtn">⚙ Настройки</button>
      <button class="sidebar-logout" id="logoutBtn">Выйти</button>
    </div>
  </aside>

  <main class="content">
    <div class="empty-state">
      <h1>Добро пожаловать</h1>
      <p>Выберите раздел или выйдите</p>
    </div>
  </main>

  <script>
    // Инициализация пользователя
    async function init() {
      const res = await fetch("/api/me");
      if (!res.ok) {
        window.location.href = "/login.html";
        return;
      }
      const user = await res.json();
      document.getElementById("username").textContent = user.name || user.login;
      document.getElementById("avatar").textContent = (user.name || user.login).charAt(0).toUpperCase();
    }

    // Выход
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login.html";
    });

    // Настройки (пока делает то же что выход)
    document.getElementById("changePassBtn").addEventListener("click", () => {
      alert("Настройки в разработке");
    });

    init();
  </script>
</body>
</html>
