<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДСОМК — Отчётность</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --dim: 0.75; }

    body {
      font-family: -apple-system, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      background: #0a1628;
    }

    .bg {
      position: fixed;
      inset: -10%;
      background: url("/assets/genplan-bg.jpg") center / cover no-repeat;
      animation: drift 60s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes drift {
      0%   { transform: scale(1.05) translate(0, 0); }
      50%  { transform: scale(1.15) translate(-2%, -1.5%); }
      100% { transform: scale(1.08) translate(2%, 1.5%); }
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #0a1e3d;
      opacity: var(--dim);
    }

    /* Шапка */
    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(10, 22, 40, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Логотип */
    .logo { display: flex; align-items: center; gap: 14px; color: #fff; }
    .logo-mark {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: #fff;
      color: #0a1628;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; letter-spacing: 0.5px;
    }
    .logo-text .title { font-size: 15px; font-weight: 700; letter-spacing: 0.4px; }
    .logo-text .subtitle { font-size: 11.5px; color: rgba(255,255,255,0.65); margin-top: 2px; }

    /* Навигация по разделам */
    .nav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: 28px; margin-right: auto; align-items: center; }
    .nav-btn {
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      background: none;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-drop { position: relative; display: inline-block; }
    .nav-drop-btn {
      background: none; border: 1px solid transparent; cursor: pointer;
      color: rgba(255,255,255,0.75); font-size: 14px; font-weight: 600;
      padding: 9px 16px; border-radius: 999px;
    }
    .nav-drop-btn:hover, .nav-drop.open .nav-drop-btn { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-drop-list {
      display: none; position: absolute; top: 100%; left: 0; z-index: 50;
      background: #0a1628; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 4px; min-width: 200px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .nav-drop-list .nav-btn { font-size: 12.5px; padding: 7px 12px; white-space: nowrap; }
    .nav-drop.open .nav-drop-list { display: block; }
    .nav-drop-list .nav-btn { display: block; width: 100%; text-align: left; }
    /* Персонал */
    .pers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .pers-card {
      background: #f3f4f6; border-radius: 14px; padding: 16px;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .pers-photo {
      width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0;
      background: #e5e7eb; color: #6b7280; font-size: 26px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; cursor: pointer;
    }
    .pers-photo img { width: 100%; height: 100%; object-fit: cover; }
    .pers-name { font-size: 14px; font-weight: 700; color: #0a1628; margin-bottom: 4px; }
    .pers-line { font-size: 11.5px; color: #374151; margin-top: 2px; }
    .pers-line span { color: #6b7280; }
    @media (max-width: 1100px) { .pers-grid { grid-template-columns: repeat(2, 1fr); } }
    .nav-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.22);
    }

    /* Кнопка пользователя */
    .user-menu { position: relative; }
    .user-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 18px;
      font-size: 15px; font-weight: 600; color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .user-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .user-btn .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: #fff; color: #0a1628;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }

    /* Выпадающее меню */
    .dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 210px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(10, 22, 40, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      display: none;
    }
    .dropdown.open { display: block; }
    .dropdown button {
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      padding: 11px 14px;
      font-size: 14.5px;
      color: #fff;
      background: none;
      border: none;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
    }
    .dropdown button:hover { background: rgba(255, 255, 255, 0.12); }
    .dropdown .danger { color: #ffb4b4; }

    /* Контент */
    .content {
      position: relative;
      z-index: 1;
      padding: 40px 28px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 17px;
    }

    /* Вкладки и списки проектов */
    .tab { display: none; }
    .tab.active { display: block; }
    .tab-title { color: #fff; font-size: 22px; margin-bottom: 20px; }
    .tab-empty { color: rgba(255,255,255,0.6); }

    .project-list { display: flex; flex-direction: column; gap: 10px; }
    .project-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .project-item:hover {
      background: rgba(255, 255, 255, 0.13);
      transform: translateX(4px);
    }
    .project-code {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 8px;
      background: #fff;
      color: #0a1628;
      font-size: 13px;
      font-weight: 700;
      font-family: "Consolas", monospace;
    }
    .project-name { color: #fff; font-size: 15px; }
    .project-panel {
      display: none;
      background: #fff;
      border-radius: 0 0 14px 14px;
      margin-top: -10px;
      padding: 16px 18px;
      overflow: hidden;
    }
    .project-panel.open { display: block; }
    .project-item.open {
      border-radius: 14px 14px 0 0;
    }

    .panel-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
    }
    .panel-btn {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #0a1628;
      background: #eef1f5;
      border: 1px solid #d5dae1;
      border-radius: 8px;
      cursor: pointer;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8px;
      background: #fff;
      color: #000;
    }
    .report-table th {
      background: #000;
      color: #fff;
      padding: 4px 6px;
      text-align: left;
      white-space: nowrap;
      border: 1px solid #333;
    }
    .report-table td {
      padding: 3px 6px;
      border: 1px solid #ddd;
      white-space: nowrap;
    }

    /* Модальное окно смены пароля */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 380px;
      margin: 16px;
      padding: 32px 30px;
      border-radius: 24px;
      background: rgba(10, 22, 40, 0.85);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .modal h2 { color: #fff; font-size: 19px; margin-bottom: 20px; text-align: center; }
    .modal input {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 14px;
      font-size: 15px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
    }
    .modal input:focus { outline: none; border-color: rgba(255,255,255,0.45); }
    .modal .row { display: flex; gap: 10px; margin-top: 6px; }
    .modal .row button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      border: none;
    }
    .btn-save { background: #fff; color: #0a1628; }
    .btn-cancel { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2) !important; }
    .modal .msg { font-size: 13.5px; text-align: center; margin-bottom: 10px; min-height: 17px; }
    .msg.ok { color: #a7f3d0; }
    .msg.err { color: #ffb4b4; }
  
    /* ===== ДАШБОРД ===== */
    .panel-dashboard { padding: 14px 14px 0; }
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .kpi-card {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .kpi-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .kpi-big { font-size: 20px; font-weight: 700; color: #0a1628; white-space: nowrap; margin-bottom: 8px; }
    .kpi-mid { font-size: 14px; font-weight: 600; color: #0a1628; }
    .kpi-stages { margin-top: 8px; border-top: 1px solid #e5e7eb; padding-top: 6px; }
    .kpi-stage-row { display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; color: #374151; padding: 2px 0; white-space: nowrap; }
    .kpi-stage-row span:first-child { color: #6b7280; }
    .kpi-flex { display: flex; gap: 18px; }
    .kpi-dates { font-size: 15px; font-weight: 700; color: #0a1628; white-space: nowrap; margin-bottom: 8px; }
    .kpi-wide { grid-column: span 2; }
    .kpi-comment { font-size: 12.5px; color: #374151; line-height: 1.5; }
    .kpi-comment-edit {
      width: 100%;
      min-height: 60px;
      border: none;
      padding: 0;
      font-size: 12.5px;
      color: #374151;
      line-height: 1.5;
      font-family: inherit;
      resize: none;
      background: transparent;
      outline: none;
    }
    .chart-card {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    .chart-title { font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .chart-wrap { position: relative; width: 100%; height: 280px; }
    .stage-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .stage-card {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .stage-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .stage-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      padding: 4px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .stage-table td { padding: 5px 0; color: #374151; border-top: 1px solid #e5e7eb; }
    .stage-table .st-date { text-align: right; }
    .stage-table .st-delta { text-align: right; font-weight: 600; }
    .stage-table .st-num { text-align: right; }
    .st-bad { color: #b91c1c; }
    .st-good { color: #0a1e3d; }
    .st-empty { color: #9ca3af; text-align: center; padding: 14px 0 !important; }
    .gantt { position: relative; padding: 6px 0; }
    .gantt-row { display: flex; align-items: center; margin-bottom: 8px; }
    .gantt-label { width: 140px; flex-shrink: 0; font-size: 11.5px; color: #374151; }
    .gantt-track { position: relative; flex: 1; height: 22px; background: #e5e7eb; border-radius: 5px; overflow: hidden; }
    .gantt-bar { position: absolute; top: 0; height: 100%; background: #7da7d9; border-radius: 5px; overflow: hidden; }
    .gantt-done { position: absolute; left: 0; top: 0; height: 100%; background: #0a1e3d; }
    .gantt-dates { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #fff; white-space: nowrap; z-index: 1; }
    .gantt-now { position: absolute; top: 0; bottom: 0; width: 2px; background: #b91c1c; }
    .gantt-scale { display: flex; flex: 1; }
    .gantt-year { text-align: center; font-size: 11px; font-weight: 600; color: #374151; border-left: 1px solid #d1d5db; }
    .gantt-month { text-align: center; font-size: 9px; color: #6b7280; overflow: hidden; }
    .prep-kpi { grid-template-columns: repeat(4, 1fr); }
    .prep-red { background: #fde8e8; }
    .prep-red .kpi-label, .prep-red .kpi-big { color: #b91c1c; }
    .prep-bar { height: 6px; background: #e5e7eb; border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .prep-bar > div { height: 100%; background: #0a1e3d; }
    .prep-loading { color: #9ca3af; font-size: 13px; padding: 20px; }
    #prep-groups { margin-top: 16px; }
    .prep-group { background: #f3f4f6; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .prep-group-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; cursor: pointer; }
    .prep-group-title { font-size: 14px; font-weight: 700; color: #0a1628; display: flex; align-items: center; gap: 10px; }
    .prep-group-title small { font-size: 11px; color: #6b7280; font-weight: 400; }
    .prep-verdict { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 6px; }
    .prep-verdict.bad { background: #fde8e8; color: #b91c1c; }
    .prep-verdict.good { background: #e8eef8; color: #0a1e3d; }
    .prep-group-stats { display: flex; gap: 14px; font-size: 11.5px; color: #6b7280; align-items: center; }
    .prep-group-stats b { color: #0a1628; }
    .prep-group-stats .red { color: #b91c1c; }
    .prep-minibar { width: 90px; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .prep-minibar > div { height: 100%; background: #0a1e3d; }
    .prep-group-body { display: none; margin-top: 10px; }
    .prep-group.open .prep-group-body { display: block; }
    .prep-gantt { background: #fff; border-radius: 8px; padding: 10px 12px; }
    .pg-scale { display: flex; font-size: 9.5px; color: #6b7280; margin-bottom: 5px; }
    .pg-scale span:first-child { width: 180px; flex: none; }
    .pg-scale span { flex: 1; }
    .pg-body { position: relative; }
    .pg-now { position: absolute; top: 0; bottom: 0; width: 1.5px; background: #b91c1c; z-index: 2; }
    .pg-row { display: flex; align-items: center; margin-bottom: 3px; }
    .pg-name { width: 180px; flex: none; font-size: 11px; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
    .pg-name.late { color: #b91c1c; font-weight: 600; }
    .pg-track { flex: 1; position: relative; height: 13px; }
    .pg-bar { position: absolute; height: 100%; border-radius: 3px; background: #7da7d9; overflow: hidden; }
    .pg-bar.plan-only { background: #e5e7eb; border: 1px dashed #9ca3af; }
    .pg-fill { height: 100%; background: #0a1e3d; }
    .pg-fill.late { background: #b91c1c; }
    .pg-legend { display: flex; gap: 14px; font-size: 9.5px; color: #6b7280; margin-top: 6px; }
    .pg-sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; }
    .modal-wide { max-width: 460px; }
    .users-add-title { font-size: 13px; margin: 14px 0 6px; }
    .user-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #e5e7eb; }
    .user-name { flex: 1; font-size: 13px; display: flex; flex-direction: column; color: #fff; }
    .user-name small { color: #9ca3af; font-size: 11px; }
    .user-role { font-size: 12px; padding: 3px 6px; }
    .user-del { background: #fde8e8; color: #b91c1c; border: none; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
    .kpi-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .kpi-badge.bad { background: #fde8e8; color: #b91c1c; }
    .kpi-badge.good { background: #e8eef8; color: #0a1e3d; }

  </style>
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="logo">
      <div class="logo-mark">ДС</div>
      <div class="logo-text">
        <div class="title">ДСОМК</div>
        <div class="subtitle">Дирекция Строительства Объектов Металлургического Комплекса</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-drop">
        <button class="nav-drop-btn" id="projectsMenuBtn">Проекты ▾</button>
        <div class="nav-drop-list" id="projectsMenuList">
          <button class="nav-btn active" data-tab="schedule">Общий график</button>
          <button class="nav-btn" data-tab="prep">Подготовительные работы</button>
          <button class="nav-btn" data-tab="main">Основные проекты</button>
          <button class="nav-btn" data-tab="aux">Вспомогательные объекты</button>
        </div>
      </div>
      <button class="nav-btn" data-tab="personnel">Персонал</button>
    </nav>

    <div class="user-menu">
      <button class="user-btn" id="userBtn">
        <span class="avatar" id="avatar">?</span>
        <span id="username">...</span>
      </button>
      <div class="dropdown" id="dropdown">
        <button id="usersBtn" style="display:none">👥 Пользователи</button>
        <button id="changePassBtn">👤 Аккаунт</button>
        <button class="danger" id="logoutBtn">🚪 Выйти</button>
      </div>
    </div>
  </header>

  <main class="content">
    <div id="tab-schedule" class="tab active">
      <h2 class="tab-title">Общий график</h2>
      <p class="tab-empty">Раздел в разработке — здесь будет общий график работ.</p>
    </div>
    <div id="tab-prep" class="tab"></div>
    <div id="tab-main" class="tab"></div>
    <div id="tab-aux" class="tab"></div>
    <div id="tab-personnel" class="tab">
      <h2 class="tab-title">Персонал</h2>
      <div class="pers-grid" id="pers-grid"><div class="prep-loading">Загрузка...</div></div>
    </div>
  </main>

  <!-- Окно смены пароля -->
  <div class="modal-overlay" id="passModal">
    <div class="modal">
      <h2>Аккаунт</h2>
      <div class="msg" id="passMsg"></div>
      <input type="text" id="accDept" placeholder="Отдел">
      <input type="text" id="accPos" placeholder="Должность">
      <input type="text" id="accInt" placeholder="Внутренний номер">
      <input type="text" id="accMob" placeholder="Мобильный номер">
      <input type="text" id="accEmail" placeholder="Почта">
      <div class="row">
        <button class="btn-save" id="accSave">Сохранить данные</button>
      </div>
      <h2 style="margin-top:14px;">Смена пароля</h2>
      <input type="password" id="oldPass" placeholder="Старый пароль">
      <input type="password" id="newPass" placeholder="Новый пароль (мин. 4 символа)">
      <div class="row">
        <button class="btn-cancel" id="passCancel">Закрыть</button>
        <button class="btn-save" id="passSave">Сменить пароль</button>
      </div>
    </div>
  </div>

  <!-- Окно пользователей -->
  <div class="modal-overlay" id="usersModal">
    <div class="modal modal-wide">
      <h2>Пользователи</h2>
      <div class="msg" id="usersMsg"></div>
      <div id="usersList"></div>
      <h3 class="users-add-title">Добавить пользователя</h3>
      <input type="text" id="newUserName" placeholder="Имя и фамилия">
      <input type="text" id="newUserLogin" placeholder="Логин">
      <input type="password" id="newUserPass" placeholder="Пароль (мин. 4 символа)">
      <select id="newUserRole">
        <option value="user">Пользователь</option>
        <option value="admin">Администратор</option>
      </select>
      <div class="row">
        <button class="btn-cancel" id="usersClose">Закрыть</button>
        <button class="btn-save" id="userCreate">Добавить</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="projects.js"></script>
  <script>

    // Имя пользователя в шапке
    fetch("/api/me").then(r => {
      if (!r.ok) { window.location.href = "/login.html"; return; }
      return r.json();
    }).then(d => {
      if (!d) return;
      document.getElementById("username").textContent = d.name || d.username;
    window.userRole = d.role;
    applyRole();
      document.getElementById("avatar").textContent = d.username[0].toUpperCase();
    });

    // Открытие/закрытие меню
    const dropdown = document.getElementById("dropdown");
    document.getElementById("userBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      dropdown.classList.toggle("open");
    });
    document.addEventListener("click", () => dropdown.classList.remove("open"));

    // ===== ПОЛЬЗОВАТЕЛИ =====
    const usersModal = document.getElementById("usersModal");

    async function loadUsers() {
      const res = await fetch("/api/users");
      const users = await res.json();
      document.getElementById("usersList").innerHTML = users.map(u => `
        <div class="user-row">
          <span class="user-name">${u.name || u.username}<small>${u.username}</small></span>
          <select class="user-role" data-id="${u._id}">
            <option value="user" ${u.role !== "admin" ? "selected" : ""}>Пользователь</option>
            <option value="admin" ${u.role === "admin" ? "selected" : ""}>Администратор</option>
          </select>
          <button class="user-del" data-id="${u._id}">Удалить</button>
        </div>`).join("");
      document.querySelectorAll(".user-role").forEach(sel => {
        sel.addEventListener("change", async () => {
          const res = await fetch("/api/users/" + sel.dataset.id + "/role", {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ role: sel.value })
          });
          const d = await res.json();
          document.getElementById("usersMsg").textContent = d.message;
          if (!res.ok) loadUsers();
        });
      });
      document.querySelectorAll(".user-del").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Удалить пользователя?")) return;
          const res = await fetch("/api/users/" + btn.dataset.id, { method: "DELETE" });
          const d = await res.json();
          document.getElementById("usersMsg").textContent = d.message;
          loadUsers();
        });
      });
    }

    document.getElementById("usersBtn").addEventListener("click", () => {
      document.getElementById("usersMsg").textContent = "";
      usersModal.classList.add("open");
      loadUsers();
    });
    document.getElementById("usersClose").addEventListener("click", () => usersModal.classList.remove("open"));

    document.getElementById("userCreate").addEventListener("click", async () => {
      const res = await fetch("/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("newUserName").value.trim(),
          username: document.getElementById("newUserLogin").value.trim(),
          password: document.getElementById("newUserPass").value,
          role: document.getElementById("newUserRole").value
        })
      });
      const d = await res.json();
      document.getElementById("usersMsg").textContent = d.message;
      if (res.ok) {
        ["newUserName", "newUserLogin", "newUserPass"].forEach(id => document.getElementById(id).value = "");
        loadUsers();
      }
    });

    // Выход
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login.html";
    });

    // Смена пароля
    const passModal = document.getElementById("passModal");
    const passMsg = document.getElementById("passMsg");
    let myPersId = null;
    document.getElementById("changePassBtn").addEventListener("click", async () => {
      passModal.classList.add("open");
      const me = await (await fetch("/api/me")).json();
      const users = await (await fetch("/api/personnel")).json();
      const u = users.find(x => x.username === me.username);
      if (!u) return;
      myPersId = u._id;
      document.getElementById("accDept").value = u.department || "";
      document.getElementById("accPos").value = u.position || "";
      document.getElementById("accInt").value = u.internalPhone || "";
      document.getElementById("accMob").value = u.mobilePhone || "";
      document.getElementById("accEmail").value = u.email || "";
    });
    document.getElementById("accSave").addEventListener("click", async () => {
      const res = await fetch("/api/personnel/" + myPersId, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          department: document.getElementById("accDept").value,
          position: document.getElementById("accPos").value,
          internalPhone: document.getElementById("accInt").value,
          mobilePhone: document.getElementById("accMob").value,
          email: document.getElementById("accEmail").value,
        }),
      });
      passMsg.textContent = res.ok ? "Данные сохранены" : "Ошибка сохранения";
      passMsg.className = "msg " + (res.ok ? "ok" : "err");
    });
    document.getElementById("passCancel").addEventListener("click", () => {
      passModal.classList.remove("open");
      passMsg.textContent = "";
    });
    document.getElementById("passSave").addEventListener("click", async () => {
      const res = await fetch("/api/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          oldPassword: document.getElementById("oldPass").value,
          newPassword: document.getElementById("newPass").value,
        }),
      });
      const d = await res.json();
      passMsg.textContent = d.message;
      passMsg.className = "msg " + (res.ok ? "ok" : "err");
      if (res.ok) setTimeout(() => passModal.classList.remove("open"), 1200);
    });

    // Отрисовка списков проектов
    function renderTab(key) {
      const container = document.getElementById("tab-" + key);
      if (!container || container.dataset.rendered) return;
      const section = PROJECTS[key];
      let html = `<h2 class="tab-title">${section.title}</h2><div class="project-list">`;
      section.items.forEach(p => {
        html += `<div class="project-item" data-code="${p.code}">
                   <span class="project-code">${p.code}</span>
                   <span class="project-name">${p.name}</span>
                 </div>
                 <div class="project-panel" id="panel-${p.code}">
                  <div class="panel-dashboard" id="dash-${p.code}"></div>
                  <div class="panel-toolbar">
                     <button class="panel-btn btn-import" data-code="${p.code}">📥 импорт</button>
                     <button class="panel-btn btn-export" data-code="${p.code}" data-name="${p.name}">📤 экспорт</button>
                     <input type="file" class="file-import" data-code="${p.code}" accept=".xlsx" style="display:none">
                   </div>
                   
                 </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
      container.dataset.rendered = "1";
    }
    ["main", "aux"].forEach(renderTab);
    renderPrepTab();

    async function renderPrepTab() {
      const container = document.getElementById("tab-prep");
      if (!container || container.dataset.rendered) return;
      container.dataset.rendered = "1";
      container.innerHTML = `<h2 class="tab-title">Подготовительные работы</h2>
        <div class="prep-board" id="prep-board"><div class="prep-loading">Загрузка данных...</div></div>`;

      const prepItems = PROJECTS.prep.items;
      const reports = {};
      await Promise.all(prepItems.map(async p => {
        const res = await fetch("/api/reports/" + p.code);
        reports[p.code] = (await res.json()).rows || [];
      }));

      // Дата старта СМР родительских проектов (мин. planStart строк этапа СМР/строительство)
      const parentCodes = [...PROJECTS.main.items, ...PROJECTS.aux.items].map(p => p.code);
      const smrStart = {};
      await Promise.all(parentCodes.map(async code => {
        const res = await fetch("/api/reports/" + code);
        const rows = (await res.json()).rows || [];
        const dates = rows
          .filter(r => /смр|строительн/i.test(r.stage || ""))
          .map(r => r.planStart).filter(Boolean).sort();
        smrStart[code] = dates[0] || null;
      }));

      // Прогноз окончания объекта: макс. из forecastEnd (или planEnd) его строк
      function objFinish(rows) {
        const dates = rows.map(r => r.forecastEnd || r.planEnd).filter(Boolean).sort();
        return dates.length ? dates[dates.length - 1] : null;
      }
      function daysBetween(a, b) {
        return Math.round((new Date(a) - new Date(b)) / 86400000);
      }

      // Мини-Гант группы
      function prepGantt(items) {
        // Диапазон дат по всем объектам группы
        let min = null, max = null;
        items.forEach(p => {
          reports[p.code].forEach(r => {
            [r.planStart, r.planEnd, r.factStart, r.factEnd, r.forecastEnd].filter(Boolean).forEach(d => {
              if (!min || d < min) min = d;
              if (!max || d > max) max = d;
            });
          });
        });
        if (!min || !max || min === max) return `<div class="prep-loading">Нет данных для графика</div>`;
        const t0 = new Date(min).getTime(), t1 = new Date(max).getTime();
        const pos = d => Math.max(0, Math.min(100, (new Date(d).getTime() - t0) / (t1 - t0) * 100));

        // Шкала месяцев (5-7 меток)
        const months = [];
        const mCount = Math.max(2, Math.round((t1 - t0) / 2592000000));
        const step = Math.max(1, Math.ceil(mCount / 6));
        const cur = new Date(min); cur.setDate(1);
        while (cur.getTime() <= t1) {
          months.push(String(cur.getMonth() + 1).padStart(2, "0") + "." + String(cur.getFullYear()).slice(2));
          cur.setMonth(cur.getMonth() + step);
        }
        const today = new Date().toISOString().slice(0, 10);
        const nowPos = pos(today);

        let rowsHtml = "";
        items.forEach(p => {
          const rows = reports[p.code];
          const starts = rows.map(r => r.planStart).filter(Boolean).sort();
          const ends = rows.map(r => r.forecastEnd || r.planEnd).filter(Boolean).sort();
          if (!starts.length) return;
          const s = starts[0], e = ends.length ? ends[ends.length - 1] : today;
          const pct = objPct(rows);
          const started = rows.some(r => r.factStart);
          const late = pct < 100 && e < today || (smrStart[p.code.split("-")[0]] && e > smrStart[p.code.split("-")[0]]);
          const left = pos(s), width = Math.max(1.5, pos(e) - pos(s));
          let bar;
          if (!started && pct === 0) bar = `<div class="pg-bar plan-only" style="left:${left}%;width:${width}%"></div>`;
          else bar = `<div class="pg-bar" style="left:${left}%;width:${width}%"><div class="pg-fill${late ? " late" : ""}" style="width:${pct}%"></div></div>`;
          rowsHtml += `<div class="pg-row"><span class="pg-name${late ? " late" : ""}">${p.code} ${p.name}</span><div class="pg-track">${bar}</div></div>`;
        });
        if (!rowsHtml) return `<div class="prep-loading">Нет данных для графика</div>`;

        return `<div class="prep-gantt">
          <div class="pg-scale"><span></span>${months.map(m => `<span>${m}</span>`).join("")}</div>
          <div class="pg-body">
            <div class="pg-now" style="left:calc(180px + (100% - 180px) * ${(nowPos / 100).toFixed(3)})"></div>
            ${rowsHtml}
          </div>
          <div class="pg-legend">
            <span><span class="pg-sw" style="background:#0a1e3d"></span> выполнено</span>
            <span><span class="pg-sw" style="background:#7da7d9"></span> план</span>
            <span><span class="pg-sw" style="background:#b91c1c"></span> отставание</span>
            <span><span class="pg-sw" style="background:#e5e7eb;border:1px dashed #9ca3af"></span> не начато</span>
            <span style="color:#b91c1c">│ сегодня</span>
          </div>
        </div>`;
      }

      let done = 0, inWork = 0, notStarted = 0, totalCost = 0, doneCost = 0;
      prepItems.forEach(p => {
        const rows = reports[p.code];
        totalCost += rows.reduce((s, r) => s + (r.cost || 0), 0);
        doneCost += rows.reduce((s, r) => s + (r.done || 0), 0);
        const pct = objPct(rows);
        if (!rows.length || pct === 0) notStarted++;
        else if (pct >= 100) done++;
        else inWork++;
      });
      const readiness = totalCost ? Math.round(doneCost / totalCost * 100) : 0;

      document.getElementById("prep-board").innerHTML = `
        <div class="kpi-row prep-kpi">
          <div class="kpi-card">
            <div class="kpi-label">Всего объектов</div>
            <div class="kpi-big">${prepItems.length}</div>
            <div class="kpi-label">завершено ${done} · в работе ${inWork} · не начато ${notStarted}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Готовность подготовки</div>
            <div class="kpi-big">${readiness}%</div>
            <div class="prep-bar"><div style="width:${readiness}%"></div></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Стоимость / освоено</div>
            <div class="kpi-mid">${money(totalCost).replace(" €", "")}</div>
            <div class="kpi-mid">${money(doneCost).replace(" €", "")} (${readiness}%)</div>
          </div>
          <div class="kpi-card prep-red">
            <div class="kpi-label">Блокируют основные</div>
            <div class="kpi-big">—</div>
            <div class="kpi-label">расчёт добавим следующим шагом</div>
          </div>
        </div>
        <div class="panel-toolbar" style="margin-top:12px;">
          <button class="panel-btn btn-import" id="prepImportBtn">📥 импорт</button>
          <button class="panel-btn btn-export" id="prepExportBtn">📤 экспорт</button>
          <input type="file" id="prepImportFile" accept=".xlsx" style="display:none">
        </div>
        <div id="prep-groups"></div>`;

      // Группы по родительским проектам (родитель = часть кода до дефиса)
      const parents = {};
      [...PROJECTS.main.items, ...PROJECTS.aux.items].forEach(p => { parents[p.code] = p.name; });
      const groups = {};
      prepItems.forEach(p => {
        const par = p.code.split("-")[0];
        (groups[par] = groups[par] || []).push(p);
      });

      let ghtml = "";
      Object.keys(groups).forEach(par => {
        const items = groups[par];
        let gDone = 0, gWork = 0, gCost = 0, gDoneCost = 0;
        items.forEach(p => {
          const rows = reports[p.code];
          gCost += rows.reduce((s, r) => s + (r.cost || 0), 0);
          gDoneCost += rows.reduce((s, r) => s + (r.done || 0), 0);
          const pct = objPct(rows);
          if (pct >= 100 && rows.length) gDone++;
          else if (pct > 0) gWork++;
        });
        const gPct = gCost ? Math.min(100, Math.round(gDoneCost / gCost * 100)) : 0;
        const parName = parents[par] || "Общеплощадочные объекты";

        // Вердикт: худший прогноз объектов группы vs старт СМР родителя
        let verdict = "";
        const start = smrStart[par];
        if (start) {
          let worstDays = null;
          items.forEach(p => {
            const fin = objFinish(reports[p.code]);
            if (!fin) return;
            const d = daysBetween(fin, start);
            if (worstDays === null || d > worstDays) worstDays = d;
          });
          if (worstDays === null) verdict = "";
          else if (worstDays > 0) verdict = `<span class="prep-verdict bad">КРИТИЧНО — срыв старта СМР на ${worstDays} дн</span>`;
          else if (worstDays > -14) verdict = `<span class="prep-verdict bad">ЕСТЬ РИСКИ — запас ${-worstDays} дн</span>`;
          else verdict = `<span class="prep-verdict good">УСПЕВАЕМ</span>`;
        }
        ghtml += `<div class="prep-group" data-par="${par}">
          <div class="prep-group-head">
            <div class="prep-group-title">▶ ${par} — ${parName} <small>· ${items.length} объектов</small> ${verdict}</div>
            <div class="prep-group-stats">
              <span>готово <b>${gDone}</b></span>
              <span>в работе <b>${gWork}</b></span>
              <span>площадка <span class="prep-minibar"><div style="width:${gPct}%"></div></span> <b>${gPct}%</b></span>
            </div>
          </div>
          <div class="prep-group-body">
            ${prepGantt(items)}
          </div>
        </div>`;
      });
      document.getElementById("prep-groups").innerHTML = ghtml;

      // Импорт единого файла подготовительных работ (только admin)
      const prepCodes = new Set(prepItems.map(p => p.code));
      async function importPrepFile(file) {
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(await file.arrayBuffer());
        const ws = wb.worksheets[0];
        const byCode = {};
        let skipped = 0;
        ws.eachRow((row, n) => {
          if (n === 1) return;
          const v = i => { const x = row.getCell(i).value; return x && x.result !== undefined ? x.result : x; };
          const code = String(v(1) || "").trim();
          if (!prepCodes.has(code)) { if (code) skipped++; return; }
          const dt = i => {
            const x = v(i);
            if (x instanceof Date) return x.toISOString().slice(0, 10);
            if (typeof x === "string" && /^\d{4}-\d{2}-\d{2}/.test(x)) return x.slice(0, 10);
            return null;
          };
          const num = i => {
            const x = v(i);
            if (typeof x === "number") return x;
            return Number(String(x || "").replace(/\s/g, "").replace(",", ".")) || 0;
          };
          (byCode[code] = byCode[code] || []).push({
            stage: String(v(3) || ""),
            item: String(v(4) || ""),
            planStart: dt(5), planEnd: dt(6),
            factStart: dt(7), factEnd: dt(8),
            cost: num(9), done: num(10),
            status: String(v(11) || ""),
            forecastEnd: dt(12),
            mhPlan: num(13), mhFact: num(14),
            eqPlan: num(15), eqFact: num(16),
          });
        });
        const codes = Object.keys(byCode);
        if (!codes.length) { alert("В файле не найдено ни одного объекта из списка"); return; }
        let ok = 0;
        for (const code of codes) {
          const res = await fetch("/api/reports/" + code, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rows: byCode[code] })
          });
          if (res.ok) ok++;
        }
        alert(`Обновлено объектов: ${ok} из ${codes.length}` + (skipped ? `, строк пропущено (нет в списке): ${skipped}` : ""));
        location.reload();
      }
      document.getElementById("prepImportBtn").addEventListener("click", () =>
        document.getElementById("prepImportFile").click());
      document.getElementById("prepImportFile").addEventListener("change", e => {
        if (e.target.files[0]) importPrepFile(e.target.files[0]);
        e.target.value = "";
      });
      document.getElementById("prepExportBtn").addEventListener("click", () =>
        alert("Экспорт сделаем следующим шагом"));

      document.querySelectorAll(".prep-group-head").forEach(h => {
        h.addEventListener("click", () => {
          const g = h.parentElement;
          g.classList.toggle("open");
          h.querySelector(".prep-group-title").innerHTML =
            h.querySelector(".prep-group-title").innerHTML.replace(g.classList.contains("open") ? "▶" : "▼", g.classList.contains("open") ? "▼" : "▶");
        });
      });
    }

    function objPct(rows) {
      if (rows.length && rows.every(r => /заверш/i.test(r.status || ""))) return 100;
      const c = rows.reduce((s, r) => s + (r.cost || 0), 0);
      const d = rows.reduce((s, r) => s + (r.done || 0), 0);
      return c ? Math.min(100, Math.round(d / c * 100)) : 0;
    }

    // Персонал
    async function renderPersonnel() {
      const grid = document.getElementById("pers-grid");
      if (!grid || grid.dataset.rendered) return;
      grid.dataset.rendered = "1";
      const res = await fetch("/api/personnel");
      if (!res.ok) { grid.innerHTML = "Ошибка загрузки"; return; }
      const users = await res.json();
      grid.innerHTML = users.map(u => {
        const initials = (u.name || u.username || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
        const photo = u.avatar
          ? `<img src="${u.avatar}" alt="">`
          : initials;
        return `<div class="pers-card" data-id="${u._id}">
          <div class="pers-photo" data-id="${u._id}" title="Нажмите, чтобы загрузить фото">${photo}</div>
          <div>
            <div class="pers-name">${u.name || u.username}</div>
            <div class="pers-line"><span>Отдел:</span> ${u.department || "—"}</div>
            <div class="pers-line"><span>Должность:</span> ${u.position || "—"}</div>
            <div class="pers-line"><span>Внутренний номер:</span> ${u.internalPhone || "—"}</div>
            <div class="pers-line"><span>Мобильный номер:</span> ${u.mobilePhone || "—"}</div>
            <div class="pers-line"><span>Почта:</span> ${u.email || "—"}</div>
          </div>
        </div>`;
      }).join("");

      grid.querySelectorAll(".pers-photo").forEach(ph => {
        ph.addEventListener("click", () => {
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/*";
          input.onchange = () => {
            const file = input.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = async () => {
              const canvas = document.createElement("canvas");
              canvas.width = 200; canvas.height = 200;
              const s = Math.min(img.width, img.height);
              canvas.getContext("2d").drawImage(img,
                (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 200, 200);
              const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
              const res = await fetch("/api/personnel/" + ph.dataset.id, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ avatar: dataUrl }),
              });
              if (res.ok) ph.innerHTML = `<img src="${dataUrl}" alt="">`;
              else alert("Нет прав: можно менять только своё фото");
            };
            img.src = URL.createObjectURL(file);
          };
          input.click();
        });
      });
    }
    renderPersonnel();

    // Выпадающее меню "Проекты"
    const projDrop = document.querySelector(".nav-drop");
    document.getElementById("projectsMenuBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      projDrop.classList.toggle("open");
    });
    document.addEventListener("click", () => projDrop.classList.remove("open"));

    // Переключение вкладок
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    // Экспорт таблицы в Excel
    const REPORT_COLUMNS = [
      "Код", "Проект", "Этап", "Объект", "Дисциплина",
      "План начало", "План окончание", "Факт начало", "Факт окончание",
      "Стоимость", "Выполнено", "Статус"
    ];

    async function exportProject(code, name) {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet("Отчёт");

      ws.addTable({
        name: "Report_" + code.replace(/[^a-zA-Z0-9]/g, ""),
        ref: "A1",
        headerRow: true,
        style: { showRowStripes: false },
        columns: REPORT_COLUMNS.map(c => ({ name: c })),
        rows: [ REPORT_COLUMNS.map(() => "") ],
      });

      ws.columns.forEach(col => { col.width = 14; });

      ws.getRow(1).eachCell(cell => {
        cell.font = { bold: true, color: { argb: "FFFFFFFF" }, size: 8 };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF000000" } };
      });

      ws.eachRow(row => {
        row.eachCell(cell => {
          cell.font = cell.font && cell.font.bold ? cell.font : { size: 8 };
          cell.border = {
            top: { style: "thin", color: { argb: "FFCCCCCC" } },
            left: { style: "thin", color: { argb: "FFCCCCCC" } },
            bottom: { style: "thin", color: { argb: "FFCCCCCC" } },
            right: { style: "thin", color: { argb: "FFCCCCCC" } },
          };
        });
      });

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Отчёт_${code}.xlsx`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function applyRole() {
      if (window.userRole === "admin") {
        document.getElementById("usersBtn").style.display = "";
        return;
      }
      document.querySelectorAll(".btn-import, .btn-export").forEach(b => b.style.display = "none");
      document.querySelectorAll(".kpi-comment-edit").forEach(t => t.setAttribute("readonly", "readonly"));
    }

    document.querySelectorAll(".btn-export").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        exportProject(btn.dataset.code, btn.dataset.name);
      });
    });

    // ===== ИМПОРТ =====
    async function importFile(code, file) {
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(await file.arrayBuffer());
      const ws = wb.worksheets[0];
      const rows = [];
      ws.eachRow((row, n) => {
        if (n === 1) return; // пропускаем шапку
        const v = i => row.getCell(i).value;
        const d = i => { const x = v(i); return x instanceof Date ? x : null; };
        rows.push({
          stage: String(v(3) || ""),
          item: String(v(5) || v(4) || ""),
          planStart: d(6), planEnd: d(7),
          factStart: d(8), factEnd: d(9),
          cost: Number(v(10)) || 0,
          done: Number(v(11)) || 0,
          status: String(v(12) || "")
        });
      });
      const res = await fetch("/api/reports/" + code, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rows })
      });
      const data = await res.json();
      alert(res.ok ? `Импортировано строк: ${data.count}` : "Ошибка: " + data.message);
    }
    document.querySelectorAll(".btn-import").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        document.querySelector(`.file-import[data-code="${btn.dataset.code}"]`).click();
      });
    });
    document.querySelectorAll(".file-import").forEach(inp => {
      inp.addEventListener("change", () => {
        if (inp.files[0]) importFile(inp.dataset.code, inp.files[0]);
        inp.value = "";
      });
    });

    // ===== ДАШБОРД =====
    function money(n) {
      return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " €";
    }

    async function renderDashboard(code) {
      const dash = document.getElementById("dash-" + code);
      const res = await fetch("/api/reports/" + code);
      const data = await res.json();
      const rows = data.rows || [];
      
      const totalCost = rows.reduce((s, r) => s + (r.cost || 0), 0);
      const doneCost = rows.reduce((s, r) => s + (r.done || 0), 0);
      const donePct = totalCost ? Math.round(doneCost / totalCost * 100) : 0;
      const sumBy = f => {
        const sr = rows.filter(r => f.some(x => (r.stage || "").toLowerCase().includes(x)));
        return { cost: sr.reduce((s, r) => s + (r.cost || 0), 0), done: sr.reduce((s, r) => s + (r.done || 0), 0) };
      };
      const stProj = sumBy(["базовое", "детальн"]);
      const stSupply = sumBy(["поставка"]);
      const stSmr = sumBy(["смр", "строительн", "пнр"]);
      const now = new Date();
      const planCost = rows.reduce((s, r) => {
        if (!r.planStart || !r.planEnd) return s;
        const ps = new Date(r.planStart), pe = new Date(r.planEnd);
        if (now >= pe) return s + (r.cost || 0);
        if (now <= ps) return s;
        return s + (r.cost || 0) * (now - ps) / (pe - ps);
      }, 0);
      const planPct = totalCost ? Math.round(planCost / totalCost * 100) : 0;
      const delta = donePct - planPct;
      const dts = a => a.length ? new Date(Math.min(...a)) : null;
      const dte = a => a.length ? new Date(Math.max(...a)) : null;
      const fmt = d => d ? `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getFullYear()).slice(2)}` : "—";
      const planStart = dts(rows.filter(r => r.planStart).map(r => +new Date(r.planStart)));
      const planEnd = dte(rows.filter(r => r.planEnd).map(r => +new Date(r.planEnd)));
      const factStart = dts(rows.filter(r => r.factStart).map(r => +new Date(r.factStart)));
      const fcArr = rows.filter(r => r.forecastEnd).map(r => +new Date(r.forecastEnd));
      const forecastEnd = fcArr.length ? dte(fcArr) : planEnd;
      const late = forecastEnd && planEnd && forecastEnd > planEnd;
      dash.innerHTML = `
        <div class="kpi-row">
          <div class="kpi-card">
            <div class="kpi-flex">
              <div>
                <div class="kpi-label">Стоимость проекта</div>
                <div class="kpi-big">${money(totalCost).replace(" €", "")}</div>
              </div>
              <div>
                <div class="kpi-label">Освоено всего</div>
                <div class="kpi-big">${money(doneCost).replace(" €", "")}</div>
              </div>
            </div>
            <div class="kpi-stages">
              <div class="kpi-stage-row"><span>Проектирование</span><span>${money(stProj.cost)} / ${money(stProj.done)}</span></div>
              <div class="kpi-stage-row"><span>Поставка</span><span>${money(stSupply.cost)} / ${money(stSupply.done)}</span></div>
              <div class="kpi-stage-row"><span>Строительство и ПНР</span><span>${money(stSmr.cost)} / ${money(stSmr.done)}</span></div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Общий прогресс</div>
            <div class="kpi-flex">
              <div>
                <div class="kpi-label">План</div>
                <div class="kpi-big">${planPct}%</div>
              </div>
              <div>
                <div class="kpi-label">Факт</div>
                <div class="kpi-big">${donePct}%</div>
              </div>
            </div>
            <div class="kpi-badge ${delta < 0 ? "bad" : "good"}">${delta < 0 ? "Отставание " : "Опережение +"}${delta}%</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Сроки</div>
            <div class="kpi-label">План начало / окончание</div>
            <div class="kpi-dates">${fmt(planStart)} → ${fmt(planEnd)}</div>
            <div class="kpi-label">Факт начало</div>
            <div class="kpi-mid">${fmt(factStart)}</div>
            <div class="kpi-label" style="margin-top:6px;">Прогноз окончания</div>
            <div class="kpi-badge ${late ? "bad" : "good"}">${fmt(forecastEnd)}</div>
          </div>
          <div class="kpi-card kpi-wide">
            <div class="kpi-label">Примечание / комментарий</div>
            <textarea class="kpi-comment-edit" id="comment-${code}" placeholder="Место для текстового комментария по проекту — риски, причины отставания, ключевые события за период." onblur="saveComment('${code}')" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${data.comment || ""}</textarea>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-title">s-кривая — план / факт (накопительно и за период)</div>
          <div class="chart-wrap"><canvas id="chart-${code}"></canvas></div>
        </div>
        <div class="stage-row">
          <div class="stage-card">
            <div class="chart-title">проектирование</div>
            <table class="stage-table">
              <thead><tr><th>Дисциплина</th><th>План</th><th>Факт</th><th>Δ</th><th>План. даты</th></tr></thead>
              <tbody>${stageTable(rows, ["базовое", "детальн"])}</tbody>
            </table>
          </div>
          <div class="stage-card">
            <div class="chart-title">поставка</div>
            <table class="stage-table">
              <thead><tr><th>Этап</th><th>Кол-во</th><th>Статус</th></tr></thead>
              <tbody>${supplyTable(rows)}</tbody>
            </table>
          </div>
          <div class="stage-card">
            <div class="chart-title">смр и пнр</div>
            <table class="stage-table">
              <thead><tr><th>Дисциплина</th><th>План</th><th>Факт</th><th>Δ</th><th>План. даты</th></tr></thead>
              <tbody>${stageTable(rows, ["смр", "строительн", "пнр"])}</tbody>
            </table>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Диаграмма Ганта — этапы проекта</div>
          ${ganttHtml(rows)}
        </div>`;
        buildChart(code, rows);
        applyRole();
    }

    const charts = {};

    const SUPPLY_STAGES = [
      "Техническая характеристика",
      "Размещение заказа",
      "Изготовление",
      "Контроль и обеспечение качества",
      "Готовность к отгрузке",
      "Отгрузка",
      "Таможенная очистка",
      "Доставка на склад",
      "Доставка на строительную площадку",
      "Входной контроль на площадке"
    ];

    function supplyTable(rows) {
      const data = {};
      rows.filter(r => (r.stage || "").toLowerCase().includes("поставка")).forEach(r => {
        const key = (r.item || "").trim().replace(/\s+/g, " ").toLowerCase();
        if (!data[key]) data[key] = { total: 0, done: 0 };
        data[key].total += r.cost || 0;
        data[key].done += r.done || 0;
      });
      return SUPPLY_STAGES.map(name => {
        const d = data[name.toLowerCase()];
        if (!d || !d.total) return `<tr><td>${name}</td><td class="st-num">—</td><td class="st-delta">—</td></tr>`;
        const left = d.total - d.done;
        const cls = left > 0 ? "st-bad" : "st-good";
        return `<tr><td>${name}</td><td class="st-num">${d.done} из ${d.total}</td><td class="st-delta ${cls}">${left > 0 ? "ост. " + left : "готово"}</td></tr>`;
      }).join("");
    }
    function stageTable(rows, stageFilter) {
      const groups = {};
      const now = new Date();
      rows.filter(r => stageFilter.some(s => (r.stage || "").toLowerCase().includes(s))).forEach(r => {
        const clean = (r.item || "Без дисциплины").trim().replace(/\s+/g, " ");
        const key = clean.toLowerCase();
        if (!groups[key]) groups[key] = { name: clean[0].toUpperCase() + clean.slice(1).toLowerCase(), cost: 0, done: 0, plan: 0, starts: [], ends: [] };
        const g = groups[key];
        g.cost += r.cost || 0;
        g.done += r.done || 0;
        if (r.planStart && r.planEnd) {
          const ps = new Date(r.planStart), pe = new Date(r.planEnd);
          g.starts.push(+ps); g.ends.push(+pe);
          if (now >= pe) g.plan += r.cost || 0;
          else if (now > ps) g.plan += (r.cost || 0) * (now - ps) / (pe - ps);
        }
      });
      const keys = Object.keys(groups);
      if (!keys.length) return `<tr><td class="st-empty" colspan="5">Нет данных</td></tr>`;
      const fmt2 = d => `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getFullYear()).slice(2)}`;
      return keys.map(k => {
        const g = groups[k];
        const planPct = g.cost ? Math.round(g.plan / g.cost * 100) : 0;
        const factPct = g.cost ? Math.round(g.done / g.cost * 100) : 0;
        const delta = factPct - planPct;
        const cls = delta < 0 ? "st-bad" : "st-good";
        const dates = g.starts.length ? fmt2(new Date(Math.min(...g.starts))) + " → " + fmt2(new Date(Math.max(...g.ends))) : "—";
        return `<tr><td>${g.name}</td><td class="st-num">${planPct}%</td><td class="st-num">${factPct}%</td><td class="st-delta ${cls}">${delta < 0 ? delta : "+" + delta}%</td><td class="st-date">${dates}</td></tr>`;
      }).join("");
    }

    function buildChart(code, rows) {
      const byMonth = {};
      rows.forEach(r => {
        if (!r.planStart || !r.planEnd) return;
        const ps = new Date(r.planStart), pe = new Date(r.planEnd);
        const months = (pe.getFullYear() - ps.getFullYear()) * 12 + (pe.getMonth() - ps.getMonth()) + 1;
        const perMonth = (r.cost || 0) / months;
        const d = new Date(ps.getFullYear(), ps.getMonth(), 1);
        for (let i = 0; i < months; i++) {
          const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          byMonth[key] = byMonth[key] || { plan: 0, fact: 0 };
          byMonth[key].plan += perMonth;
          d.setMonth(d.getMonth() + 1);
        }
      });
      rows.forEach(r => {
        if (!r.factStart) return;
        const fs = new Date(r.factStart);
        const fe = r.factEnd ? new Date(r.factEnd) : new Date();
        const months = (fe.getFullYear() - fs.getFullYear()) * 12 + (fe.getMonth() - fs.getMonth()) + 1;
        const perMonth = (r.done || 0) / months;
        const d = new Date(fs.getFullYear(), fs.getMonth(), 1);
        for (let i = 0; i < months; i++) {
          const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          byMonth[key] = byMonth[key] || { plan: 0, fact: 0 };
          byMonth[key].fact += perMonth;
          d.setMonth(d.getMonth() + 1);
        }
      });
      const keys = Object.keys(byMonth).sort();
      const total = rows.reduce((s, r) => s + (r.cost || 0), 0) || 1;
      const now = new Date();
      const nowKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
      let cp = 0, cf = 0;
      const labels = [], planCum = [], factCum = [], planPer = [], factPer = [];
      keys.forEach(k => {
        cp += byMonth[k].plan; cf += byMonth[k].fact;
        labels.push(k.slice(5) + "." + k.slice(2, 4));
        planCum.push(Math.round(cp / total * 100));
        factCum.push(k <= nowKey ? Math.round(cf / total * 100) : null);
        planPer.push(Math.round(byMonth[k].plan / total * 100 * 10) / 10);
        factPer.push(k <= nowKey ? Math.round(byMonth[k].fact / total * 100 * 10) / 10 : null);
      });
      if (charts[code]) charts[code].destroy();
      charts[code] = new Chart(document.getElementById("chart-" + code), {
        data: {
          labels,
          datasets: [
            { type: "line", label: "План накопительно", data: planCum, borderColor: "#0a1e3d", borderWidth: 2.5, pointRadius: 0, tension: 0.3 },
            { type: "line", label: "Факт накопительно", data: factCum, borderColor: "#7da7d9", borderWidth: 2.5, pointRadius: 0, tension: 0.3 },
            { type: "bar", label: "План за месяц", data: planPer, backgroundColor: "#0a1e3d" },
            { type: "bar", label: "Факт за месяц", data: factPer, backgroundColor: "#7da7d9" }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
          scales: {
            y: { min: 0, max: 100, ticks: { callback: v => v + "%" } },
            x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 45 } }
          }
        }
      });
    }

    function ganttHtml(rows) {
      const stages = [
        { name: "Базовое проектирование", f: ["базовое"] },
        { name: "Детальное проектирование", f: ["детальн"] },
        { name: "Поставка", f: ["поставка"] },
        { name: "СМР", f: ["смр", "строительн"] },
        { name: "ПНР", f: ["пнр"] }
      ];
      const items = stages.map(s => {
        const sr = rows.filter(r => s.f.some(x => (r.stage || "").toLowerCase().includes(x)) && r.planStart && r.planEnd);
        if (!sr.length) return { name: s.name, start: null };
        return {
          name: s.name,
          start: Math.min(...sr.map(r => +new Date(r.planStart))),
          end: Math.max(...sr.map(r => +new Date(r.planEnd)))
        };
      });
      const has = items.filter(i => i.start);
      if (!has.length) return `<div class="st-empty">Нет данных для диаграммы</div>`;
      const minD = new Date(Math.min(...has.map(i => i.start)));
      const maxD = new Date(Math.max(...has.map(i => i.end)));
      const min = +new Date(minD.getFullYear(), minD.getMonth(), 1);
      const max = +new Date(maxD.getFullYear(), maxD.getMonth() + 1, 0);
      const span = max - min || 1;
      const now = Date.now();
      const nowPct = Math.max(0, Math.min(100, (now - min) / span * 100));

      const months = [];
      const cur = new Date(min);
      while (+cur <= max) {
        months.push({ y: cur.getFullYear(), m: cur.getMonth() + 1 });
        cur.setMonth(cur.getMonth() + 1);
      }
      const mW = 100 / months.length;
      const years = {};
      months.forEach(mo => years[mo.y] = (years[mo.y] || 0) + 1);
      let scale = `<div class="gantt-row"><div class="gantt-label"></div><div class="gantt-scale">`;
      Object.keys(years).sort().forEach(y => {
        scale += `<div class="gantt-year" style="width:${years[y] * mW}%">${y}</div>`;
      });
      scale += `</div></div><div class="gantt-row"><div class="gantt-label"></div><div class="gantt-scale">`;
      months.forEach(mo => {
        scale += `<div class="gantt-month" style="width:${mW}%">${String(mo.m).padStart(2, "0")}</div>`;
      });
      scale += `</div></div>`;

      let html = `<div class="gantt">` + scale;
      items.forEach(i => {
        html += `<div class="gantt-row"><div class="gantt-label">${i.name}</div><div class="gantt-track">`;
        if (i.start) {
          const left = (i.start - min) / span * 100;
          const width = (i.end - i.start) / span * 100;
          const doneW = Math.max(0, Math.min(100, (now - i.start) / (i.end - i.start) * 100));
          html += `<div class="gantt-bar" style="left:${left}%;width:${width}%">` +
                  `<div class="gantt-done" style="width:${doneW}%"></div>` +
                  `<span class="gantt-dates">${i.name.length < 15 ? "" : ""}</span></div>`;
        }
        html += `</div></div>`;
      });
      html += `<div class="gantt-now" style="left:calc(140px + (100% - 140px) * ${nowPct / 100})"></div></div>`;
      return html;
    }

    async function saveComment(code) {
      const text = document.getElementById("comment-" + code).value;
      const res = await fetch("/api/reports/" + code, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ comment: text })
      });
      if (!res.ok) alert("Ошибка сохранения комментария");
    }

    // Раскрытие/скрытие панели проекта
    document.querySelectorAll(".project-item").forEach(item => {
      item.addEventListener("click", () => {
        const code = item.dataset.code;
        const panel = document.getElementById("panel-" + code);
        const isOpen = panel.classList.contains("open");
        item.classList.toggle("open", !isOpen);
        panel.classList.toggle("open", !isOpen);
        if (!isOpen) renderDashboard(code);
      });
    });
  </script>
</body>
</html>
